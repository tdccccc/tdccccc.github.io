<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-label="Agent 四层评测框架与模型和脚手架 2×2 解耦实验矩阵：左侧涵盖终态结果、过程轨迹、环境状态、成本与安全边界四层；右侧展示冻结脚手架测模型与冻结模型测脚手架的交叉矩阵及脚手架作弊红线">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.8px; fill: #64748b; }
    .panel-t { font-size: 14.5px; font-weight: 700; fill: #1e293b; }
    .layer-t { font-size: 13.5px; font-weight: 700; }
    .layer-s { font-size: 11.2px; fill: #475569; }
    .badge { font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    .cell-v { font-size: 17px; font-weight: 700; text-anchor: middle; }
    .cell-s { font-size: 10.8px; text-anchor: middle; }
    .th { font-size: 11.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="32" y="36" class="title">Agent 四层评测框架与「模型 × 脚手架」2×2 解耦实验矩阵</text>
  <text x="32" y="58" class="sub">左侧穿透表象结果审视多轮交互全链路；右侧通过控制变量交叉实验剥离底座模型（M）与脚手架（H）的各自贡献。</text>

  <!-- Left Panel: 4-Layer Framework -->
  <g>
    <rect x="32" y="76" width="468" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="48" y="101" class="panel-t">一、Agent 四层评测框架（从表象结果深入系统内核）</text>

    <!-- L1 -->
    <rect x="48" y="114" width="436" height="76" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.3"/>
    <rect x="54" y="123" width="4" height="58" rx="2" fill="#4f46e5"/>
    <rect x="68" y="124" width="36" height="20" rx="10" fill="#4f46e5"/>
    <text x="86" y="138" class="badge" fill="#ffffff">L1</text>
    <text x="112" y="139" class="layer-t" fill="#3730a3">终态结果层（Outcome）</text>
    <text x="470" y="138" font-size="11" font-weight="600" fill="#4f46e5" text-anchor="end">回答“做没做成”</text>
    <text x="68" y="160" class="layer-s">• 任务交付物精确匹配、隐藏单元测试通过率、加权 Rubrics 达标率</text>
    <text x="68" y="178" class="layer-s">• 双口径度量：探索上限 pass@k 与生产连续稳定性 pass^k（防偶然蒙对）</text>

    <line x1="266" y1="190" x2="266" y2="202" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <!-- L2 -->
    <rect x="48" y="204" width="436" height="76" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
    <rect x="54" y="213" width="4" height="58" rx="2" fill="#0284c7"/>
    <rect x="68" y="214" width="36" height="20" rx="10" fill="#0284c7"/>
    <text x="86" y="228" class="badge" fill="#ffffff">L2</text>
    <text x="112" y="229" class="layer-t" fill="#075985">过程轨迹层（Trajectory）</text>
    <text x="470" y="228" font-size="11" font-weight="600" fill="#0284c7" text-anchor="end">回答“怎么做的”</text>
    <text x="68" y="250" class="layer-s">• 工具选择准确率、参数 Schema 合法率、死循环/冗余重试步数占比</text>
    <text x="68" y="268" class="layer-s">• 报错自愈恢复率（Error Recovery）与阶段里程碑进度，定位具体断点轮次</text>

    <line x1="266" y1="280" x2="266" y2="292" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <!-- L3 -->
    <rect x="48" y="294" width="436" height="76" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
    <rect x="54" y="303" width="4" height="58" rx="2" fill="#059669"/>
    <rect x="68" y="304" width="36" height="20" rx="10" fill="#059669"/>
    <text x="86" y="318" class="badge" fill="#ffffff">L3</text>
    <text x="112" y="319" class="layer-t" fill="#065f46">环境状态层（Env State）</text>
    <text x="470" y="318" font-size="11" font-weight="600" fill="#059669" text-anchor="end">回答“有无脏副作用”</text>
    <text x="68" y="340" class="layer-s">• 校验外部真实终态：数据库终态哈希、文件系统 Diff、进程/端口与权限状态</text>
    <text x="68" y="358" class="layer-s">• 识破“口头宣称完成却未落库”与“绕道删库/篡改测试脚本”的假阳性通过</text>

    <line x1="266" y1="370" x2="266" y2="382" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <!-- L4 -->
    <rect x="48" y="384" width="436" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
    <rect x="54" y="393" width="4" height="60" rx="2" fill="#e11d48"/>
    <rect x="68" y="394" width="36" height="20" rx="10" fill="#e11d48"/>
    <text x="86" y="408" class="badge" fill="#ffffff">L4</text>
    <text x="112" y="409" class="layer-t" fill="#9f1239">成本与安全边界层（Guardrails）</text>
    <text x="470" y="408" font-size="11" font-weight="600" fill="#e11d48" text-anchor="end">回答“敢不敢上线”</text>
    <text x="68" y="430" class="layer-s">• 经济与时延约束：单任务美元开销 $/Task、P95 墙钟延迟、最大步数预算</text>
    <text x="68" y="448" class="layer-s">• 纵深安全红线：间接提示注入 ASR、不可逆写操作授权确认、越权调用阻断</text>
  </g>

  <!-- Right Panel: 2x2 Decoupling Matrix -->
  <g>
    <rect x="516" y="76" width="372" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="532" y="101" class="panel-t">二、模型（M）× 脚手架（H）2×2 解耦矩阵</text>
    <text x="532" y="121" class="mono" font-size="11" fill="#475569">S(M,H) = S₀ + Δ_model + Δ_scaffold + Δ_interact</text>

    <!-- Column headers -->
    <rect x="606" y="134" width="130" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="671" y="152" class="th">基线脚手架 H₀</text>
    <rect x="744" y="134" width="130" height="28" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="809" y="152" class="th" fill="#92400e">增强脚手架 H₁</text>

    <!-- Row 1: M0 -->
    <rect x="530" y="170" width="68" height="74" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="564" y="203" class="th">旧底座</text>
    <text x="564" y="220" class="mono" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">M₀</text>

    <rect x="606" y="170" width="130" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="671" y="198" class="cell-v" fill="#334155">52.0%</text>
    <text x="671" y="217" class="cell-s" fill="#64748b">参照基线 S(M₀,H₀)</text>
    <text x="671" y="233" class="cell-s" fill="#94a3b8">$0.14 / Task</text>

    <rect x="744" y="170" width="130" height="74" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <text x="809" y="198" class="cell-v" fill="#b45309">64.5%</text>
    <text x="809" y="217" class="cell-s" fill="#92400e" font-weight="600">Δ_scaffold = +12.5pp</text>
    <text x="809" y="233" class="cell-s" fill="#b45309">冻结底座测脚手架</text>

    <!-- Row 2: M1 -->
    <rect x="530" y="254" width="68" height="74" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="564" y="287" class="th" fill="#075985">新底座</text>
    <text x="564" y="304" class="mono" font-size="11.5" font-weight="700" fill="#075985" text-anchor="middle">M₁</text>

    <rect x="606" y="254" width="130" height="74" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
    <text x="671" y="282" class="cell-v" fill="#0369a1">66.0%</text>
    <text x="671" y="301" class="cell-s" fill="#075985" font-weight="600">Δ_model = +14.0pp</text>
    <text x="671" y="317" class="cell-s" fill="#0284c7">冻结脚手架测底座</text>

    <rect x="744" y="254" width="130" height="74" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="809" y="282" class="cell-v" fill="#047857">74.0%</text>
    <text x="809" y="301" class="cell-s" fill="#065f46" font-weight="600">Δ_interact = -4.5pp</text>
    <text x="809" y="317" class="cell-s" fill="#059669">强底座弱化冗余编排</text>

    <!-- Note about illustrative numbers -->
    <text x="702" y="346" font-size="9.6" fill="#64748b" text-anchor="middle">（教学算例：Δ_interact 为负，新底座在 H₁ 上存在过度编排冗余）</text>

    <!-- Scaffold anti-cheat audit box -->
    <rect x="530" y="358" width="344" height="104" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.3"/>
    <rect x="542" y="368" width="138" height="20" rx="10" fill="#d97706"/>
    <text x="611" y="382" class="badge" fill="#ffffff">脚手架隐性作弊审计红线</text>
    <text x="542" y="405" class="layer-s" fill="#78350f">• 隐藏重试伪装：循环重跑 5 次选最优却上报为 pass@1</text>
    <text x="542" y="424" class="layer-s" fill="#78350f">• 面向榜单硬编码：为基准专写正则/分支，上线即泛化坍塌</text>
    <text x="542" y="443" class="layer-s" fill="#78350f">• 静默吞错与无限重跑：包装报错无限重跑不留痕，掩盖失败</text>
  </g>
</svg>
