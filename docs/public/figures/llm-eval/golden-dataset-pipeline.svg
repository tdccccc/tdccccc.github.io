<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" role="img" aria-label="评测驱动开发（EDD）业务黄金评测集五步流水线：涵盖日志挖掘、能力风险矩阵、专家标注与 Rubrics、对抗合成过筛及版本冻结与轮换治理">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 21px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 13px; fill: #64748b; }
    .step-badge { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .step-title { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
    .step-item { font-size: 11.2px; fill: #334155; text-anchor: middle; }
    .panel-title { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .panel-sub { font-size: 11px; fill: #64748b; }
    .q-title { font-size: 12px; font-weight: 700; }
    .q-desc { font-size: 10.6px; fill: #475569; }
    .pill { font-size: 11px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="edd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="edd-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="436" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="32" y="36" class="title">评测驱动开发（EDD）：从零构建业务黄金评测集五步流水线</text>
  <text x="32" y="58" class="sub">先立标尺，再调 Prompt、脚手架或微调模型；将业务隐性标准转化为可版本化、防过拟合的测量资产。</text>

  <!-- Step 1 -->
  <g>
    <rect x="32" y="80" width="154" height="148" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="64" y="92" width="90" height="20" rx="10" fill="#0284c7"/>
    <text x="109" y="106" class="step-badge">STEP 01</text>
    <text x="109" y="132" class="step-title" fill="#075985">真实日志挖掘</text>
    <line x1="48" y1="142" x2="170" y2="142" stroke="#bae6fd" stroke-width="1"/>
    <text x="109" y="160" class="step-item">线上日志与客诉收集</text>
    <text x="109" y="179" class="step-item">PII 脱敏与结构保真</text>
    <text x="109" y="198" class="step-item">语义去重防簇膨胀</text>
    <text x="109" y="216" class="step-item">按意图与长尾分层</text>
  </g>
  <line x1="186" y1="154" x2="204" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#edd-arrow)"/>

  <!-- Step 2 -->
  <g>
    <rect x="208" y="80" width="154" height="148" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <rect x="240" y="92" width="90" height="20" rx="10" fill="#4f46e5"/>
    <text x="285" y="106" class="step-badge">STEP 02</text>
    <text x="285" y="132" class="step-title" fill="#3730a3">能力×风险矩阵</text>
    <line x1="224" y1="142" x2="346" y2="142" stroke="#c7d2fe" stroke-width="1"/>
    <text x="285" y="160" class="step-item">高频主路径保 ROI</text>
    <text x="285" y="179" class="step-item">长尾复杂多步任务</text>
    <text x="285" y="198" class="step-item">边界与诚实拒答题</text>
    <text x="285" y="216" class="step-item">合规安全红线切片</text>
  </g>
  <line x1="362" y1="154" x2="380" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#edd-arrow)"/>

  <!-- Step 3 -->
  <g>
    <rect x="384" y="80" width="154" height="148" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <rect x="416" y="92" width="90" height="20" rx="10" fill="#d97706"/>
    <text x="461" y="106" class="step-badge">STEP 03</text>
    <text x="461" y="132" class="step-title" fill="#92400e">专家 Rubrics 细化</text>
    <line x1="400" y1="142" x2="522" y2="142" stroke="#fde68a" stroke-width="1"/>
    <text x="461" y="160" class="step-item">拆为二值检查项清单</text>
    <text x="461" y="179" class="step-item">双人盲标 κ ≥ 0.75</text>
    <text x="461" y="198" class="step-item">定义致命一票否决项</text>
    <text x="461" y="216" class="step-item">沉淀金标校准 (q₁, q₀)</text>
  </g>
  <line x1="538" y1="154" x2="556" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#edd-arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="560" y="80" width="154" height="148" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <rect x="592" y="92" width="90" height="20" rx="10" fill="#e11d48"/>
    <text x="637" y="106" class="step-badge">STEP 04</text>
    <text x="637" y="132" class="step-title" fill="#9f1239">对抗样本定向合成</text>
    <line x1="576" y1="142" x2="698" y2="142" stroke="#fecdd3" stroke-width="1"/>
    <text x="637" y="160" class="step-item">按失败谱系扩增稀缺题</text>
    <text x="637" y="179" class="step-item">跨模型族生成防同源</text>
    <text x="637" y="198" class="step-item">专家逐条验收过筛</text>
    <text x="637" y="216" class="step-item">严禁同模型自生自判</text>
  </g>
  <line x1="714" y1="154" x2="732" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#edd-arrow)"/>

  <!-- Step 5 -->
  <g>
    <rect x="736" y="80" width="152" height="148" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
    <rect x="767" y="92" width="90" height="20" rx="10" fill="#059669"/>
    <text x="812" y="106" class="step-badge">STEP 05</text>
    <text x="812" y="132" class="step-title" fill="#065f46">版本冻结与轮换</text>
    <line x1="752" y1="142" x2="872" y2="142" stroke="#a7f3d0" stroke-width="1"/>
    <text x="812" y="160" class="step-item">语义化版本 + SHA256</text>
    <text x="812" y="179" class="step-item">Dev / Holdout 物理切分</text>
    <text x="812" y="198" class="step-item">固定核心 + 滚动新鲜</text>
    <text x="812" y="216" class="step-item">季度淘汰饱和低区分题</text>
  </g>

  <!-- Bottom Left Panel: 能力 × 风险二维覆盖矩阵 -->
  <g>
    <rect x="32" y="246" width="420" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="48" y="270" class="panel-title">二维覆盖配比参考（能力复杂度 × 业务风险）</text>
    <text x="48" y="287" class="panel-sub">避免“按线上自然流量均匀抽样”导致低频高危边界场景被淹没</text>

    <rect x="48" y="298" width="188" height="48" rx="7" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="58" y="317" class="q-title" fill="#075985">① 高频主路径（35%–40%）</text>
    <text x="58" y="335" class="q-desc">核心转化链路 · 盯紧 MDE 与延迟</text>

    <rect x="248" y="298" width="188" height="48" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="258" y="317" class="q-title" fill="#3730a3">② 长尾复杂场景（25%–30%）</text>
    <text x="258" y="335" class="q-desc">跨文档冲突 · 多跳推理 · 工具组合</text>

    <rect x="48" y="354" width="188" height="48" rx="7" fill="#fffbeb" stroke="#fde68a"/>
    <text x="58" y="373" class="q-title" fill="#92400e">③ 边界与拒答（15%–20%）</text>
    <text x="58" y="391" class="q-desc">证据缺失 · 过期条款 · 诚实说不知道</text>

    <rect x="248" y="354" width="188" height="48" rx="7" fill="#fef2f2" stroke="#fecdd3"/>
    <text x="258" y="373" class="q-title" fill="#9f1239">④ 安全合规红线（~15%）</text>
    <text x="258" y="391" class="q-desc">间接注入 · 越权操作 · 零容忍闸门</text>
  </g>

  <!-- Bottom Right Panel: 版本治理、物理切分与周期性轮换 -->
  <g>
    <rect x="468" y="246" width="420" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="484" y="270" class="panel-title">防过拟合治理：物理切分与季度滚动轮换（v1.0 → v1.1）</text>
    <text x="484" y="287" class="panel-sub">既保持跨版本纵向可比性，又抵御业务漂移与人工“背题式调优”</text>

    <!-- Dev vs Holdout split -->
    <rect x="484" y="299" width="236" height="46" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="602" y="318" class="q-title" fill="#065f46" text-anchor="middle">Dev 开发回归集（约 70%）</text>
    <text x="602" y="335" class="q-desc" text-anchor="middle">研发可见 · 用于 Open Coding 与迭代调试</text>

    <line x1="728" y1="299" x2="728" y2="345" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 3"/>

    <rect x="736" y="299" width="136" height="46" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="804" y="318" class="q-title" fill="#9f1239" text-anchor="middle">Holdout 锁库（30%）</text>
    <text x="804" y="335" class="q-desc" text-anchor="middle">权限隔离 · 仅 CI 发布裁判</text>

    <!-- Rotation bar -->
    <rect x="484" y="357" width="246" height="44" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="607" y="376" class="q-title" fill="#334155" text-anchor="middle">70% 固定核心回归切片（Pinned Core）</text>
    <text x="607" y="392" class="q-desc" text-anchor="middle">跨季度锚定纵向基线，监控历史能力退化</text>

    <path d="M735,379 L752,379" stroke="#059669" stroke-width="1.6" marker-end="url(#edd-arrow-green)"/>

    <rect x="756" y="357" width="116" height="44" rx="7" fill="#d1fae5" stroke="#34d399"/>
    <text x="814" y="376" class="q-title" fill="#065f46" text-anchor="middle">30% 滚动新鲜集</text>
    <text x="814" y="392" class="q-desc" text-anchor="middle">每季换入线上新题</text>
  </g>
</svg>
