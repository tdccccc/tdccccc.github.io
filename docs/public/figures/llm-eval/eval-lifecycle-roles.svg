<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" role="img" aria-label="评测的三重工程角色与观测分四类误差分解：模型选型、RLVR 训练指南针与生产上线闸门，以及观测分数分解为真实能力加判分偏差、环境噪声与有限抽样方差">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 13px; fill: #64748b; }
    .card-t { font-size: 14.5px; font-weight: 700; }
    .card-s { font-size: 11.8px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    .eq-t { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .eq-s { font-size: 10.3px; fill: #475569; text-anchor: middle; }
    .sym { font-size: 22px; font-weight: 700; fill: #64748b; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="436" rx="8" fill="#fbfcfe"/>

  <!-- Header -->
  <text x="34" y="36" class="title">评测的三重工程角色与全链路误差分解</text>
  <text x="34" y="58" class="sub">评测不仅是模型选型标尺与上线闸门，更在后训练阶段与 RLVR 奖励信号互为镜像；一切观测分数都必须拆解四类误差来源。</text>

  <!-- Top Section: Three Lifecycle Roles -->
  <!-- Role 1 -->
  <g>
    <rect x="34" y="78" width="262" height="148" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="48" y="90" width="90" height="22" rx="11" fill="#059669"/>
    <text x="93" y="105" class="pill" fill="#ffffff">ROLE 01 · 选型</text>
    <text x="48" y="134" class="card-t" fill="#065f46">底座模型选型与路由标尺</text>
    <text x="48" y="158" class="card-s">• 跨家族对比知识、推理、长文与工具能力</text>
    <text x="48" y="179" class="card-s">• 绘制质量 × 成本 × 延迟帕累托前沿</text>
    <text x="48" y="200" class="card-s">• 核心要求：跨家族无偏、防数据污染</text>
  </g>

  <line x1="296" y1="152" x2="324" y2="152" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- Role 2 -->
  <g>
    <rect x="328" y="78" width="264" height="148" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="342" y="90" width="122" height="22" rx="11" fill="#4f46e5"/>
    <text x="403" y="105" class="pill" fill="#ffffff">ROLE 02 · RLVR 镜像</text>
    <text x="342" y="134" class="card-t" fill="#3730a3">后训练与脚手架迭代指南针</text>
    <text x="342" y="158" class="card-s">• 确定性验证器即 RLVR 训练奖励信号</text>
    <text x="342" y="179" class="card-s">• 监控每轮检查点涨跌、早停与熵坍缩</text>
    <text x="342" y="200" class="card-s">• 核心要求：高配对功效、抗 Goodhart 刷分</text>
  </g>

  <line x1="592" y1="152" x2="620" y2="152" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>

  <!-- Role 3 -->
  <g>
    <rect x="624" y="78" width="262" height="148" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="638" y="90" width="90" height="22" rx="11" fill="#d97706"/>
    <text x="683" y="105" class="pill" fill="#ffffff">ROLE 03 · 闸门</text>
    <text x="638" y="134" class="card-t" fill="#92400e">CI/CD 上线闸门与回归防线</text>
    <text x="638" y="158" class="card-s">• 拦截 Prompt / 工具 / 量化迁移精度回退</text>
    <text x="638" y="179" class="card-s">• 考核连续可靠性 pass^k 与安全红线</text>
    <text x="638" y="200" class="card-s">• 核心要求：沙箱可复现、infra 异常隔离</text>
  </g>

  <!-- Feedback Loop Arrow -->
  <path d="M 755 226 L 755 252 L 165 252 L 165 229" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <path d="M 460 252 L 460 229" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>
  <rect x="330" y="241" width="260" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="460" y="256" class="pill" fill="#92400e">线上失败轨迹沉淀 → 黄金集与训练数据闭环</text>

  <!-- Divider -->
  <line x1="34" y1="278" x2="886" y2="278" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="34" y="296" font-size="13.5" font-weight="700" fill="#1e293b">观测分数的四项误差分解（全书统一视角）</text>

  <!-- Bottom Section: Four-term Error Decomposition -->
  <!-- LHS Box -->
  <rect x="34" y="310" width="134" height="106" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="101" y="344" class="eq-t mono" fill="#0f172a">Ŝ(M, H)</text>
  <text x="101" y="368" class="eq-s">评测跑出的</text>
  <text x="101" y="386" class="eq-s">表观观测分数</text>
  <text x="101" y="404" font-size="10.5" fill="#64748b" text-anchor="middle">（榜单/报表数字）</text>

  <text x="184" y="370" class="sym">=</text>

  <!-- Term 1: True Signal -->
  <rect x="200" y="310" width="154" height="106" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.6"/>
  <text x="277" y="340" class="eq-t mono" fill="#065f46">S*(M, H)</text>
  <text x="277" y="362" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">真实能力信号</text>
  <text x="277" y="382" class="eq-s">模型 × 脚手架的</text>
  <text x="277" y="399" class="eq-s">真实泛化水平（Ch 8）</text>

  <text x="368" y="370" class="sym">+</text>

  <!-- Term 2: Judge Bias -->
  <rect x="382" y="310" width="154" height="106" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="459" y="340" class="eq-t mono" fill="#9f1239">δ_judge</text>
  <text x="459" y="362" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">判分器系统偏差</text>
  <text x="459" y="382" class="eq-s">单测漏洞 · Judge 偏见</text>
  <text x="459" y="399" class="eq-s">Rogan-Gladen 矫正（Ch 3）</text>

  <text x="550" y="370" class="sym">+</text>

  <!-- Term 3: Env Noise -->
  <rect x="564" y="310" width="154" height="106" rx="9" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="641" y="340" class="eq-t mono" fill="#075985">δ_env</text>
  <text x="641" y="362" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">环境与基建噪声</text>
  <text x="641" y="382" class="eq-s">模板截断 · 429/OOM 混入</text>
  <text x="641" y="399" class="eq-s">沙箱与回放治理（Ch 13–14）</text>

  <text x="732" y="370" class="sym">+</text>

  <!-- Term 4: Sampling Variance -->
  <rect x="746" y="310" width="140" height="106" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="816" y="340" class="eq-t mono" fill="#92400e">ε_sample</text>
  <text x="816" y="362" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">有限抽样方差</text>
  <text x="816" y="382" class="eq-s">题量 MDE · 聚类 DEFF</text>
  <text x="816" y="399" class="eq-s">配对检验降噪（Ch 1–2）</text>
</svg>
