<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-label="推理思考效率帕累托前沿与多模态去图盲测清洗对照图：左侧展示准确率随思考 Token 的帕累托前沿与过度思考拐点；右侧展示 VLM 基准经去图盲测清洗前后的纯文本捷径与净视觉增益占比">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.8px; fill: #64748b; }
    .panel-t { font-size: 14.5px; font-weight: 700; fill: #1e293b; }
    .panel-s { font-size: 11px; fill: #64748b; }
    .axis-t { font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .tick { font-size: 10.2px; fill: #64748b; }
    .lbl { font-size: 10.4px; font-weight: 700; }
    .note { font-size: 10.2px; fill: #334155; }
    .badge { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .step-t { font-size: 10px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-p6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-over" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="920" height="470" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="34" y="36" class="title">推理思考效率帕累托前沿与 VLM 去图盲测清洗</text>
  <text x="34" y="58" class="sub">左：单看峰值准确率会隐藏 5–10× 思考耗时与过度思考回落（教学示意）；右：剔除“不看图也能答对”的文本捷径才能测出真视觉能力。</text>

  <!-- ==================== LEFT PANEL: Reasoning Efficiency Pareto ==================== -->
  <g>
    <rect x="34" y="76" width="446" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
    <rect x="42" y="86" width="4" height="28" rx="2" fill="#4f46e5"/>
    <text x="54" y="100" class="panel-t">面板 A · 准确率 vs 思考 Token 效率帕累托</text>
    <text x="54" y="116" class="panel-s">越靠近左上角越高效；盲目拉长思考预算易触发“自我推翻”回落</text>

    <!-- Plot Box: x=90..454 (width=364), y=136..336 (height=200) -->
    <!-- Sweet-Spot Shaded Region -->
    <rect x="176" y="144" width="114" height="72" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-dasharray="3,3"/>
    <text x="233" y="156" class="badge" fill="#065f46">业务性价比甜点区</text>

    <!-- Grid Lines: 90%=136, 75%=186, 60%=236, 45%=286, 30%=336 -->
    <line x1="90" y1="136" x2="454" y2="136" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="90" y1="186" x2="454" y2="186" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="90" y1="236" x2="454" y2="236" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="90" y1="286" x2="454" y2="286" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Axes -->
    <line x1="90" y1="132" x2="90" y2="336" stroke="#475569" stroke-width="1.4"/>
    <line x1="90" y1="336" x2="456" y2="336" stroke="#475569" stroke-width="1.4"/>

    <!-- Y-axis ticks -->
    <text x="83" y="140" class="tick" text-anchor="end">90%</text>
    <text x="83" y="190" class="tick" text-anchor="end">75%</text>
    <text x="83" y="240" class="tick" text-anchor="end">60%</text>
    <text x="83" y="290" class="tick" text-anchor="end">45%</text>
    <text x="83" y="340" class="tick" text-anchor="end">30%</text>
    <text x="52" y="236" class="axis-t" transform="rotate(-90 52 236)">数学 / 代码准确率</text>

    <!-- X-axis ticks (log): 500=90, 1K=150, 2K=210, 4K=270, 8K=330, 16K=390, 32K=450 -->
    <text x="90" y="352" class="tick mono" text-anchor="middle">0.5K</text>
    <text x="150" y="352" class="tick mono" text-anchor="middle">1K</text>
    <text x="210" y="352" class="tick mono" text-anchor="middle">2K</text>
    <text x="270" y="352" class="tick mono" text-anchor="middle">4K</text>
    <text x="330" y="352" class="tick mono" text-anchor="middle">8K</text>
    <text x="390" y="352" class="tick mono" text-anchor="middle">16K</text>
    <text x="448" y="352" class="tick mono" text-anchor="middle">32K</text>
    <text x="272" y="370" class="axis-t">平均思考 Token / 题（对数刻度 · 线性正比于耗时与成本）</text>

    <!-- Pareto Frontier Curve (Indigo #4f46e5): (0.5K,48%)->(90,276), (1K,64%)->(150,223), (2K,75%)->(210,186), (4K,81%)->(270,166), (8K,84.5%)->(330,154), (16K,86%)->(390,149) -->
    <path d="M90,276 C118,248 134,235 150,223 C178,203 194,194 210,186 C236,174 254,170 270,166 C298,159 314,156 330,154 C358,151 374,150 390,149" fill="none" stroke="#4f46e5" stroke-width="2.8"/>
    <circle cx="90" cy="276" r="4" fill="#4f46e5"/>
    <circle cx="150" cy="223" r="4" fill="#4f46e5"/>
    <circle cx="210" cy="186" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="270" cy="166" r="4.5" fill="#059669" stroke="#ffffff" stroke-width="1.4"/>
    <circle cx="330" cy="154" r="4" fill="#4f46e5"/>
    <circle cx="390" cy="149" r="4" fill="#4f46e5"/>

    <text x="98" y="294" class="lbl" fill="#3730a3">快思考 Low</text>
    <text x="203" y="174" class="lbl" fill="#047857" text-anchor="middle">均衡档 Med</text>
    <text x="330" y="142" class="lbl" fill="#3730a3" text-anchor="middle">深度档 High</text>

    <!-- Overthinking Curve (Rose #e11d48): medium-difficulty tasks peaking at 3K then dropping past 8K -> (150,238) -> (240,192) -> (330,194) -> (390,214) -> (444,242) -->
    <path d="M150,238 C186,214 214,198 240,192 C274,185 304,188 330,194 C362,202 376,208 390,214 C412,225 428,233 442,240" fill="none" stroke="#e11d48" stroke-width="2.3" stroke-dasharray="5,3" marker-end="url(#arr-over)"/>
    <circle cx="240" cy="192" r="3.5" fill="#e11d48"/>
    <circle cx="390" cy="214" r="3.5" fill="#e11d48"/>
    <rect x="322" y="246" width="128" height="36" rx="5" fill="#fff1f2" stroke="#fda4af"/>
    <text x="386" y="261" class="badge" fill="#9f1239">过度思考拐点</text>
    <text x="386" y="275" font-size="9.4" fill="#be123c" text-anchor="middle">反复验算→推翻原正确解</text>

    <!-- Dominated Model Point -->
    <circle cx="348" cy="298" r="4.5" fill="#94a3b8"/>
    <text x="348" y="316" font-size="9.8" fill="#64748b" text-anchor="middle">被支配模型（慢且分低）</text>

    <!-- Bottom Legend -->
    <rect x="52" y="386" width="410" height="44" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="66" y1="402" x2="86" y2="402" stroke="#4f46e5" stroke-width="2.6"/>
    <text x="92" y="406" class="note">预算扩展帕累托前沿（AUBC 越大越优）</text>
    <line x1="66" y1="420" x2="86" y2="420" stroke="#e11d48" stroke-width="2.3" stroke-dasharray="5,2"/>
    <text x="92" y="424" class="note">中低难题上的过度思考回落曲线（Overthinking）</text>
  </g>

  <!-- ==================== RIGHT PANEL: VLM Blind-Test Filtering ==================== -->
  <g>
    <rect x="496" y="76" width="390" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
    <rect x="504" y="86" width="4" height="28" rx="2" fill="#0284c7"/>
    <text x="516" y="100" class="panel-t">面板 B · VLM 去图盲测（Blind-Test）清洗</text>
    <text x="516" y="116" class="panel-s">拆分“纯文本常识蒙对”与“真实净视觉增益 Δ_vis”</text>

    <!-- Stacked Vertical Bar Chart: y=144..294 (height=150 for 100%) -->
    <line x1="546" y1="144" x2="864" y2="144" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="546" y1="181.5" x2="864" y2="181.5" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="546" y1="219" x2="864" y2="219" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="546" y1="256.5" x2="864" y2="256.5" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="546" y1="140" x2="546" y2="294" stroke="#475569" stroke-width="1.3"/>
    <line x1="546" y1="294" x2="866" y2="294" stroke="#475569" stroke-width="1.3"/>

    <!-- Y ticks -->
    <text x="540" y="148" class="tick" text-anchor="end">100%</text>
    <text x="540" y="185" class="tick" text-anchor="end">75%</text>
    <text x="540" y="223" class="tick" text-anchor="end">50%</text>
    <text x="540" y="260" class="tick" text-anchor="end">25%</text>
    <text x="540" y="298" class="tick" text-anchor="end">0%</text>

    <!-- Bar 1: Raw Legacy VQA (4-opt) -> Blind 44% (66px: y=228..294), Net Vis 28% (42px: y=186..228), Error 28% -->
    <rect x="576" y="144" width="64" height="42" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="576" y="186" width="64" height="42" fill="#0284c7" rx="2"/>
    <rect x="576" y="228" width="64" height="66" fill="#f59e0b"/>
    <text x="608" y="211" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">+28%</text>
    <text x="608" y="265" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">盲答 44%</text>
    <text x="608" y="311" font-size="10.4" font-weight="600" fill="#334155" text-anchor="middle">传统 4 选 1</text>
    <text x="608" y="325" font-size="9.5" fill="#64748b" text-anchor="middle">原始视觉题库</text>

    <!-- Bar 2: Chart / MathVista -> Blind 26% (39px: y=255..294), Net Vis 42% (63px: y=192..255) -->
    <rect x="676" y="144" width="64" height="48" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="676" y="192" width="64" height="63" fill="#0284c7" rx="2"/>
    <rect x="676" y="255" width="64" height="39" fill="#f59e0b"/>
    <text x="708" y="227" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">+42%</text>
    <text x="708" y="278" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">盲答 26%</text>
    <text x="708" y="311" font-size="10.4" font-weight="600" fill="#334155" text-anchor="middle">图表推理基准</text>
    <text x="708" y="325" font-size="9.5" fill="#64748b" text-anchor="middle">如 MathVista</text>

    <!-- Bar 3: Blind-Filtered 10-opt (MMMU-Pro) -> Blind 10% (15px: y=279..294), Net Vis 54% (81px: y=198..279) -->
    <rect x="776" y="144" width="64" height="54" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="776" y="198" width="64" height="81" fill="#0284c7" rx="2"/>
    <rect x="776" y="279" width="64" height="15" fill="#f59e0b"/>
    <text x="808" y="242" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Δ_vis +54%</text>
    <text x="808" y="290" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">10%</text>
    <text x="808" y="311" font-size="10.4" font-weight="600" fill="#0369a1" text-anchor="middle">去图清洗+10 选 1</text>
    <text x="808" y="325" font-size="9.5" fill="#0284c7" text-anchor="middle">如 MMMU-Pro</text>

    <!-- Bar Legend -->
    <rect x="546" y="338" width="11" height="11" rx="2" fill="#f59e0b"/>
    <text x="562" y="347" font-size="10" fill="#475569">无图盲测命中（捷径噪声）</text>
    <rect x="704" y="338" width="11" height="11" rx="2" fill="#0284c7"/>
    <text x="720" y="347" font-size="10" fill="#475569">真实净视觉增益 Δ_vis</text>

    <!-- Cleaning Pipeline Box -->
    <rect x="512" y="366" width="358" height="64" rx="7" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="691" y="383" font-size="10.4" font-weight="700" fill="#075985" text-anchor="middle">企业多模态题库清洗四步流水线</text>

    <rect x="522" y="393" width="70" height="28" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="557" y="411" class="step-t">屏蔽图像</text>
    <line x1="592" y1="407" x2="606" y2="407" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-p6)"/>

    <rect x="608" y="393" width="76" height="28" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="646" y="411" class="step-t">多 LLM 盲答</text>
    <line x1="684" y1="407" x2="698" y2="407" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-p6)"/>

    <rect x="700" y="393" width="76" height="28" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
    <text x="738" y="411" class="step-t">剔除捷径题</text>
    <line x1="776" y1="407" x2="790" y2="407" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-p6)"/>

    <rect x="792" y="393" width="68" height="28" rx="5" fill="#0284c7"/>
    <text x="826" y="411" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">净视觉集</text>
  </g>
</svg>
