<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-label="SWE-bench 与 Terminal-Bench 隔离容器验证流水线与防改测试作弊架构：包含冻结基础镜像初始化、无外网 Agent 运行沙箱、AST 与 Diff 防作弊门禁、只读挂载隐藏测试的独立裁判舱，以及超越单测的四维补丁审计">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.8px; fill: #64748b; }
    .stage-t { font-size: 13.5px; font-weight: 700; }
    .item-t { font-size: 11.4px; font-weight: 700; fill: #1e293b; }
    .item-s { font-size: 10.6px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>
  <defs>
    <marker id="sw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="sw-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="920" height="490" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="32" y="36" class="title">SWE-bench / Terminal-Bench 隔离验证流水线与“防改测试作弊”防线</text>
  <text x="32" y="58" class="sub">严格切分「Agent 可写沙箱」与「裁判只读验证舱」，叠加 Git 历史剥离与 AST 审计，阻断改测试、抄历史与依赖腐化。</text>

  <!-- Stage 1: Frozen Image & Sanitization -->
  <g>
    <rect x="32" y="78" width="236" height="246" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="46" y="90" width="208" height="24" rx="12" fill="#0284c7"/>
    <text x="150" y="106" class="pill">① 冻结镜像与防泄漏初始化</text>

    <rect x="44" y="124" width="212" height="54" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="54" y="142" class="item-t">不可变容器快照（防依赖腐化）</text>
    <text x="54" y="158" class="item-s">锁死 OS/Python/Wheel 离线镜像，</text>
    <text x="54" y="172" class="item-s">杜绝 PyPI/apt 上游更新导致构建漂移</text>

    <rect x="44" y="186" width="212" height="58" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="54" y="204" class="item-t">Git 历史深度清洗</text>
    <text x="54" y="220" class="item-s">硬裁剪 base_commit 之后全部提交、</text>
    <text x="54" y="235" class="item-s">reflog、tags 与未来 PR，防偷窥答案</text>

    <rect x="44" y="252" width="212" height="58" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="54" y="270" class="item-t" fill="#075985">测试补丁物理隔离</text>
    <text x="54" y="286" class="item-s" fill="#0369a1">隐藏 test_patch 与终态校验脚本</text>
    <text x="54" y="301" class="item-s" fill="#0369a1">全程留驻宿主机，绝不挂载进沙箱</text>
  </g>

  <line x1="268" y1="200" x2="294" y2="200" stroke="#475569" stroke-width="1.8" marker-end="url(#sw-arrow)"/>

  <!-- Stage 2: Untrusted Agent Sandbox -->
  <g>
    <rect x="298" y="78" width="276" height="246" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <rect x="312" y="90" width="248" height="24" rx="12" fill="#4f46e5"/>
    <text x="436" y="106" class="pill">② Agent 可写沙箱（非可信执行域）</text>

    <rect x="310" y="124" width="252" height="54" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="320" y="142" class="item-t">硬隔离资源边界</text>
    <text x="320" y="158" class="mono" font-size="10.4" fill="#4338ca">--network=none · cgroups · timeout</text>
    <text x="320" y="172" class="item-s">阻断外网搜原 PR；异常标为 infra_error</text>

    <rect x="310" y="186" width="252" height="44" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="320" y="203" class="item-t">多轮终端交互与产出提取</text>
    <text x="320" y="219" class="item-s" font-size="10">SWE 导出 model.patch；Terminal 保留终态</text>

    <!-- Anti-cheat Gate -->
    <rect x="310" y="238" width="252" height="72" rx="7" fill="#fef2f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="320" y="256" class="item-t" fill="#9f1239">AST 与 Diff 防作弊门禁（Audit Gate）</text>
    <text x="320" y="273" class="item-s" fill="#be123c">✗ 拦截改写 tests/ 或删除 assert 断言</text>
    <text x="320" y="289" class="item-s" font-size="10" fill="#be123c">✗ 拦截 monkey-patch pytest / 伪造退出码 0</text>
    <text x="320" y="304" class="item-s" fill="#be123c">✗ 拦截写死特定测试输入值的分支作弊</text>
  </g>

  <line x1="574" y1="200" x2="600" y2="200" stroke="#e11d48" stroke-width="1.8" marker-end="url(#sw-rose)"/>

  <!-- Stage 3: Read-only Verifier Pod -->
  <g>
    <rect x="604" y="78" width="284" height="246" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
    <rect x="618" y="90" width="256" height="24" rx="12" fill="#059669"/>
    <text x="746" y="106" class="pill">③ 独立只读裁判舱（可信验证域）</text>

    <rect x="616" y="124" width="260" height="54" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="626" y="142" class="item-t">干净重建 + 只读卷挂载（:ro）</text>
    <text x="626" y="158" class="item-s">从干净 base_commit 仅打入 model.patch，</text>
    <text x="626" y="172" class="item-s">宿主机只读挂载隐藏测试与验证脚本执行</text>

    <rect x="616" y="186" width="260" height="58" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="626" y="204" class="item-t" fill="#065f46">SWE-bench 双集合门禁</text>
    <text x="626" y="220" class="mono" font-size="9.5" fill="#047857">FAIL_TO_PASS=100% ∧ PASS_TO_PASS=100%</text>
    <text x="626" y="235" class="item-s">既要修好原 Bug，又要确保全库零回归</text>

    <rect x="616" y="252" width="260" height="58" rx="6" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="626" y="270" class="item-t" fill="#065f46">Terminal-Bench 真实系统终态断言</text>
    <text x="626" y="286" class="item-s" fill="#047857">宿主机侧独立核查进程/端口、文件权限、</text>
    <text x="626" y="301" class="item-s" fill="#047857">数据校验和与服务健康探针（不信口头回报）</text>
  </g>

  <!-- Bottom Bar: Beyond Unit Tests -->
  <g>
    <rect x="32" y="344" width="856" height="128" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <text x="48" y="367" class="stage-t" fill="#92400e">超越“能过单测”：工业级补丁的四维深度质量审计</text>

    <rect x="48" y="380" width="196" height="78" rx="7" fill="#ffffff" stroke="#fde68a"/>
    <text x="58" y="399" class="item-t" fill="#b45309">1. 运行性能与复杂度</text>
    <text x="58" y="418" class="item-s">压测吞吐、内存峰值与延迟，</text>
    <text x="58" y="434" class="item-s">拦截 O(n²) 暴力补丁蒙混过关</text>
    <text x="58" y="450" class="item-s">引发线上超时。</text>

    <rect x="256" y="380" width="196" height="78" rx="7" fill="#ffffff" stroke="#fde68a"/>
    <text x="266" y="399" class="item-t" fill="#b45309">2. 安全静态扫描（SAST）</text>
    <text x="266" y="418" class="item-s">扫描命令注入、SQL 拼接、</text>
    <text x="266" y="434" class="item-s">路径穿越与不安全反序列化，</text>
    <text x="266" y="450" class="item-s">严防修一个 Bug 引十个洞。</text>

    <rect x="464" y="380" width="196" height="78" rx="7" fill="#ffffff" stroke="#fde68a"/>
    <text x="474" y="399" class="item-t" fill="#b45309">3. 变更最小化与维护性</text>
    <text x="474" y="418" class="item-s">审计 Diff 行数膨胀、无故改</text>
    <text x="474" y="434" class="item-s">公共接口与死代码残留，对比</text>
    <text x="474" y="450" class="item-s">人类工程师 PR 审阅门槛。</text>

    <rect x="672" y="380" width="200" height="78" rx="7" fill="#ffffff" stroke="#fde68a"/>
    <text x="682" y="399" class="item-t" fill="#b45309">4. 活题库抗污染追踪</text>
    <text x="682" y="418" class="item-s">结合 SWE-bench Live 按 PR</text>
    <text x="682" y="434" class="item-s">合并时间切片对比训练前后，</text>
    <text x="682" y="450" class="item-s">区分真泛化与历史代码背题。</text>
  </g>
</svg>
