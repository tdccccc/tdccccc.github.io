<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-label="多轮工具交互闭环与数据库终态哈希校验图：展示用户模拟器、被测 Agent 与 MCP 服务器及业务数据库三方交互、τ²-bench 双控通道，以及数据库终态哈希、政策断言与模拟器防泄题验证平面">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.8px; fill: #64748b; }
    .box-t { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .item-t { font-size: 11.4px; font-weight: 600; fill: #1e293b; }
    .item-s { font-size: 10.6px; fill: #475569; }
    .arr-lbl { font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .card-t { font-size: 13px; font-weight: 700; }
    .card-s { font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0284c7"/>
    </marker>
    <marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="490" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="32" y="36" class="title">多轮工具交互闭环：User Simulator ↔ Agent ↔ MCP / DB 与终态断言</text>
  <text x="32" y="58" class="sub">整合 BFCL Schema 校验、动态 MCP 发现与 τ-bench / τ²-bench 双控环境，以数据库终态哈希、政策遵从与模拟器质检联合判分。</text>

  <!-- Left Box: User Simulator -->
  <g>
    <rect x="32" y="80" width="234" height="208" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="48" y="92" width="202" height="24" rx="12" fill="#d97706"/>
    <text x="149" y="108" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">用户模拟器（User Simulator）</text>

    <rect x="44" y="126" width="210" height="42" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="54" y="143" class="item-t">隐藏目标与隐性约束卡片</text>
    <text x="54" y="159" class="item-s">如预算上限、航班改签偏好、身份凭证</text>

    <rect x="44" y="176" width="210" height="44" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="54" y="193" class="item-t">τ²-bench 双控用户侧工具</text>
    <text x="54" y="209" class="item-s">用户可按指引操作本地设备/重启服务</text>

    <rect x="44" y="228" width="210" height="48" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="54" y="245" class="item-t" fill="#92400e">模拟器治理红线</text>
    <text x="54" y="261" class="item-s" fill="#78350f">禁剧透答案 · 禁过早妥协 · 跨模型复核</text>
  </g>

  <!-- Center Box: Agent Under Test -->
  <g>
    <rect x="342" y="80" width="236" height="208" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="358" y="92" width="204" height="24" rx="12" fill="#4f46e5"/>
    <text x="460" y="108" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">被测 Agent（Model + Scaffold）</text>

    <rect x="354" y="126" width="212" height="42" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="364" y="143" class="item-t">动态 MCP 发现与大工具集路由</text>
    <text x="364" y="159" class="item-s">50–500 tools 按需检索，防上下文过载</text>

    <rect x="354" y="176" width="212" height="44" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="364" y="193" class="item-t">多轮状态保持与缺参拒调</text>
    <text x="364" y="209" class="item-s">并行/嵌套调用；信息不足主动追问拒调</text>

    <rect x="354" y="228" width="212" height="48" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="364" y="245" class="item-t">业务政策遵从与报错自愈</text>
    <text x="364" y="261" class="item-s">解析 4xx/5xx 重试降级，写前征得确认</text>
  </g>

  <!-- Right Box: MCP Servers & Stateful DB -->
  <g>
    <rect x="654" y="80" width="234" height="208" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="670" y="92" width="202" height="24" rx="12" fill="#0284c7"/>
    <text x="771" y="108" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">MCP 服务器与可变业务库</text>

    <rect x="666" y="126" width="210" height="42" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="676" y="143" class="item-t">AST 与 JSON Schema 强校验</text>
    <text x="676" y="159" class="item-s">函数名、枚举值、嵌套类型与必填项检查</text>

    <rect x="666" y="176" width="210" height="44" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="676" y="193" class="item-t">读写分离 API（Read / Mutate）</text>
    <text x="676" y="209" class="item-s">注入受控故障（限流、缺货、字段变更）</text>

    <rect x="666" y="228" width="210" height="48" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="676" y="245" class="item-t" fill="#075985">状态化数据库 + 写审计日志</text>
    <text x="676" y="261" class="item-s" fill="#0369a1">记录订单/工单/库存最终快照与调用序列</text>
  </g>

  <!-- Arrows between Left and Center -->
  <line x1="266" y1="150" x2="338" y2="150" stroke="#d97706" stroke-width="1.8" marker-end="url(#m-amber)"/>
  <text x="304" y="142" class="arr-lbl" fill="#b45309">多轮需求</text>
  <line x1="342" y1="210" x2="270" y2="210" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m-indigo)"/>
  <text x="304" y="227" class="arr-lbl" fill="#4338ca">澄清 / 确认</text>

  <!-- Arrows between Center and Right -->
  <line x1="578" y1="150" x2="650" y2="150" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#m-indigo)"/>
  <text x="616" y="142" class="arr-lbl" fill="#4338ca">Tool Call</text>
  <line x1="654" y1="210" x2="582" y2="210" stroke="#0284c7" stroke-width="1.8" marker-end="url(#m-sky)"/>
  <text x="616" y="227" class="arr-lbl" fill="#0369a1">观测 / 报错</text>

  <!-- Dual-control dashed path (tau^2-bench) -->
  <path d="M149,288 L149,308 L771,308 L771,292" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#m-amber)"/>

  <!-- Arrows downward to Evaluation Plane (drawn before pill so center shaft passes cleanly behind opaque pill) -->
  <line x1="149" y1="308" x2="149" y2="334" stroke="#059669" stroke-width="1.5" marker-end="url(#m-emerald)"/>
  <line x1="460" y1="288" x2="460" y2="334" stroke="#059669" stroke-width="1.5" marker-end="url(#m-emerald)"/>
  <line x1="771" y1="308" x2="771" y2="334" stroke="#059669" stroke-width="1.5" marker-end="url(#m-emerald)"/>

  <rect x="304" y="297" width="312" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="460" y="311" font-size="10.8" font-weight="600" fill="#92400e" text-anchor="middle">τ²-bench 双控通道：用户同步修改本地设备/共享环境状态</text>

  <!-- Bottom Verification Plane -->
  <g>
    <rect x="32" y="338" width="856" height="134" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
    <text x="48" y="361" font-size="13.5" font-weight="700" fill="#065f46">多维终态判分与可靠性聚合平面（不锁死中间路径，严格锁死终态与合规）</text>

    <!-- Card 1 -->
    <rect x="48" y="374" width="264" height="84" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="60" y="394" class="card-t" fill="#047857">① 数据库终态哈希断言</text>
    <text x="60" y="413" class="mono" font-size="10.5" fill="#065f46">Hash(DB_final) == Hash(DB_gold)</text>
    <text x="60" y="431" class="card-s">对比 Agent 结束态与标准写操作回放态，</text>
    <text x="60" y="447" class="card-s">允许任意合法查询顺序，杜绝路径过拟合。</text>

    <!-- Card 2 -->
    <rect x="328" y="374" width="264" height="84" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="340" y="394" class="card-t" fill="#047857">② 政策遵从与关键信息核验</text>
    <text x="340" y="413" class="card-s">• 不可逆写入前是否显式征得用户授权</text>
    <text x="340" y="430" class="card-s">• 退款/优惠/权限是否越界触犯业务红线</text>
    <text x="340" y="447" class="card-s">• 对话中是否准确传达必填金额与订单号</text>

    <!-- Card 3 -->
    <rect x="608" y="374" width="264" height="84" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="620" y="394" class="card-t" fill="#047857">③ 模拟器审计与 pass^k 可靠性</text>
    <text x="620" y="413" class="card-s">• 剔除模拟器剧透或违规妥协的无效轨迹</text>
    <text x="620" y="430" class="card-s">• 同题独立跑 n 次，按无偏组合公式算</text>
    <text x="620" y="447" class="mono" font-size="10" fill="#065f46">pass^k = C(c,k)/C(n,k) 衡量生产连续可靠性</text>
  </g>
</svg>
