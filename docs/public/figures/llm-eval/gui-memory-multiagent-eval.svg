<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-label="前沿 Agent 三联机制图：左为 GUI 操控的观测-规划-定位-终态闭环与定位规划解耦；中为长期记忆跨会话时间线与知识冲突覆盖；右为多智能体 DAG 执行图、关键路径步数 CS 与通信税剖析">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.6px; fill: #64748b; }
    .col-pill { font-size: 11.4px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .card-t { font-size: 11.8px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10.6px; fill: #475569; }
    .node-t { font-size: 10.8px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="g-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0284c7"/>
    </marker>
    <marker id="g-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="g-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="g-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="32" y="36" class="title">前沿 Agent 三大高维评测：GUI 操控 · 长期记忆 · 多智能体协同</text>
  <text x="32" y="58" class="sub">左拆解视觉定位与规划失误；中刻画跨会话时间推理与冲突记忆覆盖；右用并行 DAG 关键路径步数（CS）量化通信税。</text>

  <!-- Panel 1: GUI Evaluation -->
  <g>
    <rect x="28" y="78" width="278" height="398" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="42" y="90" width="250" height="24" rx="12" fill="#0284c7"/>
    <text x="167" y="106" class="col-pill">① GUI 操控：观测-动作-终态解耦</text>

    <!-- Loop nodes -->
    <rect x="44" y="126" width="246" height="44" rx="7" fill="#ffffff" stroke="#bae6fd"/>
    <text x="56" y="144" class="card-t" fill="#075985">1. 多模态状态观测</text>
    <text x="56" y="160" class="card-s">高分截屏 + A11y 无障碍树 / 网页 DOM</text>
    <line x1="167" y1="170" x2="167" y2="184" stroke="#0284c7" stroke-width="1.5" marker-end="url(#g-sky)"/>

    <rect x="44" y="186" width="246" height="56" rx="7" fill="#ffffff" stroke="#bae6fd"/>
    <text x="56" y="204" class="card-t" font-size="11" fill="#075985">2. 规划(Planning) × 定位(Grounding)</text>
    <text x="56" y="220" class="card-s">规划：决定“该点哪一步、何时回退”</text>
    <text x="56" y="235" class="card-s">定位：输出精确像素坐标 (x, y) 与输入键</text>
    <line x1="167" y1="242" x2="167" y2="256" stroke="#0284c7" stroke-width="1.5" marker-end="url(#g-sky)"/>

    <rect x="44" y="258" width="246" height="48" rx="7" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="56" y="276" class="card-t" fill="#075985">3. 环境终态脚本校验</text>
    <text x="56" y="293" class="card-s">VM 文件/配置、自托管 DB 与 App 终态</text>

    <!-- Decoupling diagnostic box -->
    <rect x="44" y="318" width="246" height="106" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="56" y="337" class="card-t" fill="#0369a1">失败归因解耦协议</text>
    <text x="56" y="357" class="card-s">• 注入 SoM 编号框后分飙升 → 视觉定位短板</text>
    <text x="56" y="375" class="card-s">• 定位准确但多步迷路/误点提交 → 规划短板</text>
    <text x="56" y="393" class="card-s">• 参数化任务重采样 → 防背诵固定坐标脚本</text>
    <text x="56" y="411" class="card-s">• 严禁仅靠静态轨迹截图匹配替代真机执行</text>

    <rect x="44" y="434" width="246" height="28" rx="6" fill="#0369a1"/>
    <text x="167" y="452" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="middle">OSWorld · WebArena · AndroidWorld</text>
  </g>

  <!-- Panel 2: Long-Term Memory -->
  <g>
    <rect x="321" y="78" width="278" height="398" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <rect x="335" y="90" width="250" height="24" rx="12" fill="#d97706"/>
    <text x="460" y="106" class="col-pill">② 长期记忆：时间推理与冲突覆盖</text>

    <!-- Vertical timeline axis -->
    <line x1="355" y1="138" x2="355" y2="328" stroke="#d97706" stroke-width="2" marker-end="url(#g-amber)"/>

    <!-- t1 -->
    <circle cx="355" cy="144" r="6" fill="#f59e0b"/>
    <rect x="370" y="126" width="214" height="44" rx="7" fill="#ffffff" stroke="#fde68a"/>
    <text x="380" y="143" class="card-t" fill="#92400e">t₁ (Day 1) · 初始事实写入</text>
    <text x="380" y="160" class="card-s">“常驻上海，出差只订靠窗位”</text>

    <!-- t2 -->
    <circle cx="355" cy="204" r="5" fill="#94a3b8"/>
    <rect x="370" y="182" width="214" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4,3"/>
    <text x="380" y="199" class="card-t" fill="#475569">t₂ (Day 18) · 海量干扰会话</text>
    <text x="380" y="215" class="card-s">跨周 100k+ token 无关闲聊与任务</text>

    <!-- t3 -->
    <circle cx="355" cy="262" r="6" fill="#059669"/>
    <rect x="370" y="238" width="214" height="48" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
    <text x="380" y="256" class="card-t" fill="#065f46">t₃ (Day 35) · 事实更新与冲突</text>
    <text x="380" y="273" class="card-s">“已调岗北京，腰伤改坐过道位”</text>

    <!-- t4 -->
    <circle cx="355" cy="316" r="6" fill="#4f46e5"/>
    <rect x="370" y="298" width="214" height="42" rx="7" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="380" y="315" class="card-t" fill="#3730a3">t₄ (Day 60) · 跨期检索提问</text>
    <text x="380" y="331" class="card-s">检验更新覆盖、时间差与未知拒答</text>

    <!-- Five capability verdict checklist -->
    <rect x="337" y="352" width="246" height="72" rx="7" fill="#ffffff" stroke="#fbbf24"/>
    <text x="347" y="370" class="card-t" fill="#92400e">LongMemEval 五维判分锚点</text>
    <text x="347" y="388" class="card-s">✓ 单跳/多跳跨会话精准回溯</text>
    <text x="347" y="403" class="card-s">✓ 冲突覆盖（禁止回吐过期的“上海/靠窗”）</text>
    <text x="347" y="418" class="card-s">✓ 时间推算（距调岗 25 天）&amp; 无信息拒答</text>

    <rect x="337" y="434" width="246" height="28" rx="6" fill="#b45309"/>
    <text x="460" y="452" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="middle">LoCoMo · LongMemEval 基准体系</text>
  </g>

  <!-- Panel 3: Multi-Agent DAG & Critical Steps -->
  <g>
    <rect x="614" y="78" width="278" height="398" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <rect x="628" y="90" width="250" height="24" rx="12" fill="#4f46e5"/>
    <text x="753" y="106" class="col-pill">③ 多智能体 DAG：关键路径与通信税</text>

    <!-- DAG Canvas -->
    <rect x="630" y="126" width="246" height="176" rx="8" fill="#ffffff" stroke="#c7d2fe"/>

    <!-- Orchestrator Start -->
    <rect x="693" y="136" width="120" height="26" rx="13" fill="#4f46e5"/>
    <text x="753" y="153" class="node-t" fill="#ffffff">编排者 O₁ (1 步)</text>

    <!-- Edges fan out -->
    <line x1="723" y1="162" x2="670" y2="194" stroke="#64748b" stroke-width="1.4" marker-end="url(#g-slate)"/>
    <line x1="753" y1="162" x2="753" y2="194" stroke="#e11d48" stroke-width="2.2" marker-end="url(#g-rose)"/>
    <line x1="783" y1="162" x2="836" y2="194" stroke="#64748b" stroke-width="1.4" marker-end="url(#g-slate)"/>

    <!-- Parallel Sub-agents -->
    <rect x="638" y="196" width="66" height="44" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="671" y="215" class="node-t" fill="#334155">子体 A</text>
    <text x="671" y="231" font-size="10.2" fill="#64748b" text-anchor="middle">2 步</text>

    <rect x="716" y="196" width="74" height="44" rx="7" fill="#fef2f2" stroke="#e11d48" stroke-width="1.8"/>
    <text x="753" y="215" class="node-t" fill="#9f1239">子体 B ★</text>
    <text x="753" y="231" font-size="10.2" font-weight="700" fill="#e11d48" text-anchor="middle">5 步 (瓶颈)</text>

    <rect x="802" y="196" width="66" height="44" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="835" y="215" class="node-t" fill="#334155">子体 C</text>
    <text x="835" y="231" font-size="10.2" fill="#64748b" text-anchor="middle">2 步</text>

    <!-- Edges merge -->
    <line x1="670" y1="240" x2="723" y2="264" stroke="#64748b" stroke-width="1.4" marker-end="url(#g-slate)"/>
    <line x1="753" y1="240" x2="753" y2="264" stroke="#e11d48" stroke-width="2.2" marker-end="url(#g-rose)"/>
    <line x1="836" y1="240" x2="783" y2="264" stroke="#64748b" stroke-width="1.4" marker-end="url(#g-slate)"/>

    <!-- Orchestrator Merge -->
    <rect x="693" y="266" width="120" height="26" rx="13" fill="#4f46e5"/>
    <text x="753" y="283" class="node-t" fill="#ffffff">汇总者 O₂ (1 步)</text>

    <!-- Metrics Calculation Box -->
    <rect x="630" y="312" width="246" height="112" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.3"/>
    <text x="640" y="331" class="card-t" fill="#3730a3">协同效率与失败诊断公式</text>
    <text x="640" y="350" class="mono" font-size="10.4" fill="#1e293b">总步数 = 1 + (2+5+2) + 1 = 11</text>
    <text x="640" y="367" class="mono" font-size="10.4" font-weight="700" fill="#be123c">CS = 1 + max(2,5,2) + 1 = 7</text>
    <text x="640" y="386" class="card-s">• 通信税：交接摘要、角色争执与重复检索</text>
    <text x="640" y="402" class="card-s">• 错误级联：上游幻觉经编排者放大污染全图</text>
    <text x="640" y="418" class="card-s">• 协同增益 &lt; 0 时，应果断退回单智能体</text>

    <rect x="630" y="434" width="246" height="28" rx="6" fill="#3730a3"/>
    <text x="753" y="452" font-size="10.8" font-weight="700" fill="#ffffff" text-anchor="middle">衔接《LLM 强化学习》Ch 15 · PARL</text>
  </g>
</svg>
