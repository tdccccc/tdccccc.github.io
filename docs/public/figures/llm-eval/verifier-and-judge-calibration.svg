<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" role="img" aria-label="确定性验证器、LLM-as-a-Judge 六偏见治理与 Rogan-Gladen 统计校准全链路架构图">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 19.5px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.8px; fill: #64748b; }
    .box-t { font-size: 13.5px; font-weight: 700; }
    .sm { font-size: 11px; fill: #475569; }
    .chip { font-size: 10.8px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="jg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="jg-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="jg-ind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="jg-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="436" rx="8" fill="#fbfcfe"/>

  <!-- Header -->
  <text x="34" y="35" class="title">判分器全链路架构：确定性验证 × Judge 抗偏见 × Rogan-Gladen 矫正</text>
  <text x="34" y="57" class="sub">铁律：能程序化验证绝不依赖大模型；开放式任务使用 LLM Judge 时，先做工程减偏，再用人类金标做统计反演。</text>

  <!-- Routing Gate -->
  <rect x="34" y="102" width="128" height="72" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="98" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">模型输出 /</text>
  <text x="98" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">Agent 轨迹</text>
  <text x="98" y="164" text-anchor="middle" font-size="10.5" fill="#64748b">能否程序化验证？</text>

  <!-- Upper Branch: YES -> Deterministic Verifier -->
  <path d="M 162 120 L 194 120 L 194 106 L 222 106" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#jg-grn)"/>
  <text x="190" y="99" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">是</text>

  <rect x="226" y="74" width="660" height="68" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="242" y="96" class="box-t" fill="#065f46">① 确定性验证器（Deterministic Verifier · 优先轨道）</text>
  <rect x="742" y="82" width="132" height="22" rx="11" fill="#059669"/>
  <text x="808" y="97" class="pill" fill="#ffffff">零偏见 · 可作 RLVR 奖励</text>

  <rect x="242" y="106" width="194" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="339" y="123" class="chip">SymPy 数学符号等价 + 超时保护</text>
  <rect x="448" y="106" width="196" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="546" y="123" class="chip">AST / JSON Schema / 终态断言</text>
  <rect x="656" y="106" width="218" height="26" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="765" y="123" class="chip">EvalPlus 级强化边界单测（防漏测）</text>

  <!-- Lower Branch: NO -> LLM-as-a-Judge -->
  <path d="M 162 154 L 194 154 L 194 188 L 222 188" fill="none" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#jg-ind)"/>
  <text x="190" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4f46e5">否</text>

  <rect x="226" y="154" width="660" height="84" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="242" y="176" class="box-t" fill="#3730a3">② LLM-as-a-Judge（Pointwise / Pairwise / Rubric）与六偏见治理</text>
  <rect x="742" y="162" width="132" height="22" rx="11" fill="#4f46e5"/>
  <text x="808" y="177" class="pill" fill="#ffffff">输出有偏初分 p̂_raw</text>

  <rect x="242" y="190" width="118" height="36" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="301" y="206" class="chip">双向位置交换</text>
  <text x="301" y="220" font-size="9.8" fill="#64748b" text-anchor="middle">治位置偏见</text>

  <rect x="370" y="190" width="118" height="36" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="429" y="206" class="chip">跨模型族评审团</text>
  <text x="429" y="220" font-size="9.8" fill="#64748b" text-anchor="middle">治自我偏好</text>

  <rect x="498" y="190" width="122" height="36" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="559" y="206" class="chip">证据先行 CoT</text>
  <text x="559" y="220" font-size="9.8" fill="#64748b" text-anchor="middle">治奉承/权威偏见</text>

  <rect x="630" y="190" width="118" height="36" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="689" y="206" class="chip">窄量表锚定细则</text>
  <text x="689" y="220" font-size="9.8" fill="#64748b" text-anchor="middle">治分数聚类</text>

  <rect x="758" y="190" width="116" height="36" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="816" y="206" class="chip">长度/格式剥离</text>
  <text x="816" y="220" font-size="9.8" fill="#64748b" text-anchor="middle">治冗长/排版偏见</text>

  <!-- Arrow from Judge to Calibration Engine -->
  <line x1="490" y1="238" x2="490" y2="262" stroke="#4f46e5" stroke-width="2" marker-end="url(#jg-ind)"/>
  <text x="502" y="255" font-size="11" font-weight="700" fill="#4338ca">观测通过率 p̂_raw（N 题）</text>

  <!-- Bottom Calibration Band -->
  <!-- Left: Human Gold Calibration Set -->
  <rect x="34" y="266" width="244" height="150" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="50" y="290" class="box-t" fill="#92400e">③ 人类金标校准集（Ch 4）</text>
  <text x="50" y="311" class="sm">分层抽样 100–300 题双盲标注</text>
  <rect x="50" y="322" width="212" height="36" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <text x="156" y="338" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#065f46">灵敏度 q₁ = TPR（m₁ 正例）</text>
  <text x="156" y="352" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#9f1239">特异度 q₀ = TNR（m₀ 负例）</text>
  <text x="50" y="378" class="sm">Youden 指数：J = q₁ + q₀ − 1</text>
  <text x="50" y="396" font-size="10.5" fill="#b45309">注：切换模型族须重新验证 (q₁, q₀)</text>

  <line x1="278" y1="341" x2="310" y2="341" stroke="#d97706" stroke-width="2" marker-end="url(#jg-amb)"/>

  <!-- Center: Rogan-Gladen Inversion & Delta Variance -->
  <rect x="314" y="266" width="338" height="150" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.7"/>
  <text x="330" y="290" class="box-t" fill="#312e81">④ Rogan-Gladen 无偏反演与置信区间</text>

  <rect x="330" y="302" width="306" height="36" rx="6" fill="#eef2ff"/>
  <text x="483" y="325" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#312e81">θ̂_RG = clip( (p̂_raw + q₀ − 1) / J )</text>

  <text x="330" y="356" class="sm" font-weight="700">典型算例（宽容评委 q₁=0.90, q₀=0.60, J=0.50）：</text>
  <text x="330" y="374" class="mono" font-size="10.2" fill="#be123c">p̂_raw = 68.0% ⇒ θ̂_RG = 56.0%（剥离 +12pp 虚高）</text>
  <text x="330" y="394" font-size="10.8" fill="#475569">Delta 法方差 ∝ 1/J²，计入评测 N 与校准集 m₁, m₀ 瓶颈</text>

  <line x1="652" y1="341" x2="678" y2="341" stroke="#64748b" stroke-width="2" marker-end="url(#jg-arr)"/>

  <!-- Right: Youden J Traffic Light -->
  <rect x="682" y="266" width="204" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="696" y="290" class="box-t" fill="#1e293b">Youden 指数 J 警戒线</text>

  <rect x="696" y="302" width="176" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="711" cy="317" r="5" fill="#059669"/>
  <text x="723" y="321" font-size="11" font-weight="700" fill="#065f46">J ≥ 0.70 · 健康可用</text>

  <rect x="696" y="339" width="176" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <circle cx="711" cy="354" r="5" fill="#d97706"/>
  <text x="723" y="358" font-size="11" font-weight="700" fill="#92400e">0.40–0.70 · 扩 m₁, m₀</text>

  <rect x="696" y="376" width="176" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <circle cx="711" cy="391" r="5" fill="#e11d48"/>
  <text x="723" y="395" font-size="11" font-weight="700" fill="#9f1239">J &lt; 0.40 · 熔断先修评委</text>
</svg>
