<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 475" role="img" aria-label="线上生产回流、双轨物理隔离与 Agent 轨迹老化治理飞轮：展示全链路 Tracing 采集、硬哈希双轨分流、防污染去污闸门及分布漂移与轨迹老化护栏">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .card-t { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10.3px; fill: #475569; }
    .pill { font-size: 10px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-sl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-em2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arr-in2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arr-or2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="920" height="475" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="30" y="34" class="title">线上生产回流与端到端 Agent 数据飞轮（双轨物理隔离架构）</text>
  <text x="30" y="55" class="sub">全链路埋点捕获高量级隐式信号，通过硬哈希物理分轨严防自测自训泄漏，并以轨迹老化 ψ_stale 护栏守住迭代质量。</text>

  <!-- Left Block: Production Full-Trace Capture -->
  <rect x="28" y="74" width="214" height="254" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
  <rect x="42" y="85" width="186" height="22" rx="11" fill="#0284c7"/>
  <text x="135" y="100" class="pill" fill="#ffffff">① 线上生产全链路 Tracing</text>

  <rect x="40" y="118" width="190" height="62" rx="7" fill="#ffffff" stroke="#bae6fd"/>
  <text x="50" y="135" class="card-t" fill="#075985">全态上下文日志</text>
  <text x="50" y="151" class="card-s">• 模型 I/O · 多模态附件/截屏</text>
  <text x="50" y="166" class="card-s">• 工具 Schema 版本/延迟/报错</text>

  <rect x="40" y="188" width="190" height="52" rx="7" fill="#ffffff" stroke="#bae6fd"/>
  <text x="50" y="205" class="card-t" fill="#075985">显式反馈（低量高精）</text>
  <text x="50" y="221" class="card-s">• 点赞/点踩 · 人工直接修订 Diff</text>

  <rect x="40" y="248" width="190" height="68" rx="7" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="50" y="265" class="card-t" fill="#0369a1">隐式信号（100% 流量覆盖）</text>
  <text x="50" y="281" class="card-s">• 短时重问 / 重试 · 会话中途弃用</text>
  <text x="50" y="296" class="card-s">• 人工接管 · 工具死循环与报错尖峰</text>

  <line x1="242" y1="200" x2="266" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-sl)"/>

  <!-- Middle Block: Sanitization + Clustering + Hard Split -->
  <rect x="270" y="74" width="218" height="254" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <rect x="284" y="85" width="190" height="22" rx="11" fill="#ea580c"/>
  <text x="379" y="100" class="pill" fill="#ffffff">② 清洗聚类与硬哈希分流闸门</text>

  <rect x="282" y="118" width="194" height="58" rx="7" fill="#ffffff" stroke="#fed7aa"/>
  <text x="292" y="135" class="card-t" fill="#9a3412">全模态 PII 脱敏与合规审查</text>
  <text x="292" y="151" class="card-s">• 假名化 · 截图遮罩 · 授权状态校验</text>
  <text x="292" y="166" class="card-s">• 剔除 infra_error 与网络超时脏日志</text>

  <rect x="282" y="185" width="194" height="52" rx="7" fill="#ffffff" stroke="#fed7aa"/>
  <text x="292" y="202" class="card-t" fill="#9a3412">失败谱系自动聚类</text>
  <text x="292" y="218" class="card-s">• 按报错码 + 语义簇统计高频痛点</text>

  <rect x="282" y="246" width="194" height="70" rx="7" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.4"/>
  <text x="379" y="264" font-size="11.2" font-weight="700" fill="#be123c" text-anchor="middle">硬哈希物理隔离闸门</text>
  <text x="379" y="281" class="mono" font-size="9.8" fill="#9f1239" text-anchor="middle">hash(user_id / task_cluster) % 100</text>
  <text x="379" y="298" font-size="9.8" fill="#be123c" text-anchor="middle">15% 永久进评测轨 · 85% 进训练轨</text>
  <text x="379" y="311" font-size="9.3" fill="#e11d48" text-anchor="middle">严禁同用户 / 同工单跨轨泄漏</text>

  <!-- Branch Arrows from Hard Split to Dual Tracks -->
  <path d="M488,158 L512,158 L512,135 L536,135" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-em2)"/>
  <path d="M488,268 L512,268 L512,275 L536,275" fill="none" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arr-in2)"/>

  <!-- RIGHT TOP: Track A Eval Golden Track -->
  <rect x="540" y="74" width="352" height="114" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="554" y="84" width="160" height="21" rx="10.5" fill="#059669"/>
  <text x="634" y="98" class="pill" fill="#ffffff">轨 A · 评测黄金集轨（只读密封）</text>
  <text x="724" y="98" font-size="10.2" font-weight="700" fill="#047857">联动《评测》第 17 章</text>
  <text x="554" y="124" class="card-s">• 独立对象桶与 IAM 权限，训练脚本物理不可见</text>
  <text x="554" y="142" class="card-s">• 沉淀为 Dev 回归集 + Holdout 发布闸门（滚动更新）</text>
  <text x="554" y="160" class="card-s">• 仅向研发域输出「脱题抽象失败模式」，绝不回灌原题</text>
  <text x="554" y="177" font-size="10" font-weight="700" fill="#065f46">→ 唯一可信标尺：裁决每轮数据飞轮是否真实有效</text>

  <!-- Physical Firewall Divider between Track A and Track B -->
  <line x1="542" y1="201" x2="890" y2="201" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="614" y="191" width="204" height="20" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="716" y="205" font-size="9.8" font-weight="700" fill="#be123c" text-anchor="middle">跨轨去污防火墙：13-gram + 向量近邻 = 0%</text>

  <!-- RIGHT BOTTOM: Track B Training Candidate Track -->
  <rect x="540" y="214" width="352" height="114" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <rect x="554" y="224" width="174" height="21" rx="10.5" fill="#4f46e5"/>
  <text x="641" y="238" class="pill" fill="#ffffff">轨 B · 训练候选池轨（主动学习）</text>
  <text x="738" y="238" font-size="10.2" font-weight="700" fill="#4338ca">增量 SFT / DPO / RLVR</text>
  <text x="554" y="264" class="card-s">• 主动学习打分：高不确定性 × 高业务损益 × 稀疏失败簇优先</text>
  <text x="554" y="282" class="card-s">• 失败轨迹做反事实分叉修复（Ch19）或同源新题扩展</text>
  <text x="554" y="300" class="card-s">• 与历史高质锚点混配（防遗忘），冻结新快照触发增量后训练</text>
  <text x="554" y="317" font-size="10" font-weight="700" fill="#3730a3">→ 经轨 A Holdout 盲测达标后灰度上线，完成飞轮闭环</text>

  <!-- BOTTOM GUARDRAIL BAR -->
  <rect x="28" y="346" width="864" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="42" y="356" width="178" height="21" rx="10.5" fill="#334155"/>
  <text x="131" y="370" class="pill" fill="#ffffff">③ 生产飞轮三大常态化护栏</text>
  <text x="232" y="370" font-size="10.8" fill="#64748b">防飞轮空转、防旧数据反噬、防过度训卡</text>

  <rect x="42" y="385" width="268" height="56" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="403" class="card-t" fill="#075985">分布漂移监控（Distribution Shift）</text>
  <text x="52" y="419" class="card-s">追踪线上意图向量质心与工具调用分布 PSI</text>
  <text x="52" y="433" class="card-s">突增新业务簇自动触发采样加权与黄金集扩容</text>

  <rect x="324" y="385" width="276" height="56" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <text x="334" y="403" class="card-t" fill="#9f1239">轨迹老化治理（Staleness ψ_stale）</text>
  <text x="334" y="419" class="card-s">API Schema / UI 改版触发自动沙箱抽样回放</text>
  <text x="334" y="433" class="card-s">按分层 TTL 淘汰失效旧轨迹，严禁污染新微调</text>

  <rect x="614" y="385" width="264" height="56" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="624" y="403" class="card-t" fill="#9a3412">演进 ROI 路由闸门（改脚手架 vs 改数据）</text>
  <text x="624" y="419" class="card-s">Schema 歧义/检索缺失优先小时级修脚手架</text>
  <text x="624" y="433" class="card-s">仅稳定复现的长程推理短板进入数据重训飞轮</text>

  <!-- Return Loop Arrow along outer right/bottom back to left -->
  <path d="M892,272 L906,272 L906,462 L135,462 L135,332" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-or2)"/>
  <rect x="424" y="454" width="236" height="17" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="542" y="466" font-size="9.6" font-weight="700" fill="#c2410c" text-anchor="middle">新版本灰度上线 → 产生下一代线上轨迹闭环</text>
</svg>
