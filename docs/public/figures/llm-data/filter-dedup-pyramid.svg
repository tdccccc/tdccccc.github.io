<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 475" role="img" aria-label="预训练四级质量过滤金字塔与四尺度去重引擎对比及 MinHash LSH S型曲线">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.6px; fill: #64748b; }
    .sec-t { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .card-t { font-size: 11.8px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10px; fill: #475569; }
    .pill { font-size: 9.8px; font-weight: 700; text-anchor: middle; }
    .ax { font-size: 9.5px; fill: #475569; }
  </style>
  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="475" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="34" class="title">大规模过滤金字塔（启发式 → 模型打分）与四尺度去重引擎</text>
  <text x="36" y="55" class="sub">左侧遵循“廉价 CPU 规则先行、高精模型分类器压轴”的算力阶梯；右侧串联精确/MinHash/后缀数组/语义四尺度去重消除冗余。</text>

  <!-- LEFT PANEL: 4-Tier Filtering Funnel -->
  <rect x="36" y="70" width="414" height="388" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="52" y="93" class="sec-t" fill="#0369a1">一、由廉到精的四级质量过滤漏斗</text>

  <!-- Tier 1 -->
  <rect x="52" y="106" width="382" height="66" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.3"/>
  <rect x="62" y="114" width="70" height="18" rx="9" fill="#0284c7"/>
  <text x="97" y="126" class="pill" fill="#ffffff">L1 · 粗筛</text>
  <text x="142" y="128" class="card-t">URL 黑名单 + FastText 语种识别</text>
  <text x="62" y="147" class="card-s">吞吐：~100K docs/s/核（纯 CPU，几乎零成本）</text>
  <text x="62" y="162" class="card-s">剔除色情/赌博/成人域、非目标语种与极短残缺页</text>

  <line x1="243" y1="172" x2="243" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-d)"/>

  <!-- Tier 2 -->
  <rect x="64" y="190" width="358" height="72" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
  <rect x="74" y="198" width="76" height="18" rx="9" fill="#4f46e5"/>
  <text x="112" y="210" class="pill" fill="#ffffff">L2 · 启发式</text>
  <text x="160" y="212" class="card-t">C4 → Gopher → FineWeb 规则演进</text>
  <text x="74" y="231" class="card-s">检查：词长分布、重复行/段落比、符号比、列表占比</text>
  <text x="74" y="249" font-size="9.8" font-weight="700" fill="#be123c">防误杀开关：代码/数学/中文必须绕开英文句号与停用词规则！</text>

  <line x1="243" y1="262" x2="243" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-d)"/>

  <!-- Tier 3 -->
  <rect x="76" y="280" width="334" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
  <rect x="86" y="288" width="84" height="18" rx="9" fill="#4338ca"/>
  <text x="128" y="300" class="pill" fill="#ffffff">L3 · 模型打分</text>
  <text x="178" y="302" class="card-t">轻量分类器蒸馏高分分位数</text>
  <text x="86" y="321" class="card-s">• DCLM FastText（CPU，15T 仅数十美元）</text>
  <text x="86" y="338" class="card-s">• FineWeb-Edu 110M Encoder（FP16 GPU，教育分 ≥ 3）</text>

  <line x1="243" y1="352" x2="243" y2="366" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-d)"/>

  <!-- Tier 4 -->
  <rect x="88" y="370" width="310" height="74" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <rect x="98" y="378" width="88" height="18" rx="9" fill="#059669"/>
  <text x="142" y="390" class="pill" fill="#ffffff">L4 · 集成保留</text>
  <text x="194" y="392" class="card-t">多裁判分桶 + 分级采样</text>
  <text x="98" y="411" class="card-s">Nemotron-CC 范式：单模型易偏科（丢代码/百科），</text>
  <text x="98" y="428" class="card-s">按多分类器分桶保留，最高分桶用于退火与改写合成</text>

  <!-- RIGHT PANEL: 4-Scale Dedup + LSH S-Curve -->
  <rect x="464" y="70" width="420" height="388" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="480" y="93" class="sec-t" fill="#5b21b6">二、四尺度去重引擎与 MinHash LSH 概率曲线</text>

  <!-- 4 Dedup Cards -->
  <rect x="480" y="104" width="388" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="488" y="112" width="76" height="28" rx="5" fill="#334155"/>
  <text x="526" y="130" class="pill" fill="#ffffff">Exact Hash</text>
  <text x="574" y="123" class="card-t">URL 与 SHA-256 精确文档/行去重</text>
  <text x="574" y="139" class="card-s">O(N) 极低开销 · 清除镜像站与完全一致拷贝</text>

  <rect x="480" y="154" width="388" height="48" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.3"/>
  <rect x="488" y="164" width="76" height="28" rx="5" fill="#7c3aed"/>
  <text x="526" y="182" class="pill" fill="#ffffff">MinHash+LSH</text>
  <text x="574" y="174" class="card-t">文档级模糊去重（k_sig = b · r_lsh 签名桶碰撞）</text>
  <text x="574" y="191" class="card-s">召回高 Jaccard 相似文档 · 连通分量聚类仅留 1 份</text>

  <rect x="480" y="208" width="388" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="488" y="216" width="76" height="28" rx="5" fill="#0284c7"/>
  <text x="526" y="234" class="pill" fill="#ffffff">Suffix Array</text>
  <text x="574" y="227" class="card-t">全局精确子串去重（切除 &gt;50 tok 跨文档重复片）</text>
  <text x="574" y="243" class="card-s">消除版权声明、页眉页脚与模板片段，降记忆泄露</text>

  <rect x="480" y="258" width="388" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="488" y="266" width="76" height="28" rx="5" fill="#ea580c"/>
  <text x="526" y="284" class="pill" fill="#ffffff">SemDeDup</text>
  <text x="574" y="277" class="card-t">语义向量聚类去重（k-means 簇内余弦剪枝）</text>
  <text x="574" y="293" class="card-s">剔除“换词不换义”的同质新闻/题库，提升概念密度</text>

  <!-- LSH S-Curve Mini Plot -->
  <!-- Plot box: x=480..868, y=312..446 -->
  <rect x="480" y="312" width="388" height="134" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.3"/>
  <text x="494" y="330" font-size="11.2" font-weight="700" fill="#5b21b6">MinHash + LSH 候选命中概率 S 曲线：P(cand | s) = 1 - (1 - s^r)^b</text>

  <!-- Axes: x0=524, x1=724 (width 200 for s in [0,1]); y0=420 (P=0), y1=344 (P=1, height 76) -->
  <line x1="524" y1="420" x2="730" y2="420" stroke="#475569" stroke-width="1.2"/>
  <line x1="524" y1="342" x2="524" y2="420" stroke="#475569" stroke-width="1.2"/>
  <!-- 0.5 dashed line y=382 -->
  <line x1="524" y1="382" x2="724" y2="382" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="518" y="423" class="ax mono" text-anchor="end">0</text>
  <text x="518" y="385" class="ax mono" text-anchor="end">0.5</text>
  <text x="518" y="348" class="ax mono" text-anchor="end">1.0</text>
  <text x="524" y="434" class="ax mono" text-anchor="middle">0</text>
  <text x="624" y="434" class="ax mono" text-anchor="middle">0.5</text>
  <text x="684" y="434" class="ax mono" text-anchor="middle">0.8</text>
  <text x="724" y="434" class="ax mono" text-anchor="middle">1.0 (s)</text>

  <!-- Curve (20,5): t*=0.549 (orange)
       (0,0)->(524,420) (0.2,0.006)->(564,419.5) (0.3,0.047)->(584,416.4)
       (0.4,0.186)->(604,405.9) (0.5,0.470)->(624,384.3) (0.6,0.802)->(644,359.0)
       (0.7,0.976)->(664,345.8) (0.8,0.999)->(684,344.1) (1.0,1.0)->(724,344) -->
  <polyline fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4 2"
    points="524,420 564,419.5 584,416.4 604,405.9 624,384.3 644,359.0 664,345.8 684,344.1 724,344"/>

  <!-- Curve (14,8): t*=0.719 (violet, FineWeb default)
       (0,0)->(524,420) (0.4,0.009)->(604,419.3) (0.5,0.053)->(624,416.0)
       (0.6,0.212)->(644,403.9) (0.7,0.567)->(664,376.9) (0.75,0.766)->(674,361.8)
       (0.8,0.921)->(684,350.0) (0.9,0.999)->(704,344.1) (1.0,1.0)->(724,344) -->
  <polyline fill="none" stroke="#7c3aed" stroke-width="2.6"
    points="524,420 604,419.3 624,416.0 644,403.9 664,376.9 674,361.8 684,350.0 704,344.1 724,344"/>

  <!-- Legend Box on right of mini plot -->
  <line x1="742" y1="354" x2="764" y2="354" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="769" y="357" class="mono" font-size="9.5" font-weight="700" fill="#5b21b6">(14, 8) t*≈0.72</text>
  <text x="742" y="371" font-size="9.2" fill="#475569">s=0.8 召回 92.1%</text>
  <text x="742" y="384" font-size="9.2" fill="#475569">s=0.5 误杀仅 5.3%</text>

  <line x1="742" y1="402" x2="764" y2="402" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="4 2"/>
  <text x="769" y="405" class="mono" font-size="9.5" font-weight="700" fill="#9a3412">(20, 5) t*≈0.55</text>
  <text x="742" y="419" font-size="9.2" fill="#be123c">s=0.5 误杀达 47%</text>
  <text x="742" y="432" font-size="9.2" fill="#475569">易误伤模板代码/财报</text>
</svg>
