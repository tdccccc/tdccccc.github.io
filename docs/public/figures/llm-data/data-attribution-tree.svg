<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="模型评测掉点与平台期全周期数据归因决策树：先排除评测与脚手架伪影，再沿源头解析、过滤去重、配比混配、Agent 轨迹与线上漂移四支二分定位并最小成本闭环验证">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .card-t { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10px; fill: #475569; }
    .pill { font-size: 10px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="30" y="34" class="title">模型评测掉点 / 能力跷跷板 / 平台期：全周期数据归因决策树</text>
  <text x="30" y="55" class="sub">按「先排伪影、再分四层二分定位、最后微实验验证」的顺序排查，避免盲目重洗全量语料或无效重训。</text>

  <!-- Step 0: Root Symptom -->
  <rect x="280" y="70" width="360" height="44" rx="9" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="460" y="89" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">告警现象：评测显著掉点 / 能力跷跷板 / 线上大幅回退</text>
  <text x="460" y="105" font-size="10.2" fill="#be123c" text-anchor="middle">先锁定 Checkpoint 血缘与近一版 Snapshot Diff，禁止凭直觉猜原因</text>

  <line x1="460" y1="114" x2="460" y2="128" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-d)"/>

  <!-- Step 1: First Gate (Eval / Scaffold Artifact Check) -->
  <rect x="190" y="131" width="380" height="48" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="151" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">第一道分水岭：是否属评测伪影、模板截断或脚手架故障？</text>
  <text x="380" y="168" font-size="10.2" fill="#b45309" text-anchor="middle">30 题 Oracle 上下文消融 + 核对 Chat Template / 评测去污口径变化</text>

  <!-- Yes Branch to Right -->
  <line x1="570" y1="155" x2="626" y2="155" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-o)"/>
  <text x="598" y="148" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">是</text>
  <rect x="630" y="131" width="262" height="48" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="761" y="151" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">叫停洗数与训卡！归因非数据问题</text>
  <text x="761" y="168" font-size="10" fill="#b45309" text-anchor="middle">修脚手架 / 检索 / 评测模板（见《评测》Ch20）</text>

  <!-- No Branch down to 4 Data Root-Cause Branches -->
  <line x1="380" y1="179" x2="380" y2="198" stroke="#64748b" stroke-width="1.6"/>
  <text x="394" y="193" font-size="10" font-weight="700" fill="#475569">否（确认数据根因）</text>
  <line x1="130" y1="198" x2="790" y2="198" stroke="#64748b" stroke-width="1.6"/>
  <line x1="130" y1="198" x2="130" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-d)"/>
  <line x1="350" y1="198" x2="350" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-d)"/>
  <line x1="570" y1="198" x2="570" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-d)"/>
  <line x1="790" y1="198" x2="790" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-d)"/>

  <!-- Branch A: Source & Parser -->
  <rect x="28" y="216" width="204" height="156" rx="9" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
  <rect x="40" y="225" width="180" height="20" rx="10" fill="#0284c7"/>
  <text x="130" y="239" class="pill" fill="#ffffff">支线 A · 源头与解析损毁</text>
  <text x="38" y="264" class="card-t" fill="#075985">典型症状</text>
  <text x="38" y="279" class="card-s">• 代码缩进/公式/表格问答骤降</text>
  <text x="38" y="293" class="card-s">• 多模态文档密集小字频繁幻觉</text>
  <text x="38" y="313" class="card-t" fill="#075985">低成本探针与修复</text>
  <text x="38" y="328" class="card-s">• 盲抽 50 条 Raw vs Silver Diff</text>
  <text x="38" y="342" class="card-s">• 查解析器 Commit 与分辨率切片</text>
  <text x="38" y="356" class="card-s">• 查留存漏斗某步留存率异常跳变</text>

  <!-- Branch B: Filter, Dedup & Contamination -->
  <rect x="248" y="216" width="204" height="156" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.3"/>
  <rect x="260" y="225" width="180" height="20" rx="10" fill="#4f46e5"/>
  <text x="350" y="239" class="pill" fill="#ffffff">支线 B · 过滤去重与污染</text>
  <text x="258" y="264" class="card-t" fill="#3730a3">典型症状</text>
  <text x="258" y="279" class="card-s">• 特定垂域能力塌陷或 Scaling 停滞</text>
  <text x="258" y="293" class="card-s">• 离线飙升但线上泛化不涨反跌</text>
  <text x="258" y="313" class="card-t" fill="#3730a3">低成本探针与修复</text>
  <text x="258" y="328" class="card-s">• 抽检被丢弃样本查误杀（t* 过低）</text>
  <text x="258" y="342" class="card-s">• 核查重复轮数 E 是否远超 4 轮</text>
  <text x="258" y="356" class="card-s">• 跑跨轨 13-gram 与近邻去污审计</text>

  <!-- Branch C: Mixing & Cross-Modal Conflict -->
  <rect x="468" y="216" width="204" height="156" rx="9" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <rect x="480" y="225" width="180" height="20" rx="10" fill="#7c3aed"/>
  <text x="570" y="239" class="pill" fill="#ffffff">支线 C · 配比冲突与负迁移</text>
  <text x="478" y="264" class="card-t" fill="#5b21b6">典型症状</text>
  <text x="478" y="279" class="card-s">• 长推涨但短对话/指令遵循暴跌</text>
  <text x="478" y="293" class="card-s">• 视觉上调伤纯文本、过度拒绝抬头</text>
  <text x="478" y="313" class="card-t" fill="#5b21b6">低成本探针与修复</text>
  <text x="478" y="328" class="card-s">• 对比新旧快照域权重 w_m 漂移</text>
  <text x="478" y="342" class="card-s">• 300M–3B Proxy 做单域消融实验</text>
  <text x="478" y="356" class="card-s">• 补齐良性边界样本并回调配比</text>

  <!-- Branch D: Agent Trajectory & Drift -->
  <rect x="688" y="216" width="204" height="156" rx="9" fill="#fff1f2" stroke="#fda4af" stroke-width="1.3"/>
  <rect x="700" y="225" width="180" height="20" rx="10" fill="#e11d48"/>
  <text x="790" y="239" class="pill" fill="#ffffff">支线 D · Agent 工艺与漂移</text>
  <text x="698" y="264" class="card-t" fill="#9f1239">典型症状</text>
  <text x="698" y="279" class="card-s">• 模型主动伪造工具回包或死循环</text>
  <text x="698" y="293" class="card-s">• 调用废弃参数或点偏新版按钮</text>
  <text x="698" y="313" class="card-t" fill="#9f1239">低成本探针与修复</text>
  <text x="698" y="328" class="card-s">• 逐 Token 染色审计 Loss Mask m_t</text>
  <text x="698" y="342" class="card-s">• 查 Lucky Hack 过滤与 RLVR p_i 分布</text>
  <text x="698" y="356" class="card-s">• 抽样重放历史轨迹核算 ψ_stale</text>

  <!-- Converge down to bottom verification bar -->
  <line x1="130" y1="372" x2="130" y2="394" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="350" y1="372" x2="350" y2="394" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="570" y1="372" x2="570" y2="394" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="790" y1="372" x2="790" y2="394" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Bottom Verification Bar -->
  <rect x="28" y="398" width="864" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="34" y="406" width="5" height="50" rx="2.5" fill="#059669"/>
  <text x="52" y="424" font-size="13" font-weight="700" fill="#065f46">最小成本闭环修复与确认流程（绝不凭直觉全量重跑）</text>
  <text x="52" y="443" font-size="10.8" fill="#047857">① 沿血缘 DAG 定位精准责任 Commit/批次 → ② 在 Proxy 或 Micro-annealing（≤5% 算力）做单一变量对照 → ③ 密封 Holdout 显著性验收 → ④ 固化进上线红线清单</text>
</svg>
