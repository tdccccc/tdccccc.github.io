<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-label="万亿 Token 分布式数据处理基建架构：对象存储、异构处理引擎、列式与流式格式及确定性在线混洗加载器">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.6px; fill: #64748b; }
    .zone-t { font-size: 12.5px; font-weight: 700; text-anchor: middle; }
    .card-t { font-size: 11.4px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 9.8px; fill: #475569; }
    .pill { font-size: 9.5px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-sl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="arr-em2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="34" class="title">万亿 Token 分布式数据处理基建与确定性流式喂料架构</text>
  <text x="36" y="55" class="sub">打通百 TB 对象存储 → 异构 CPU/GPU 批处理引擎 → 列式/流式介质 → 确定性混洗与在线动态混配喂料，消除万卡 GPU I/O 饥饿。</text>

  <!-- ZONE 1: Object Storage (x=36..172) -->
  <rect x="36" y="72" width="136" height="278" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="44" y="80" width="120" height="22" rx="6" fill="#334155"/>
  <text x="104" y="95" class="zone-t" fill="#ffffff">1. 原始对象存储</text>

  <rect x="46" y="114" width="116" height="68" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="104" y="133" class="card-t" text-anchor="middle">S3 / OSS / GCS</text>
  <text x="104" y="151" class="mono" font-size="10.2" font-weight="700" fill="#0284c7" text-anchor="middle">100 TB WARC</text>
  <text x="104" y="168" class="card-s" text-anchor="middle">~10 万个压缩分片</text>

  <rect x="46" y="194" width="116" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="104" y="213" class="card-t" text-anchor="middle">PDF / Git / 多模态</text>
  <text x="104" y="231" class="card-s" text-anchor="middle">冷数据原件归档</text>
  <text x="104" y="247" class="card-s" text-anchor="middle">按 Prefix 均匀打散</text>

  <rect x="46" y="272" width="116" height="66" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="104" y="291" class="card-t" fill="#9a3412" text-anchor="middle">I/O 带宽红线</text>
  <text x="104" y="309" class="card-s" text-anchor="middle">避免百万小文件</text>
  <text x="104" y="325" class="card-s" text-anchor="middle">单分片 128–512MB</text>

  <!-- Arrow 1->2 -->
  <line x1="172" y1="160" x2="192" y2="160" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-sl)"/>
  <line x1="172" y1="265" x2="192" y2="265" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-sl)"/>

  <!-- ZONE 2: Distributed Compute Engines (x=196..444) -->
  <rect x="196" y="72" width="248" height="278" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
  <rect x="206" y="80" width="228" height="22" rx="6" fill="#0284c7"/>
  <text x="320" y="95" class="zone-t" fill="#ffffff">2. 异构分布式处理引擎</text>

  <!-- CPU Pool -->
  <rect x="208" y="112" width="224" height="106" rx="8" fill="#ffffff" stroke="#7dd3fc"/>
  <rect x="216" y="120" width="96" height="18" rx="9" fill="#0369a1"/>
  <text x="264" y="132" class="pill" fill="#ffffff">CPU 吞吐型集群</text>
  <text x="320" y="133" class="mono" font-size="9.5" font-weight="700" fill="#0369a1">Spot 实例省 70%</text>
  <text x="216" y="154" class="card-t">Datatrove（无中心分片） / Spark</text>
  <text x="216" y="171" class="card-s">• 解析、启发式、FastText 均无状态并行</text>
  <text x="216" y="187" class="card-s">• MinHash LSH 全局 Shuffle 内存瓶颈：</text>
  <text x="216" y="203" class="card-s">  需分桶外排 + 连通分量去长尾倾斜</text>

  <!-- GPU Pool -->
  <rect x="208" y="228" width="224" height="110" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <rect x="216" y="236" width="96" height="18" rx="9" fill="#4f46e5"/>
  <text x="264" y="248" class="pill" fill="#ffffff">GPU 异构流水线</text>
  <text x="320" y="249" class="mono" font-size="9.5" font-weight="700" fill="#3730a3">流式背压防 OOM</text>
  <text x="216" y="270" class="card-t">Ray Data / NeMo Curator</text>
  <text x="216" y="287" class="card-s">• CPU 解压预处理与 GPU 推理重叠流水</text>
  <text x="216" y="303" class="card-s">• 承载 Encoder 打分、OCR-VLM、改写合成</text>
  <text x="216" y="319" class="card-s">• RAPIDS cuDF 加速 GPU MinHash/语义去重</text>

  <!-- Arrow 2->3 -->
  <line x1="444" y1="210" x2="464" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-sl)"/>

  <!-- ZONE 3: Storage & Streaming Formats (x=468..656) -->
  <rect x="468" y="72" width="188" height="278" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <rect x="478" y="80" width="168" height="22" rx="6" fill="#7c3aed"/>
  <text x="562" y="95" class="zone-t" fill="#ffffff">3. 分层存储与介质</text>

  <rect x="478" y="112" width="168" height="52" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="488" y="130" class="card-t" fill="#5b21b6">Parquet（Silver 清洗层）</text>
  <text x="488" y="146" class="card-s">列裁剪与统计过滤极快</text>
  <text x="488" y="159" class="card-s">弱项：不支持随机单行高并发查</text>

  <rect x="478" y="170" width="168" height="52" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="488" y="188" class="card-t" fill="#5b21b6">Lance（多模态随机湖）</text>
  <text x="488" y="204" class="card-s">百倍随机读 + 内置向量索引</text>
  <text x="488" y="217" class="card-s">适合图文/视频与交互式排错</text>

  <rect x="478" y="228" width="168" height="52" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="488" y="246" class="card-t" fill="#5b21b6">WebDataset / MDS</text>
  <text x="488" y="262" class="card-s">顺序 TAR/分片流式拉取</text>
  <text x="488" y="275" class="card-s">对象存储直喂无本地盘瓶颈</text>

  <rect x="478" y="286" width="168" height="52" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="488" y="304" class="card-t" fill="#065f46">Megatron .bin / .idx</text>
  <text x="488" y="320" class="card-s">预分词连续二进制 mmap 映射</text>
  <text x="488" y="333" class="card-s">纯文本预训练极致零 CPU 开销</text>

  <!-- Arrow 3->4 -->
  <line x1="656" y1="210" x2="676" y2="210" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-em2)"/>

  <!-- ZONE 4: Deterministic Loader -> Training Cluster (x=680..884) -->
  <rect x="680" y="72" width="204" height="278" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.4"/>
  <rect x="690" y="80" width="184" height="22" rx="6" fill="#059669"/>
  <text x="782" y="95" class="zone-t" fill="#ffffff">4. 确定性流式喂料</text>

  <rect x="690" y="112" width="184" height="66" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="700" y="130" class="card-t">在线动态混配 w_m(t)</text>
  <text x="700" y="147" class="card-s">训练中动态调整各域采样权重</text>
  <text x="700" y="163" class="card-s">切入退火阶段无需重物化 TB 盘</text>

  <rect x="690" y="186" width="184" height="72" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="700" y="204" class="card-t">确定性混洗与精确续训</text>
  <text x="700" y="221" class="card-s">双射伪随机置换 + 游标快照：</text>
  <text x="700" y="237" class="mono" font-size="9.2" fill="#047857">(epoch, shard, offset)</text>
  <text x="700" y="251" class="card-s">扩缩卡数不断片、不重读不漏读</text>

  <rect x="690" y="266" width="184" height="72" rx="7" fill="#1e293b"/>
  <text x="782" y="288" text-anchor="middle" font-size="11.8" font-weight="700" fill="#ffffff">万卡 GPU 训练集群</text>
  <text x="782" y="307" text-anchor="middle" font-size="9.8" fill="#6ee7b7">双缓冲异步预取（Async Prefetch）</text>
  <text x="782" y="325" text-anchor="middle" font-size="9.8" fill="#cbd5e1">Data Wait Time &lt; 1% Step Time</text>

  <!-- Bottom Cost Ledger Strip -->
  <rect x="36" y="366" width="848" height="78" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
  <text x="52" y="388" font-size="12.5" font-weight="700" fill="#9a3412">100 TB WARC（25T 原始）→ 3T 净 Token 单轮批处理成本与资源账本（教材基准口径）</text>
  <line x1="52" y1="396" x2="868" y2="396" stroke="#fed7aa"/>
  <text x="52" y="414" font-size="10.8" fill="#334155">• <tspan font-weight="700">解析+启发+FastText（CPU）：</tspan>~8,000–15,000 vCPU-hr（Spot 约 $300–$700）</text>
  <text x="470" y="414" font-size="10.8" fill="#334155">• <tspan font-weight="700">MinHash LSH Shuffle（高内存）：</tspan>TB 级外排/网络（约 $400–$1,000）</text>
  <text x="52" y="434" font-size="10.8" fill="#334155">• <tspan font-weight="700">轻量 Encoder 打分（FP16 GPU）：</tspan>~400–800 H100-hr（约 $800–$1,600）</text>
  <text x="470" y="434" font-size="10.8" font-weight="700" fill="#c2410c">→ 折合总洗数单价：$0.03–$0.12 / 1B tokens（含容错重跑）</text>
</svg>
