<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 455" role="img" aria-label="WSD 学习率退火阶段配方剧变、预训练改写合成与长上下文构造机制图">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.6px; fill: #64748b; }
    .sec-t { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .card-t { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10.2px; fill: #475569; }
    .lbl { font-size: 10.2px; font-weight: 700; }
    .ax { font-size: 10px; fill: #475569; }
  </style>

  <rect width="920" height="455" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="34" class="title">Mid-training（退火阶段）动态配方跃迁与长上下文数据工程</text>
  <text x="36" y="55" class="sub">采用 WSD（Warmup-Stable-Decay）日程：在最后 5%–10% 学习率退火与上下文扩展窗口，高密度注入数学、代码、改写教科书与长文档。</text>

  <!-- TOP CHART: Stacked Domain Weights + WSD LR Overlay -->
  <rect x="36" y="70" width="848" height="202" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="52" y="92" class="sec-t">15T Token 全周期数据配比 w_m(t) 与 WSD 学习率曲线耦合日程</text>

  <!-- Legend inline top right -->
  <rect x="448" y="80" width="11" height="11" rx="2" fill="#93c5fd"/>
  <text x="463" y="90" font-size="10" fill="#334155">通用网页</text>
  <rect x="518" y="80" width="11" height="11" rx="2" fill="#6ee7b7"/>
  <text x="533" y="90" font-size="10" fill="#334155">代码仓</text>
  <rect x="578" y="80" width="11" height="11" rx="2" fill="#c4b5fd"/>
  <text x="593" y="90" font-size="10" fill="#334155">数学/改写合成</text>
  <rect x="670" y="80" width="11" height="11" rx="2" fill="#fcd34d"/>
  <text x="685" y="90" font-size="10" fill="#334155">原生/聚类长文档</text>
  <line x1="774" y1="86" x2="796" y2="86" stroke="#e11d48" stroke-width="2.5"/>
  <text x="802" y="90" font-size="10" font-weight="700" fill="#be123c">LR 日程</text>

  <!-- Chart area: x in [76, 846] (width 770); y in [104, 232] (height 128 for 0..100%)
       Stable stage: 0%..85% -> x = 76..730 (width 654)
       Mid-training/Annealing stage: 85%..100% -> x = 730..846 (width 116)
       Wait: let's make annealing visually clearer (e.g. non-linear scale or 80%..100% visual width so labels fit cleanly!)
       Stage 1 (0–13.5T, 90% tokens, 4K–8K ctx): x = 76..610 (width 534)
       Stage 2 (13.5T–15.0T, 10% tokens, Annealing + 32K→128K ctx): x = 610..846 (width 236, zoomed!)
  -->

  <!-- Stacked Areas -->
  <!-- Stage 1 (x=76..610):
       Bottom: Web 64% (h=82, y=150..232)
       Next: Code 16% (h=20.5, y=129.5..150)
       Next: Math/Synth 10% (h=12.8, y=116.7..129.5)
       Top: Books/Long 10% (h=12.7, y=104..116.7)
       Transition ramp x=610..634 to Stage 2 (x=634..846):
       Bottom: Web (Top Edu only) 20% (h=25.6, y=206.4..232)
       Next: Code 25% (h=32, y=174.4..206.4)
       Next: Math/Synth/QA 35% (h=44.8, y=129.6..174.4)
       Top: Long-Doc 32K-1M 20% (h=25.6, y=104..129.6)
  -->
  <!-- Web area -->
  <polygon points="76,232 76,150 610,150 634,206.4 846,206.4 846,232" fill="#bfdbfe" opacity="0.85"/>
  <!-- Code area -->
  <polygon points="76,150 76,129.5 610,129.5 634,174.4 846,174.4 846,206.4 634,206.4 610,150" fill="#a7f3d0" opacity="0.88"/>
  <!-- Math / Synthetic Rephrasing area -->
  <polygon points="76,129.5 76,116.7 610,116.7 634,129.6 846,129.6 846,174.4 634,174.4 610,129.5" fill="#ddd6fe" opacity="0.9"/>
  <!-- Long-doc area -->
  <polygon points="76,116.7 76,104 610,104 634,104 846,104 846,129.6 634,129.6 610,116.7" fill="#fde68a" opacity="0.9"/>

  <!-- Labels inside areas -->
  <text x="340" y="196" class="lbl" fill="#1e40af" text-anchor="middle">通用网页 Web（64%：广度世界知识）</text>
  <text x="340" y="144" font-size="9.6" font-weight="700" fill="#065f46" text-anchor="middle">代码 16%</text>
  <text x="340" y="126" font-size="9.2" font-weight="700" fill="#5b21b6" text-anchor="middle">数学/百科 10%</text>
  <text x="340" y="114" font-size="9.2" font-weight="700" fill="#92400e" text-anchor="middle">书籍 10%</text>

  <text x="742" y="223" font-size="9.8" font-weight="700" fill="#1e40af" text-anchor="middle">精选高分网页 20%</text>
  <text x="742" y="194" font-size="9.8" font-weight="700" fill="#065f46" text-anchor="middle">仓库级代码 25%</text>
  <text x="742" y="156" font-size="10.2" font-weight="700" fill="#5b21b6" text-anchor="middle">数学推理 + 改写合成 35%</text>
  <text x="742" y="120" font-size="9.8" font-weight="700" fill="#92400e" text-anchor="middle">原生/聚类长文 20%</text>

  <!-- Vertical boundary at Stage 1 -> Stage 2 -->
  <line x1="610" y1="100" x2="610" y2="236" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- WSD Learning Rate Overlay Curve -->
  <!-- Warmup 76->106 (y=230->114), Stable 106->610 (y=114), Cosine/Linear Decay 610->846 (y=114->230) -->
  <path d="M 76 230 L 106 114 L 610 114 Q 720 120 846 230" fill="none" stroke="#e11d48" stroke-width="2.8"/>
  <circle cx="610" cy="114" r="4" fill="#e11d48"/>
  <rect x="466" y="102" width="136" height="18" rx="4" fill="#fff1f2" stroke="#fda4af"/>
  <text x="534" y="115" text-anchor="middle" font-size="9.6" font-weight="700" fill="#be123c">Stable 稳定学习率期</text>

  <!-- Axes & X annotations -->
  <line x1="76" y1="232" x2="846" y2="232" stroke="#475569" stroke-width="1.4"/>
  <line x1="76" y1="104" x2="76" y2="232" stroke="#475569" stroke-width="1.4"/>
  <text x="68" y="235" class="ax mono" text-anchor="end">0%</text>
  <text x="68" y="170" class="ax mono" text-anchor="end">50%</text>
  <text x="68" y="108" class="ax mono" text-anchor="end">100%</text>

  <text x="76" y="248" class="ax mono">0T</text>
  <text x="340" y="248" class="ax" text-anchor="middle" font-weight="700">阶段 1：主体预训练（0–13.5T · 4K/8K 上下文）</text>
  <text x="610" y="248" class="ax mono" text-anchor="middle" font-weight="700" fill="#be123c">13.5T (90%)</text>
  <text x="735" y="248" class="ax" text-anchor="middle" font-weight="700" fill="#be123c">阶段 2：退火 + 128K/1M 扩展（末 10%）</text>
  <text x="846" y="248" class="ax mono" text-anchor="end">15.0T</text>
  <text x="460" y="264" text-anchor="middle" font-size="10.2" fill="#64748b">注：WSD 允许随时从 Stable 检查点分叉做低成本退火试验，无需像传统 Cosine 日程一样从头重训</text>

  <!-- BOTTOM 3 PILLAR CARDS -->
  <!-- Card 1: Synthetic Rephrasing -->
  <rect x="36" y="284" width="272" height="154" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <rect x="48" y="294" width="110" height="20" rx="10" fill="#7c3aed"/>
  <text x="103" y="308" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">支柱 1 · 改写合成</text>
  <text x="48" y="332" class="card-t">打破“网页数据墙”的教科书重塑</text>
  <text x="48" y="352" class="card-s">• 路径：WRAP / Phi / Nemotron-CC 多视角</text>
  <text x="48" y="369" class="card-s">  （百科摘要、问答对、分步推导）重排原文档</text>
  <text x="48" y="388" class="card-s">• 事实锚定铁律：严格基于源文档改写，禁止</text>
  <text x="48" y="405" class="card-s">  无源自由编造以防幻觉放大与模型坍缩</text>
  <text x="48" y="426" class="mono" font-size="10" font-weight="700" fill="#6d28d9">成本：$0.08–0.25 / 1M tok（8×H100）</text>

  <!-- Card 2: Annealing Mechanics -->
  <rect x="324" y="284" width="272" height="154" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.3"/>
  <rect x="336" y="294" width="110" height="20" rx="10" fill="#e11d48"/>
  <text x="391" y="308" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">支柱 2 · 退火跃迁</text>
  <text x="336" y="332" class="card-t">为何末段 5%–10% 决定能力上限？</text>
  <text x="336" y="352" class="card-s">• 优化动力学：Stable 期大步长在广域谷底震</text>
  <text x="336" y="369" class="card-s">  荡；LR 衰减期小步长将参数精准锁进高质</text>
  <text x="336" y="386" class="card-s">  量局部盆地，最近所见数据权重被几何放大</text>
  <text x="336" y="405" class="card-s">• 案例：OLMo-2 Dolmino / Qwen3 / DeepSeek</text>
  <text x="336" y="426" class="mono" font-size="10" font-weight="700" fill="#be123c">实证：GSM8K/MMLU 末段跃升 +5~15 pp</text>

  <!-- Card 3: Long Context -->
  <rect x="612" y="284" width="272" height="154" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <rect x="624" y="294" width="118" height="20" rx="10" fill="#d97706"/>
  <text x="683" y="308" font-size="10.2" font-weight="700" fill="#ffffff" text-anchor="middle">支柱 3 · 长上下文</text>
  <text x="624" y="332" class="card-t">32K → 128K → 1M 三类燃料配方</text>
  <text x="624" y="352" class="card-s">• ① 原生长文档：整书、完整代码仓、长财报</text>
  <text x="624" y="369" class="card-s">• ② 语义聚类拼接（ProLong / ICP）：按向量</text>
  <text x="624" y="386" class="card-s">  近邻串联相关短文，避免随机拼接虚假噪声</text>
  <text x="624" y="405" class="card-s">• ③ 合成长依赖：多跳问答、跨文件调用追踪</text>
  <text x="624" y="426" class="mono" font-size="10" font-weight="700" fill="#b45309">原则：同时保留 ≥30% 短文防短窗退化</text>
</svg>
