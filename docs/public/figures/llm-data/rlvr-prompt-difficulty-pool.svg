<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 465" role="img" aria-label="RLVR 零梯度浪费曲线、抗作弊确定性验证器与甜点区动态课程池">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .panel-t { font-size: 13.8px; font-weight: 700; fill: #1e293b; }
    .panel-s { font-size: 10.8px; fill: #64748b; }
    .axis-lbl { font-size: 11px; font-weight: 600; fill: #334155; }
    .tick { font-size: 10px; fill: #64748b; }
    .card-t { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .card-s { font-size: 10.2px; fill: #475569; }
    .badge { font-size: 9.8px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="arr-sl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="920" height="465" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="34" class="title">RLVR 零梯度浪费曲线、抗作弊验证器与甜点区动态课程池</text>
  <text x="36" y="56" class="sub">RLVR 时代的核心壁垒：高信息量题目 + 零作弊 Verifier + 精准卡在 p_i ∈ [0.1, 0.8] 的动态难度调度。</text>

  <!-- Left Panel: Exact Zero-Grad Waste Curve -->
  <rect x="36" y="74" width="460" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="44" y="84" width="4" height="28" rx="2" fill="#059669"/>
  <text x="56" y="98" class="panel-t">A. 组采样零梯度浪费公式：P(zero-grad | p_i, G)</text>
  <text x="56" y="113" class="panel-s" font-family="JetBrains Mono, monospace">P(zero-grad) = p_i^G + (1 - p_i)^G   （组内全对或全错 ⇒ 优势恒为 0）</text>

  <!-- Plot Area: x=94..454 (w=360), y=132..352 (h=220) -->
  <!-- Shaded difficulty zones -->
  <rect x="94" y="132" width="36" height="220" fill="#fef2f2"/>
  <rect x="130" y="132" width="252" height="220" fill="#ecfdf5"/>
  <rect x="382" y="132" width="72" height="220" fill="#fffbeb"/>

  <!-- Horizontal Gridlines -->
  <line x1="94" y1="132" x2="454" y2="132" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="94" y1="187" x2="454" y2="187" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="94" y1="242" x2="454" y2="242" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="94" y1="297" x2="454" y2="297" stroke="#e2e8f0" stroke-dasharray="3 3"/>

  <!-- Zone boundary dashed vertical lines -->
  <line x1="130" y1="132" x2="130" y2="352" stroke="#dc2626" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="382" y1="132" x2="382" y2="352" stroke="#d97706" stroke-width="1.1" stroke-dasharray="4 3"/>

  <!-- Zone top labels -->
  <text x="112" y="147" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">过难</text>
  <rect x="184" y="138" width="144" height="20" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="256" y="152" font-size="10.2" font-weight="700" fill="#065f46" text-anchor="middle">Sweet Spot 甜点区 [0.1, 0.8]</text>
  <text x="418" y="147" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">过易饱和</text>

  <!-- G=4 dashed reference curve (shifted y by +2 for y=132..352) -->
  <polyline fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"
    points="94,132 112,172.8 130,207.7 166,261.5 202,297.4 238,317.9 274,324.5 310,317.9 346,297.4 382,261.5 418,207.7 436,172.8 454,132"/>

  <!-- G=8 primary solid curve -->
  <polyline fill="none" stroke="#059669" stroke-width="2.6"
    points="94,132 101.2,164.8 112,206.1 130,257.3 148,292.1 166,315.1 184,330.0 202,339.3 238,348.2 274,350.3 310,348.2 346,339.3 364,330.0 382,315.1 400,292.1 418,257.3 436,206.1 446.8,164.8 454,132"/>

  <!-- Key callout dots on G=8 -->
  <circle cx="101.2" cy="164.8" r="4.2" fill="#dc2626"/>
  <line x1="106" y1="165" x2="144" y2="178" stroke="#dc2626" stroke-width="1.1"/>
  <rect x="145" y="168" width="136" height="22" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="213" y="183" font-size="9.8" font-weight="700" fill="#991b1b" text-anchor="middle">p=0.02 → 85.1% 算力空转</text>

  <circle cx="274" cy="350.3" r="4.2" fill="#059669"/>
  <rect x="188" y="286" width="172" height="22" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="274" y="301" font-size="9.8" font-weight="700" fill="#065f46" text-anchor="middle">p=0.50 → 有效梯度率 99.2%</text>
  <line x1="274" y1="308" x2="274" y2="345" stroke="#059669" stroke-width="1.1"/>

  <!-- Legend -->
  <line x1="292" y1="210" x2="316" y2="210" stroke="#059669" stroke-width="2.6"/>
  <text x="322" y="214" font-size="10" font-weight="700" fill="#065f46">G = 8（主流 GRPO）</text>
  <line x1="292" y1="227" x2="316" y2="227" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="322" y="231" font-size="10" fill="#64748b">G = 4（浪费显著抬高）</text>

  <!-- Axes -->
  <line x1="94" y1="352" x2="462" y2="352" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-sl)"/>
  <line x1="94" y1="352" x2="94" y2="126" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-sl)"/>

  <!-- X Ticks -->
  <text x="94" y="366" class="tick" text-anchor="middle">0.0</text>
  <text x="130" y="366" class="tick" text-anchor="middle" font-weight="700" fill="#dc2626">0.1</text>
  <text x="166" y="366" class="tick" text-anchor="middle">0.2</text>
  <text x="274" y="366" class="tick" text-anchor="middle">0.5</text>
  <text x="382" y="366" class="tick" text-anchor="middle" font-weight="700" fill="#d97706">0.8</text>
  <text x="418" y="366" class="tick" text-anchor="middle">0.9</text>
  <text x="454" y="366" class="tick" text-anchor="middle">1.0</text>
  <text x="274" y="386" class="axis-lbl" text-anchor="middle">题目在当前策略下的真实通过率 p_i</text>

  <!-- Y Ticks -->
  <text x="87" y="355" class="tick" text-anchor="end">0%</text>
  <text x="87" y="300" class="tick" text-anchor="end">25%</text>
  <text x="87" y="245" class="tick" text-anchor="end">50%</text>
  <text x="87" y="190" class="tick" text-anchor="end">75%</text>
  <text x="87" y="136" class="tick" text-anchor="end">100%</text>
  <text x="53" y="244" class="axis-lbl" text-anchor="middle" transform="rotate(-90 53 244)">零梯度浪费率 P(zero-grad)</text>

  <!-- Bottom note in Panel A -->
  <rect x="66" y="400" width="406" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="269" y="415" font-size="10.2" font-weight="600" fill="#334155" text-anchor="middle">结论：当 G=8 且 p_i ∈ [0.15, 0.85] 时，有效梯度命中率稳超 72%</text>

  <!-- Right Panel: Verifiable Factory & Dynamic Pool -->
  <rect x="512" y="74" width="372" height="360" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="520" y="84" width="4" height="28" rx="2" fill="#4f46e5"/>
  <text x="532" y="98" class="panel-t">B. 题库防作弊硬化与动态课程补池闭环</text>
  <text x="532" y="113" class="panel-s">每道入库题 = 清晰无歧义 Prompt + 零作弊确定性 Verifier</text>

  <!-- Card 1 -->
  <rect x="528" y="128" width="338" height="58" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="538" y="136" width="54" height="18" rx="9" fill="#4f46e5"/>
  <text x="565" y="149" class="badge" fill="#ffffff">挖掘硬化</text>
  <text x="600" y="149" class="card-t">公开题去污 + 反记忆同构改写</text>
  <text x="538" y="171" class="card-s">参数化重抽数值与语境；剔除无解、多解与含糊表述</text>

  <line x1="697" y1="186" x2="697" y2="200" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <!-- Card 2 -->
  <rect x="528" y="202" width="338" height="62" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="538" y="210" width="54" height="18" rx="9" fill="#ea580c"/>
  <text x="565" y="223" class="badge" fill="#ffffff">抗作弊器</text>
  <text x="600" y="223" class="card-t">绑定确定性 Verifier + 防 Hack 压测</text>
  <text x="538" y="243" class="card-s">• 数学：SymPy / Lean 符号等价 · 拒绝脆弱字符串匹配</text>
  <text x="538" y="257" class="card-s">• 代码：沙箱隔离 + 边界/反例单测（查假阳性 &lt;0.5%）</text>

  <line x1="697" y1="264" x2="697" y2="278" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <!-- Card 3 -->
  <rect x="528" y="280" width="338" height="56" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="538" y="288" width="54" height="18" rx="9" fill="#059669"/>
  <text x="565" y="301" class="badge" fill="#ffffff">难度画像</text>
  <text x="600" y="301" class="card-t">离线 Pass@k 摸底分桶（η_pass ≈ 25%）</text>
  <text x="538" y="322" class="card-s">按基座 Checkpoint 实测 p_i 划入 Easy / Sweet / Hard 桶</text>

  <line x1="697" y1="336" x2="697" y2="350" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-g)"/>

  <!-- Card 4 -->
  <rect x="528" y="352" width="338" height="64" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="538" y="360" width="54" height="18" rx="9" fill="#7c3aed"/>
  <text x="565" y="373" class="badge" fill="#ffffff">在线换血</text>
  <text x="600" y="373" class="card-t">训练中动态淘汰与难题补池</text>
  <text x="538" y="393" class="card-s">策略变强后 p_i 右移出 0.8 → 自动退休已掌握题，解锁</text>
  <text x="538" y="408" class="card-s">Hard 桶并触发新合成题入池（~$0.02–$0.15 / 有效题）</text>

  <!-- Right feedback loop arrow from Card 4 back to Card 3 -->
  <path d="M 866 384 L 876 384 L 876 308 L 869 308" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Footer -->
  <text x="460" y="453" text-anchor="middle" font-size="11" fill="#64748b">联动《LLM 强化学习》第 5 章（GRPO/DAPO 验证器设计）与第 11 章（RLVR 规模化推理演化）。</text>
</svg>
