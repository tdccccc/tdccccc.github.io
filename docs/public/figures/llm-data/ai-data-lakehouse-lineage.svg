<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 465" role="img" aria-label="企业多模态 AI 数据湖仓四层架构与端到端双向数据血缘 DAG：上方展示 Raw、Silver、Gold、Immutable Snapshot 四层演进，下方展示支持故障反向溯源与合规定向删数的双向血缘图">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .tier-t { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .tier-sub { font-size: 10.2px; text-anchor: middle; }
    .item { font-size: 10.5px; fill: #334155; }
    .node-t { font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .node-s { font-size: 9.6px; fill: #64748b; text-anchor: middle; }
    .pill { font-size: 10px; font-weight: 700; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-rose-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#e11d48"/>
    </marker>
    <marker id="arr-amb-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-bi-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arr-bi-l" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10,1 L1,5 L10,9 Z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="920" height="465" fill="#fbfcfe" rx="8"/>

  <!-- Title -->
  <text x="30" y="34" class="title">企业多模态 AI 数据湖仓四层架构与端到端双向血缘 DAG</text>
  <text x="30" y="55" class="sub">四层不可变分层沉淀多模态私有资产，底部血缘 DAG 保障模型权重与原始行记录分钟级双向互查。</text>

  <!-- UPPER SECTION: 4-Tier AI Data Lakehouse -->
  <!-- Tier 0: Raw -->
  <rect x="28" y="74" width="196" height="178" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="28" y="74" width="196" height="40" rx="10" fill="#e2e8f0"/>
  <rect x="28" y="102" width="196" height="12" fill="#e2e8f0"/>
  <text x="126" y="93" class="tier-t" fill="#1e293b">L0 · Raw 原始着陆层</text>
  <text x="126" y="108" class="tier-sub" fill="#475569">Append-Only 不可变对象存储</text>
  <text x="40" y="134" class="item">• PDF / PPT / 合同 / CAD 图纸</text>
  <text x="40" y="153" class="item">• 客服工单与排障会话原件</text>
  <text x="40" y="172" class="item">• 内部代码仓与 PR Review</text>
  <text x="40" y="191" class="item">• ERP / CRM 操作日志流</text>
  <text x="40" y="210" class="item">• 人工修订 Diff (Human Edits)</text>
  <rect x="42" y="222" width="168" height="21" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="126" y="236" class="mono" font-size="9.5" fill="#475569" text-anchor="middle">S3/OSS + 租户分桶 + WORM</text>

  <line x1="224" y1="163" x2="246" y2="163" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-r)"/>

  <!-- Tier 1: Silver -->
  <rect x="250" y="74" width="196" height="178" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
  <rect x="250" y="74" width="196" height="40" rx="10" fill="#bae6fd"/>
  <rect x="250" y="102" width="196" height="12" fill="#bae6fd"/>
  <text x="348" y="93" class="tier-t" fill="#075985">L1 · Silver 清洗脱敏层</text>
  <text x="348" y="108" class="tier-sub" fill="#0369a1">解析 · 去重 · 脱敏 · 统一 IR</text>
  <text x="262" y="134" class="item">• 多模态版面/表格/OCR 抽取</text>
  <text x="262" y="153" class="item">• 精确 + MinHash / 语义去重</text>
  <text x="262" y="172" class="item">• 全模态 PII 假名化与遮罩</text>
  <text x="262" y="191" class="item">• 统一 Trajectory IR / Schema</text>
  <text x="262" y="210" class="item">• 附带解析器 Git SHA 与日志</text>
  <rect x="264" y="222" width="168" height="21" rx="5" fill="#ffffff" stroke="#7dd3fc"/>
  <text x="348" y="236" class="mono" font-size="9.5" fill="#0369a1" text-anchor="middle">Iceberg / Parquet + 元数据</text>

  <line x1="446" y1="163" x2="468" y2="163" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-r)"/>

  <!-- Tier 2: Gold -->
  <rect x="472" y="74" width="196" height="178" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.4"/>
  <rect x="472" y="74" width="196" height="40" rx="10" fill="#ddd6fe"/>
  <rect x="472" y="102" width="196" height="12" fill="#ddd6fe"/>
  <text x="570" y="93" class="tier-t" fill="#5b21b6">L2 · Gold 精选特征层</text>
  <text x="570" y="108" class="tier-sub" fill="#6d28d9">质量分桶 · 向量索引 · 多模态读取</text>
  <text x="484" y="134" class="item">• 按域/模态/难度分桶管理</text>
  <text x="484" y="153" class="item">• 质量分类器与难度 p_i 标签</text>
  <text x="484" y="172" class="item">• 稠密向量索引与语义检索</text>
  <text x="484" y="191" class="item">• 图/视频大对象随机低延读取</text>
  <text x="484" y="210" class="item">• 动态采样权重 w_m 视图</text>
  <rect x="486" y="222" width="168" height="21" rx="5" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="570" y="236" class="mono" font-size="9.5" fill="#6d28d9" text-anchor="middle">Lance / 向量索引 + 目录表</text>

  <line x1="668" y1="163" x2="690" y2="163" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-r)"/>

  <!-- Tier 3: Immutable Snapshot -->
  <rect x="694" y="74" width="198" height="178" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="694" y="74" width="198" height="40" rx="10" fill="#a7f3d0"/>
  <rect x="694" y="102" width="198" height="12" fill="#a7f3d0"/>
  <text x="793" y="93" class="tier-t" fill="#065f46">L3 · Snapshot 冻结快照</text>
  <text x="793" y="108" class="tier-sub" fill="#047857">零漂移可复现 · 训练只读交付</text>
  <text x="706" y="134" class="item">• 冻结配方 w_m 与随机种子</text>
  <text x="706" y="153" class="item">• 训练前自动去污报告绑定</text>
  <text x="706" y="172" class="item">• 顺序流式分片（MDS/Shard）</text>
  <text x="706" y="191" class="item">• 内容寻址 SHA-256 不可篡改</text>
  <text x="706" y="210" class="item">• 零拷贝分支回滚与发布标签</text>
  <rect x="708" y="222" width="170" height="21" rx="5" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="793" y="236" class="mono" font-size="9.5" fill="#047857" text-anchor="middle">LakeFS Commit / Manifest</text>

  <!-- LOWER SECTION: Bidirectional Data Lineage DAG -->
  <rect x="28" y="272" width="864" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="42" y="283" width="192" height="22" rx="11" fill="#4f46e5"/>
  <text x="138" y="298" class="pill" fill="#ffffff">端到端双向数据血缘图（Lineage DAG）</text>
  <text x="246" y="298" font-size="11" fill="#475569">每次写入自动登记不可变哈希边，确保任意节点双向穿透</text>

  <!-- Reverse Forensic Path (Top Dashed Red) -->
  <path d="M806,336 L806,317 L110,317 L110,336" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-rose-d)"/>
  <rect x="334" y="307" width="252" height="20" rx="10" fill="#fff1f2" stroke="#fda4af"/>
  <text x="460" y="321" font-size="10.2" font-weight="700" fill="#be123c" text-anchor="middle">← 故障反向取证：分钟级定位异常脚本与污染源行</text>

  <!-- 5 Lineage Nodes -->
  <rect x="42" y="340" width="136" height="52" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="110" y="361" class="node-t">Raw Row ID / 租户</text>
  <text x="110" y="378" class="node-s mono">raw_sha · tenant_id</text>

  <line x1="181" y1="366" x2="213" y2="366" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#arr-bi-l)" marker-end="url(#arr-bi-r)"/>

  <rect x="216" y="340" width="144" height="52" rx="7" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="288" y="361" class="node-t">解析清洗与脱敏脚本</text>
  <text x="288" y="378" class="node-s mono">git_sha · filter_cfg</text>

  <line x1="363" y1="366" x2="395" y2="366" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#arr-bi-l)" marker-end="url(#arr-bi-r)"/>

  <rect x="398" y="340" width="146" height="52" rx="7" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="471" y="361" class="node-t">沙箱镜像与合成器</text>
  <text x="471" y="378" class="node-s mono">docker_dig · gen_ver</text>

  <line x1="547" y1="366" x2="579" y2="366" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#arr-bi-l)" marker-end="url(#arr-bi-r)"/>

  <rect x="582" y="340" width="142" height="52" rx="7" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="653" y="361" class="node-t">冻结快照与配比 w_m</text>
  <text x="653" y="378" class="node-s mono">snap_id · seed · decontam</text>

  <line x1="727" y1="366" x2="759" y2="366" stroke="#4f46e5" stroke-width="1.5" marker-start="url(#arr-bi-l)" marker-end="url(#arr-bi-r)"/>

  <rect x="762" y="340" width="116" height="52" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="820" y="361" class="node-t" fill="#3730a3">Model / Agent</text>
  <text x="820" y="378" class="node-s mono">ckpt_v2.4 · eval</text>

  <!-- Forward Compliance Deletion Path (Bottom Dashed Amber) -->
  <path d="M110,394 L110,425 L816,425 L816,396" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-amb-r)"/>
  <rect x="310" y="414" width="300" height="22" rx="11" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="460" y="429" font-size="10.2" font-weight="700" fill="#b45309" text-anchor="middle">合规定向删数：按租户 / 版权撤回正向定位受影响快照与权重 →</text>
</svg>
