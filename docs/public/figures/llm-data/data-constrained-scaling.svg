<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-label="Data-Constrained Scaling 有效数据量重复衰减曲线与算力-数据 ROI 算例对比">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.6px; fill: #64748b; }
    .ax { font-size: 11px; fill: #475569; }
    .ax-t { font-size: 12px; font-weight: 700; fill: #1e293b; }
    .tag { font-size: 10.5px; font-weight: 700; }
    .card-t { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .card-b { font-size: 11px; fill: #475569; }
  </style>

  <rect width="920" height="440" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="36" y="34" class="title">Data-Constrained Scaling：多 Epoch 重复衰减与算力空转陷阱</text>
  <text x="36" y="55" class="sub">遵循 D_eff(D_U, E) = D_U · [1 + R_D* (1 - e^(-(E-1)/R_D*))]，经验常数 R_D* ≈ 15.0；重复超 4 轮后边际收益急剧衰减并渐近饱和于 16 D_U。</text>

  <!-- Left Plot Panel -->
  <rect x="36" y="72" width="484" height="346" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/>
  <text x="54" y="96" class="ax-t">有效数据倍数 D_eff / D_U 随训练重复轮数 E 演化曲线</text>

  <!-- Plot coordinates:
       Origin: x0=96, y0=368 (E=0, val=0)
       X range: E in [0, 25] -> x in [96, 496] (scale: 16 px per epoch)
       Y range: val in [0, 20] -> y in [368, 128] (scale: 12 px per unit)
  -->

  <!-- Shaded Regimes -->
  <!-- Sweet spot E in [1, 4]: x = 112..160 -->
  <rect x="112" y="128" width="48" height="240" fill="#ecfdf5" opacity="0.85"/>
  <!-- Diminishing E in [4, 10]: x = 160..256 -->
  <rect x="160" y="128" width="96" height="240" fill="#fffbeb" opacity="0.7"/>
  <!-- Saturation E in [10, 25]: x = 256..496 -->
  <rect x="256" y="128" width="240" height="240" fill="#fff1f2" opacity="0.55"/>

  <text x="136" y="143" class="tag" fill="#047857" text-anchor="middle">甜点区</text>
  <text x="208" y="143" class="tag" fill="#b45309" text-anchor="middle">衰减区</text>
  <text x="376" y="143" class="tag" fill="#be123c" text-anchor="middle">算力空转区（高 Epoch 严重边际递减）</text>

  <!-- Grid lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="96" y1="320" x2="496" y2="320"/>
    <line x1="96" y1="272" x2="496" y2="272"/>
    <line x1="96" y1="224" x2="496" y2="224"/>
    <line x1="96" y1="176" x2="496" y2="176"/>
    <line x1="96" y1="128" x2="496" y2="128"/>
  </g>

  <!-- Axes -->
  <line x1="96" y1="368" x2="496" y2="368" stroke="#475569" stroke-width="1.5"/>
  <line x1="96" y1="124" x2="96" y2="368" stroke="#475569" stroke-width="1.5"/>

  <!-- Y ticks (0, 4, 8, 12, 16, 20) -->
  <text x="88" y="372" class="ax mono" text-anchor="end">0</text>
  <text x="88" y="324" class="ax mono" text-anchor="end">4</text>
  <text x="88" y="276" class="ax mono" text-anchor="end">8</text>
  <text x="88" y="228" class="ax mono" text-anchor="end">12</text>
  <text x="88" y="180" class="ax mono" text-anchor="end">16</text>
  <text x="88" y="132" class="ax mono" text-anchor="end">20</text>
  <text x="56" y="248" class="ax-t" transform="rotate(-90 56 248)" text-anchor="middle">有效数据倍数 D_eff / D_U</text>

  <!-- X ticks (1, 4, 10, 15, 20, 25) -->
  <text x="112" y="386" class="ax mono" text-anchor="middle">1</text>
  <text x="160" y="386" class="ax mono" text-anchor="middle">4</text>
  <text x="256" y="386" class="ax mono" text-anchor="middle">10</text>
  <text x="336" y="386" class="ax mono" text-anchor="middle">15</text>
  <text x="416" y="386" class="ax mono" text-anchor="middle">20</text>
  <text x="496" y="386" class="ax mono" text-anchor="middle">25</text>
  <text x="296" y="406" class="ax-t" text-anchor="middle">重复训练轮数 E = D_tok / D_U</text>

  <!-- Asymptote y = 16 -> 368 - 16*12 = 176 -->
  <line x1="96" y1="176" x2="496" y2="176" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="492" y="169" class="tag mono" fill="#be123c" text-anchor="end">理论饱和极限 1 + R_D* = 16.0 D_U</text>

  <!-- Ideal linear y = E (from E=1,y=1 to E=20,y=20 -> x=112,y=356 to x=416,y=128) -->
  <line x1="112" y1="356" x2="416" y2="128" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="355" y="160" font-size="10.5" fill="#64748b" transform="rotate(-37 355 160)">理想无重复线性 y = E</text>

  <!-- Data-Constrained Curve:
       E=1: val=1.00 -> (112, 356)
       E=2: val=1.97 -> (128, 344.4)
       E=4: val=3.72 -> (160, 323.4)
       E=6: val=5.25 -> (192, 305.0)
       E=8: val=6.59 -> (224, 288.9)
       E=10: val=7.77 -> (256, 274.8)
       E=15: val=10.10 -> (336, 246.8)
       E=20: val=11.77 -> (416, 226.7)
       E=25: val=12.97 -> (496, 212.3)
  -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3"
    points="112,356 128,344.4 160,323.4 192,305.0 224,288.9 256,274.8 336,246.8 416,226.7 496,212.3"/>

  <!-- Highlight Dot E=4 -->
  <circle cx="160" cy="323.4" r="5" fill="#059669" stroke="#ffffff" stroke-width="1.8"/>
  <rect x="168" y="326" width="144" height="36" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="176" y="341" class="tag mono" fill="#065f46">E = 4 → 3.72 D_U</text>
  <text x="176" y="355" font-size="10" fill="#047857">留存效率 93.0%（近乎无损）</text>

  <!-- Highlight Dot E=20 -->
  <circle cx="416" cy="226.7" r="5" fill="#e11d48" stroke="#ffffff" stroke-width="1.8"/>
  <!-- Waste vertical bracket at E=20 (from y=128 to y=226.7) -->
  <line x1="416" y1="128" x2="416" y2="221" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="308" y="256" width="176" height="40" rx="6" fill="#fff1f2" stroke="#fda4af"/>
  <text x="316" y="272" class="tag mono" fill="#9f1239">E = 20 → 仅 11.77 D_U</text>
  <text x="316" y="288" font-size="10" fill="#be123c">41.1% 算力空转（末轮仅 +0.29 D_U）</text>

  <!-- Right Panel: Two Analytical Cards -->
  <!-- Card 1: Worked Numerical Comparison -->
  <rect x="536" y="72" width="348" height="196" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <rect x="536" y="72" width="348" height="32" rx="10" fill="#eef2ff"/>
  <rect x="536" y="92" width="348" height="12" fill="#eef2ff"/>
  <text x="552" y="93" class="card-t" fill="#3730a3">算例直击：多花 25% GPU 算力，有效数据反降 21%</text>

  <!-- Case A -->
  <text x="552" y="124" class="tag" fill="#065f46">方案 A（宽去重扩容）：D_U = 2.0T，E = 4 轮</text>
  <rect x="552" y="132" width="216" height="18" rx="4" fill="#e2e8f0"/>
  <rect x="552" y="132" width="201" height="18" rx="4" fill="#10b981"/>
  <text x="774" y="145" class="mono" font-size="10.5" font-weight="700" fill="#047857">7.44T / 8.0T</text>
  <text x="552" y="164" class="card-b">总算力消耗 8.0T tok → 有效折算 7.44T（损耗仅 0.56T）</text>

  <!-- Case B -->
  <text x="552" y="192" class="tag" fill="#9f1239">方案 B（硬刷小库）：D_U = 0.5T，E = 20 轮</text>
  <rect x="552" y="200" width="270" height="18" rx="4" fill="#fecdd3"/>
  <rect x="552" y="200" width="159" height="18" rx="4" fill="#e11d48"/>
  <text x="828" y="213" class="mono" font-size="10.5" font-weight="700" fill="#9f1239">5.89T</text>
  <text x="552" y="232" class="card-b">总算力消耗 10.0T tok → 有效折算 5.89T（白烧 4.11T！）</text>

  <rect x="552" y="242" width="316" height="18" rx="4" fill="#f8fafc"/>
  <text x="710" y="254" text-anchor="middle" font-size="10.2" font-weight="700" fill="#334155">结论：数据受限时，扩大唯一高质语料永远优于盲目加 Epoch</text>

  <!-- Card 2: Chinchilla vs Inference-Optimal -->
  <rect x="536" y="280" width="348" height="138" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
  <text x="552" y="303" class="card-t" fill="#9a3412">为何现代模型必然撞上数据墙？</text>
  <line x1="552" y1="312" x2="868" y2="312" stroke="#fed7aa"/>

  <text x="552" y="331" class="tag" fill="#1e293b">1. Chinchilla 训练最优：D_tok ≈ 20 · N_param</text>
  <text x="564" y="347" class="card-b">仅最小化单次训练 FLOPs（8B 模型仅需 160B tok）。</text>

  <text x="552" y="369" class="tag" fill="#c2410c">2. 推理最优过训练：D_tok ≈ 200–2,000 · N_param</text>
  <text x="564" y="385" class="card-b">为把线上部署压到 7B/8B 小尺寸，强灌 15T–36T tok；</text>
  <text x="564" y="402" class="card-b">迫使数据工程走向多模态扩容 + 教科书级合成改写。</text>
</svg>
