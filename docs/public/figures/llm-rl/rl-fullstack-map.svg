<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-label="LLM 强化学习全栈地图：自上而下涵盖应用场景、算法优化、奖励工程与分布式系统四层，左侧贯穿统一数学目标与稳定性归因主轴">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 13.5px; fill: #64748b; }
    .layer-title { font-size: 15px; font-weight: 700; }
    .layer-hint { font-size: 11.5px; }
    .ch-pill { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .chip-txt { font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .spine-title { font-size: 14px; font-weight: 700; fill: #065f46; text-anchor: middle; }
    .spine-card-t { font-size: 12px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .spine-card-s { font-size: 10.5px; fill: #64748b; text-anchor: middle; }
  </style>
  <defs>
    <marker id="rl-arrow-spine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
    <marker id="rl-arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="920" height="480" fill="#fbfcfe" rx="8"/>

  <!-- Header -->
  <text x="38" y="38" class="title">LLM 强化学习：原理与后训练全栈地图</text>
  <text x="38" y="62" class="sub">以统一优化目标 E[r(x,y)] − β·KL(π_θ ‖ π_ref) 为主轴，打通奖励工程、策略优化、推理/Agent 范式与规模化系统。</text>

  <!-- Left Vertical Spine -->
  <g>
    <rect x="38" y="82" width="124" height="360" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="52" y="94" width="96" height="22" rx="11" fill="#059669"/>
    <text x="100" y="109" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">贯穿全书主轴</text>

    <text x="100" y="140" class="spine-title">统一目标与</text>
    <text x="100" y="159" class="spine-title">稳定归因</text>

    <rect x="49" y="176" width="102" height="52" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="100" y="197" class="spine-card-t">统一符号体系</text>
    <text x="100" y="216" class="spine-card-s">π_θ · ρ_t · Â_t · β</text>

    <rect x="49" y="238" width="102" height="52" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="100" y="259" class="spine-card-t">三轴设计空间</text>
    <text x="100" y="278" class="spine-card-s">优势 · 步幅 · 信号密度</text>

    <rect x="49" y="300" width="102" height="52" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="100" y="321" class="spine-card-t">ScaleRL &amp; 排障</text>
    <text x="100" y="340" class="spine-card-s">熵 · KL · 训练推理一致</text>

    <rect x="49" y="366" width="102" height="62" rx="7" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="100" y="387" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">第一篇 Ch 1–3</text>
    <text x="100" y="404" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">第六篇 Ch 20</text>
    <text x="100" y="420" font-size="10" fill="#047857" text-anchor="middle">全局符号卡</text>
  </g>

  <!-- Spine connectors -->
  <line x1="162" y1="122" x2="180" y2="122" stroke="#059669" stroke-width="1.6" marker-end="url(#rl-arrow-spine)"/>
  <line x1="162" y1="214" x2="180" y2="214" stroke="#059669" stroke-width="1.6" marker-end="url(#rl-arrow-spine)"/>
  <line x1="162" y1="306" x2="180" y2="306" stroke="#059669" stroke-width="1.6" marker-end="url(#rl-arrow-spine)"/>
  <line x1="162" y1="398" x2="180" y2="398" stroke="#059669" stroke-width="1.6" marker-end="url(#rl-arrow-spine)"/>

  <!-- Layer 1: 能力涌现与任务范式 -->
  <g>
    <rect x="182" y="82" width="700" height="80" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4"/>
    <rect x="188" y="92" width="4" height="60" rx="2" fill="#0284c7"/>
    <text x="202" y="107" class="layer-title" fill="#075985">① 推理涌现、蒸馏整合与 Agentic RL 范式层</text>
    <text x="502" y="107" class="layer-hint" fill="#0284c7">从单轮长 CoT 到多轮工具环境</text>
    <rect x="720" y="90" width="150" height="22" rx="11" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="795" y="105" class="ch-pill" fill="#0369a1">第四、五篇 Ch 11–16</text>

    <rect x="202" y="120" width="160" height="30" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="282" y="139" class="chip-txt">R1 / k1.5 / Qwen3 配方</text>
    <rect x="372" y="120" width="160" height="30" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="452" y="139" class="chip-txt">熵坍缩与能力边界</text>
    <rect x="542" y="120" width="160" height="30" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="622" y="139" class="chip-txt">在线蒸馏与专家整合</text>
    <rect x="712" y="120" width="158" height="30" rx="6" fill="#ffffff" stroke="#bae6fd"/>
    <text x="791" y="139" class="chip-txt">多轮 POMDP 与 PARL</text>
  </g>

  <line x1="532" y1="162" x2="532" y2="172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rl-arrow-down)"/>

  <!-- Layer 2: 对齐与策略优化算法层 -->
  <g>
    <rect x="182" y="174" width="700" height="80" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.4"/>
    <rect x="188" y="184" width="4" height="60" rx="2" fill="#4f46e5"/>
    <text x="202" y="199" class="layer-title" fill="#3730a3">② 策略优化与偏好对齐算法层</text>
    <text x="424" y="199" class="layer-hint" fill="#4f46e5">优势估计 × 裁剪步幅 × 逐 token 稠密信号</text>
    <rect x="730" y="182" width="140" height="22" rx="11" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="800" y="197" class="ch-pill" fill="#3730a3">第三篇 Ch 7–10</text>

    <rect x="202" y="212" width="160" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="282" y="231" class="chip-txt">PPO-RLHF &amp; DPO 家族</text>
    <rect x="372" y="212" width="160" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="452" y="231" class="chip-txt">RLOO / REINFORCE++ / GRPO</text>
    <rect x="542" y="212" width="160" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="622" y="231" class="chip-txt">Dr.GRPO · DAPO · GSPO · CISPO</text>
    <rect x="712" y="212" width="158" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="791" y="231" class="chip-txt">MaxRL · GDPO · SDPO</text>
  </g>

  <line x1="532" y1="254" x2="532" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rl-arrow-down)"/>

  <!-- Layer 3: 奖励信号与防作弊层 -->
  <g>
    <rect x="182" y="266" width="700" height="80" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <rect x="188" y="276" width="4" height="60" rx="2" fill="#d97706"/>
    <text x="202" y="291" class="layer-title" fill="#92400e">③ 奖励信号工程与抗作弊层</text>
    <text x="410" y="291" class="layer-hint" fill="#b45309">决定 RL 优化上限与对齐安全性</text>
    <rect x="730" y="274" width="140" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="800" y="289" class="ch-pill" fill="#92400e">第二篇 Ch 4–6</text>

    <rect x="202" y="304" width="160" height="30" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="282" y="323" class="chip-txt">Bradley-Terry &amp; GenRM</text>
    <rect x="372" y="304" width="160" height="30" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="452" y="323" class="chip-txt">RLAIF &amp; Constitutional AI</text>
    <rect x="542" y="304" width="160" height="30" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="622" y="323" class="chip-txt">RLVR · Rubrics · PRM</text>
    <rect x="712" y="304" width="158" height="30" rx="6" fill="#ffffff" stroke="#fde68a"/>
    <text x="791" y="323" class="chip-txt">过优化与 Reward Hacking</text>
  </g>

  <line x1="532" y1="346" x2="532" y2="356" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#rl-arrow-down)"/>

  <!-- Layer 4: 规模化训练系统与稳定工程层 -->
  <g>
    <rect x="182" y="358" width="700" height="84" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <rect x="188" y="368" width="4" height="64" rx="2" fill="#dc2626"/>
    <text x="202" y="383" class="layer-title" fill="#991b1b">④ 规模化分布式训练系统与稳定性工程层</text>
    <text x="498" y="383" class="layer-hint" fill="#b91c1c">衔接《LLM 推理工程》：Rollout × Trainer 协同</text>
    <rect x="730" y="366" width="140" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="800" y="381" class="ch-pill" fill="#991b1b">第六篇 Ch 17–20</text>

    <rect x="202" y="397" width="160" height="32" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="282" y="417" class="chip-txt">共卡/分离与异步流水线</text>
    <rect x="372" y="397" width="160" height="32" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="452" y="417" class="chip-txt">TIS / IcePop / R3 / PR2</text>
    <rect x="542" y="397" width="160" height="32" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="622" y="417" class="chip-txt">veRL · slime · AReaL</text>
    <rect x="712" y="397" width="158" height="32" rx="6" fill="#ffffff" stroke="#fecaca"/>
    <text x="791" y="417" class="chip-txt">ScaleRL 扩展律与排障</text>
  </g>
</svg>
