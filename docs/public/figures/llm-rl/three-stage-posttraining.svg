<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-label="大模型训练三阶段对比：预训练、监督微调 SFT 与强化学习 RL 在数据来源、优化信号与核心目标上的本质差异">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .box-t { font-size: 15px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .box-s { font-size: 12px; text-anchor: middle; fill: #475569; }
    .lbl { font-size: 11px; font-weight: 700; fill: #64748b; }
    .cell-t { font-size: 12.5px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
    .cell-s { font-size: 11.5px; text-anchor: middle; fill: #64748b; }
  </style>
  <defs>
    <marker id="ar-stg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="ar-stg-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="860" height="270" rx="8" fill="#fbfcfe"/>
  <text x="32" y="34" class="title">大语言模型训练的三阶段演进</text>
  <text x="32" y="54" class="sub">前两步都在模仿给定的静态文本；只有进入强化学习阶段，样本来自模型自己，监督信号从“模仿”转向“结果评价”。</text>

  <!-- Stage 1 -->
  <rect x="32" y="78" width="218" height="68" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="141" y="106" class="box-t">① 预训练（Pre-training）</text>
  <text x="141" y="128" class="box-s">学会语言规律与世界知识</text>

  <!-- Arrow 1->2 -->
  <line x1="250" y1="112" x2="318" y2="112" stroke="#475569" stroke-width="1.6" marker-end="url(#ar-stg)"/>
  <text x="284" y="102" class="cell-s" font-weight="600">基座模型</text>

  <!-- Stage 2 -->
  <rect x="321" y="78" width="218" height="68" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="430" y="106" class="box-t" fill="#3730a3">② 监督微调（SFT）</text>
  <text x="430" y="128" class="box-s" fill="#4338ca">学会对话格式与指令遵循</text>

  <!-- Arrow 2->3 -->
  <line x1="539" y1="112" x2="607" y2="112" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-stg-g)"/>
  <text x="573" y="102" class="cell-s" fill="#047857" font-weight="600">指令模型</text>

  <!-- Stage 3 -->
  <rect x="610" y="78" width="218" height="68" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="719" y="106" class="box-t" fill="#065f46">③ 强化学习（RL）</text>
  <text x="719" y="128" class="box-s" fill="#047857">学会“更好”、反思与长程决策</text>

  <!-- Divider -->
  <line x1="32" y1="166" x2="828" y2="166" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="32" y="186" class="lbl mono">TRAINING SIGNAL &amp; DISTRIBUTION</text>

  <!-- Bottom detail cards -->
  <rect x="32" y="196" width="218" height="58" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="141" y="218" class="cell-t">下一个 Token 预测（MLE）</text>
  <text x="141" y="239" class="cell-s">万亿级离线互联网语料 · 无负例</text>

  <rect x="321" y="196" width="218" height="58" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="430" y="218" class="cell-t">示范回复 (x, y*) · 教师强制</text>
  <text x="430" y="239" class="cell-s">数万至数百万条 · 静态离线 · 奖励≡1</text>

  <rect x="610" y="196" width="218" height="58" rx="7" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="719" y="218" class="cell-t" fill="#065f46">自采样 y ~ π_θ + 标量/稠密奖励</text>
  <text x="719" y="239" class="cell-s" fill="#047857">On-policy · 可正可负 · 偏好/验证器/细则</text>
</svg>
