<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="LLM 生成的两种 RL 建模视角：上方为 Token 级 MDP（每步选一个 token、需要价值函数做信用分配），下方为序列级 Contextual Bandit（整条回复视为一个动作、奖励粒度自然一致）">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sec-t { font-size: 14px; font-weight: 700; }
    .sm { font-size: 11.5px; fill: #475569; }
    .tok { font-size: 12px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
    .pill { font-size: 11px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <marker id="ar-mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ar-mb-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="880" height="330" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">同一条回复，两种 RL 建模视角</text>

  <!-- Panel 1: Token-level MDP -->
  <rect x="30" y="50" width="820" height="128" rx="10" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="48" y="75" class="sec-t" fill="#3730a3">视角 A · Token 级 MDP（PPO / PRM / SDPO / OPD）</text>
  <text x="412" y="75" class="sm" fill="#4338ca">确定性转移 s_{t+1}=(x, y_{≤t}) · 动作空间 |V| ≈ 10⁵ · 末尾稀疏奖励</text>

  <!-- States and actions -->
  <rect x="48" y="92" width="92" height="38" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="94" y="115" class="tok">s₁ = (x)</text>
  <line x1="140" y1="111" x2="188" y2="111" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar-mb)"/>
  <text x="164" y="103" class="pill mono" fill="#4338ca">y₁</text>
  <text x="164" y="126" class="pill mono" fill="#64748b">r=0</text>

  <rect x="192" y="92" width="112" height="38" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="248" y="115" class="tok">s₂ = (x, y₁)</text>
  <line x1="304" y1="111" x2="352" y2="111" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar-mb)"/>
  <text x="328" y="103" class="pill mono" fill="#4338ca">y₂</text>
  <text x="328" y="126" class="pill mono" fill="#64748b">r=0</text>

  <rect x="356" y="92" width="84" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="398" y="115" class="tok" fill="#64748b">… 共 T 步 …</text>
  <line x1="440" y1="111" x2="488" y2="111" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar-mb)"/>
  <text x="464" y="103" class="pill mono" fill="#4338ca">y_T</text>
  <text x="464" y="126" class="pill mono" fill="#059669">r(x,y)</text>

  <rect x="492" y="92" width="106" height="38" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="545" y="115" class="tok">EOS 结束</text>

  <rect x="620" y="90" width="212" height="72" rx="7" fill="#ffffff" stroke="#818cf8"/>
  <text x="726" y="111" class="tok" fill="#3730a3">信用分配工具</text>
  <text x="726" y="131" class="sm" text-anchor="middle">Critic V_ψ(s_t) + GAE 估计 Â_t</text>
  <text x="726" y="149" class="sm" text-anchor="middle">或 PRM / 教师分布提供逐 token 信号</text>

  <text x="48" y="160" class="sm" fill="#3730a3">特点：方差可降到逐 token，但长回复下价值函数难学准且显存开销大。</text>

  <!-- Panel 2: Sequence-level Bandit -->
  <rect x="30" y="192" width="820" height="122" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="48" y="217" class="sec-t" fill="#065f46">视角 B · 序列级 Contextual Bandit（REINFORCE / RLOO / GRPO / DPO / GSPO）</text>

  <rect x="48" y="234" width="120" height="42" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="108" y="259" class="tok">上下文 x ~ D</text>

  <line x1="168" y1="255" x2="296" y2="255" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-mb-g)"/>
  <text x="232" y="245" class="pill" fill="#047857">单个宏动作 y = (y₁…y_T)</text>
  <text x="232" y="271" class="pill mono" fill="#64748b">π_θ(y|x) = ∏ π_θ(y_t|s_t)</text>

  <rect x="300" y="234" width="176" height="42" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="388" y="259" class="tok" fill="#065f46">直接获得序列奖励 r(x, y)</text>

  <line x1="476" y1="255" x2="532" y2="255" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-mb-g)"/>

  <rect x="536" y="230" width="296" height="68" rx="7" fill="#ffffff" stroke="#34d399"/>
  <text x="684" y="252" class="tok" fill="#065f46">广播同一序列优势 Â_i 给所有 token</text>
  <text x="684" y="272" class="sm" text-anchor="middle">无需 Critic · 与奖励粒度天然对齐</text>
  <text x="684" y="289" class="sm" text-anchor="middle">靠大量样本平均消解单条误伤方差</text>

  <text x="48" y="300" class="sm" fill="#065f46">特点：极简高效，成为 2024–2025 RLVR 推理训练默认视角；2026 的 SDPO/OPD 又把逐 token 信号请了回来。</text>
</svg>
