<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 285" role="img" aria-label="训练-推理不一致根因与修正链路图：同一组参数分别经过推理引擎与训练框架产生不同的实际对数概率，导致名义 on-policy 实际变 off-policy，展示 TIS、MIS/IcePop 与 Mu-GRPO 的截断/掩码修正机制">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .bt { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .bs { font-size: 11px; text-anchor: middle; fill: #475569; }
    .sm { font-size: 11.5px; fill: #334155; }
  </style>
  <defs>
    <marker id="ar-ti" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="ar-ti-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="285" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">训练-推理不一致（Train-Infer Mismatch）：同权重为何算出不同概率</text>
  <text x="30" y="54" class="sub">即使权重位完全相同，推理核与训练核的数值路径差异也会让名义 on-policy 变成隐蔽 off-policy，累积诱发崩溃。</text>

  <!-- Identical weights -->
  <rect x="28" y="114" width="136" height="62" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="96" y="140" class="bt" fill="#3730a3">同一组参数 θ</text>
  <text x="96" y="160" class="bs mono">BF16 权重副本</text>

  <!-- Split paths -->
  <line x1="164" y1="132" x2="220" y2="104" stroke="#475569" stroke-width="1.5" marker-end="url(#ar-ti)"/>
  <line x1="164" y1="158" x2="220" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#ar-ti)"/>

  <!-- Top path: Infer -->
  <rect x="224" y="74" width="268" height="62" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="358" y="96" class="bt" fill="#075985">推理引擎：vLLM / SGLang → π_infer</text>
  <text x="358" y="114" class="bs">PagedAttention · 动态批大小 · 融合量化/解包核</text>
  <text x="358" y="129" class="bs">MoE 路由受微小数差扰动可能切专家</text>

  <!-- Bottom path: Train -->
  <rect x="224" y="154" width="268" height="62" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.3"/>
  <text x="358" y="176" class="bt" fill="#065f46">训练框架：FSDP / Megatron → π_train</text>
  <text x="358" y="194" class="bs">FlashAttention 训练核 · 变长打包 · 重计算</text>
  <text x="358" y="209" class="bs">BF16 仅 7 位尾数，不同归约顺序舍入漂移</text>

  <!-- Convergence to mismatch ratio -->
  <line x1="492" y1="105" x2="548" y2="136" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar-ti-r)"/>
  <line x1="492" y1="185" x2="548" y2="154" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar-ti-r)"/>

  <!-- Fix toolbox -->
  <rect x="552" y="74" width="300" height="142" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="702" y="98" class="bt" fill="#991b1b">数值比率漂移：π_train / π_infer ≠ 1</text>
  <line x1="568" y1="108" x2="836" y2="108" stroke="#fecaca"/>
  <text x="568" y="129" class="sm"><tspan font-weight="700" fill="#065f46">• TIS：</tspan>乘以截断权重 min(π_train/π_infer, C_TIS)</text>
  <text x="568" y="151" class="sm"><tspan font-weight="700" fill="#3730a3">• MIS / IcePop：</tspan>比率超界 token 双侧掩码屏蔽</text>
  <text x="568" y="173" class="sm"><tspan font-weight="700" fill="#b45309">• 精度工程：</tspan>输出头 FP32 logits（ScaleRL 验证）</text>
  <text x="568" y="195" class="sm"><tspan font-weight="700" fill="#991b1b">• 温度一致：</tspan>log π 必须按同采样温度缩放 logits</text>

  <!-- Bottom note -->
  <rect x="28" y="230" width="824" height="40" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="46" y="254" class="sm" fill="#92400e"><tspan font-weight="700">线上预警指标：</tspan>持续追踪 |log π_train − log π_infer| 均值与 P99；一旦随步数持续抬头，往往是梯度爆炸崩溃前数小时的精确前兆。</text>
</svg>
