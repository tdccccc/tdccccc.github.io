<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-label="后训练方法二维全景图：横轴为数据来源（离线到在线），纵轴为信号密度（序列级标量到逐 token 稠密），展示行业正朝右上角在线且逐 token 稠密区域演进">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .ax { font-size: 12px; font-weight: 700; fill: #334155; }
    .sm { font-size: 11.5px; fill: #475569; }
    .pt { font-size: 12.5px; font-weight: 700; fill: #1e293b; }
    .pt-new { font-size: 12.5px; font-weight: 700; fill: #065f46; }
  </style>
  <defs>
    <marker id="ar-land" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="860" height="430" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">后训练算法二维全景图：数据来源 × 信号密度</text>
  <text x="30" y="54" class="sub">绿色高亮为 2026 年代表工作，右上角浅绿象限正是整个领域汇聚的方向：保持在线采样，同时让每个 token 获得稠密信号。</text>

  <!-- Quadrant background -->
  <rect x="92" y="72" width="728" height="304" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <!-- Upper-right sweet spot -->
  <rect x="456" y="72" width="364" height="152" fill="#ecfdf5" fill-opacity="0.75"/>
  <text x="804" y="92" text-anchor="end" class="sm" fill="#047857" font-weight="700">2026 前沿汇聚区：在线 + 逐 Token 稠密</text>

  <!-- Quadrant dashed dividers -->
  <line x1="456" y1="72" x2="456" y2="376" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <line x1="92" y1="224" x2="820" y2="224" stroke="#94a3b8" stroke-dasharray="5 5"/>

  <!-- Axis labels -->
  <text x="96" y="396" class="sm">离线：固定静态数据集</text>
  <text x="816" y="396" text-anchor="end" class="sm">在线：当前策略实时自采样</text>
  <text x="456" y="418" text-anchor="middle" class="ax">数据来源（Off-Policy → On-Policy） →</text>
  <text transform="translate(36 224) rotate(-90)" text-anchor="middle" class="ax">信号密度（序列级标量 → 逐 Token 分布） →</text>
  <text x="84" y="370" text-anchor="end" class="sm">序列级</text>
  <text x="84" y="88" text-anchor="end" class="sm">逐 Token</text>

  <!-- Data points -->
  <!-- SFT -->
  <circle cx="176" cy="112" r="6" fill="#475569"/>
  <text x="190" y="116" class="pt">SFT（教师强制，逐 token 模仿）</text>

  <!-- DPO family -->
  <circle cx="176" cy="336" r="6" fill="#475569"/>
  <text x="190" y="340" class="pt">DPO · IPO · KTO · SimPO</text>

  <!-- Iterative DPO -->
  <circle cx="486" cy="296" r="6" fill="#4f46e5"/>
  <text x="500" y="300" class="pt" fill="#3730a3">迭代在线 DPO</text>

  <!-- GRPO family -->
  <circle cx="660" cy="342" r="6.5" fill="#4f46e5"/>
  <text x="646" y="346" text-anchor="end" class="pt" fill="#3730a3">GRPO · Dr.GRPO · DAPO · GSPO · CISPO</text>

  <!-- MaxRL / GDPO -->
  <circle cx="722" cy="300" r="6.5" fill="#059669"/>
  <text x="708" y="304" text-anchor="end" class="pt-new">MaxRL · GDPO（2026）</text>

  <!-- PPO -->
  <circle cx="640" cy="242" r="6" fill="#475569"/>
  <text x="626" y="246" text-anchor="end" class="pt">PPO（Critic + GAE 估计 token 优势）</text>

  <!-- PRM -->
  <circle cx="566" cy="186" r="6" fill="#475569"/>
  <text x="552" y="190" text-anchor="end" class="pt">过程奖励 PRM</text>

  <!-- OPD -->
  <circle cx="676" cy="118" r="7" fill="#059669"/>
  <text x="662" y="122" text-anchor="end" class="pt-new">在线蒸馏 OPD（DeepSeek-V4, 2026）</text>

  <!-- SDPO -->
  <circle cx="758" cy="158" r="7" fill="#059669"/>
  <text x="744" y="162" text-anchor="end" class="pt-new">SDPO 自蒸馏（2026）</text>

  <!-- Trend arrow -->
  <path d="M 782 332 C 812 278, 812 216, 774 168" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#ar-land)"/>
  <text x="794" y="256" text-anchor="end" class="sm" fill="#065f46" font-weight="700">更密信号</text>
</svg>
