<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 315" role="img" aria-label="Gao 等人发现的奖励模型过优化曲线：随着策略偏离参考模型的 KL 散度增大，代理奖励持续单调上升，而真实黄金奖励先升后降进入奖励作弊区">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .lbl { font-size: 12px; font-weight: 700; }
    .sm { font-size: 11.5px; fill: #475569; }
  </style>

  <rect width="860" height="315" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">Goodhart 定律实证：代理奖励过优化（Reward Overoptimization）</text>
  <text x="30" y="54" class="sub">随着 √KL(π_θ ‖ π_ref) 增大，代理奖励 r_φ 持续攀升，真实奖励 r* 却在越过拐点后掉头向下。</text>

  <!-- Plot region -->
  <!-- Safe zone & Hacking zone -->
  <rect x="76" y="76" width="290" height="190" fill="#ecfdf5" fill-opacity="0.55"/>
  <rect x="366" y="76" width="440" height="190" fill="#fef2f2" fill-opacity="0.6"/>

  <!-- Grid -->
  <line x1="76" y1="120" x2="806" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="76" y1="168" x2="806" y2="168" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="76" y1="216" x2="806" y2="216" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Axes -->
  <line x1="76" y1="266" x2="806" y2="266" stroke="#475569" stroke-width="1.5"/>
  <line x1="76" y1="76" x2="76" y2="266" stroke="#475569" stroke-width="1.5"/>

  <!-- Optimal KL vertical line -->
  <line x1="366" y1="76" x2="366" y2="266" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="220" y="96" text-anchor="middle" class="lbl" fill="#065f46">有效对齐区（KL 适中）</text>
  <text x="586" y="96" text-anchor="middle" class="lbl" fill="#991b1b">奖励作弊 / 过优化区（分布外刷分）</text>

  <!-- Proxy reward curve (keeps going up) -->
  <path d="M 76 236 C 170 212, 265 170, 366 142 C 490 112, 650 96, 796 86" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-dasharray="6 4"/>
  <text x="695" y="114" class="lbl" fill="#3730a3">代理奖励 r_φ（持续虚高）</text>

  <!-- Gold reward curve (rises then falls) -->
  <path d="M 76 236 C 170 210, 268 152, 366 150 C 460 148, 595 190, 796 254" fill="none" stroke="#059669" stroke-width="3"/>
  <circle cx="366" cy="150" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="380" y="146" class="lbl" fill="#b45309">最佳 KL 拐点</text>
  <text x="650" y="238" class="lbl" fill="#991b1b">真实质量 r*（先升后崩）</text>

  <!-- Axis labels -->
  <text x="441" y="294" text-anchor="middle" class="sm mono">优化距离 d = √KL(π_θ ‖ π_ref)  →  （训练步数增加或 β 过小）</text>
  <text transform="translate(46 172) rotate(-90)" text-anchor="middle" class="sm">奖励分数（相对 π_ref 增益）</text>

  <!-- Reference note -->
  <text x="76" y="284" class="sm mono" fill="#64748b">π_ref 起点</text>
</svg>
