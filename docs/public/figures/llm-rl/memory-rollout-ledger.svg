<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 305" role="img" aria-label="同步 RL 长尾气泡时间线与不同算法显存账本对比：左侧展示单个超长思维链回复如何令其余并发槽位空等超过一半墙钟时间，右侧对比 8B 模型在 PPO、GRPO 与离线 DPO 下的静态显存账本">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .pt { font-size: 13.5px; font-weight: 700; }
    .sm { font-size: 11px; fill: #475569; }
    .bar-t { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="880" height="305" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">RL 系统两笔硬账：Rollout 长尾气泡账 × 模型显存账</text>
  <text x="30" y="54" class="sub">左侧：同步模式下一条 16k 长尾轨迹如何拖垮整批 GPU 利用率；右侧：8B BF16 模型不同算法的静态训练显存拆解。</text>

  <!-- Left panel: Straggler Bubble Timeline -->
  <rect x="30" y="72" width="414" height="214" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="48" y="96" class="pt" fill="#991b1b">① 同步 Rollout 长尾气泡（一轮耗时占 75%–85%）</text>

  <!-- Lanes -->
  <text x="48" y="128" class="sm mono">y₁ (2k tok)</text>
  <rect x="122" y="114" width="60" height="20" rx="3" fill="#0284c7"/>
  <rect x="182" y="114" width="166" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3 2"/>
  <text x="265" y="128" text-anchor="middle" class="sm" fill="#991b1b">空闲等待气泡</text>

  <text x="48" y="156" class="sm mono">y₂ (4k tok)</text>
  <rect x="122" y="142" width="110" height="20" rx="3" fill="#0284c7"/>
  <rect x="232" y="142" width="116" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3 2"/>

  <text x="48" y="184" class="sm mono">y₃ (16k长尾)</text>
  <rect x="122" y="170" width="226" height="20" rx="3" fill="#d97706"/>
  <text x="235" y="184" text-anchor="middle" class="bar-t">最慢长尾决定整批屏障</text>

  <!-- Sync barrier + Trainer step -->
  <line x1="348" y1="108" x2="348" y2="202" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
  <rect x="352" y="114" width="76" height="76" rx="5" fill="#059669"/>
  <text x="390" y="148" text-anchor="middle" class="bar-t">前向/反向</text>
  <text x="390" y="165" text-anchor="middle" class="bar-t">~15% 时间</text>

  <text x="48" y="222" class="sm">解法 1：<tspan font-weight="700" fill="#1e293b">Partial Rollout</tspan>（到预算点挂起，下轮新权重续写）</text>
  <text x="48" y="242" class="sm">解法 2：<tspan font-weight="700" fill="#1e293b">异步分离 / PipelineRL</tspan>（推理训练并发流水）</text>
  <text x="48" y="264" class="sm" fill="#065f46">工程经验：长 CoT 下 Rollout 常占总墙钟时间的 70%–85%</text>

  <!-- Right panel: Static Memory Ledger (8B BF16 AdamW) -->
  <rect x="460" y="72" width="390" height="214" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="478" y="96" class="pt" fill="#3730a3">② 8B 模型静态显存账本（不含激活与 KV）</text>
  <text x="478" y="114" class="sm">单训练态模型 = 权重(2B) + 梯度(2B) + FP32主权重/Adam(12B) = 16 B/参数 ≈ 128 GB</text>

  <!-- PPO bar: 128 + 128 + 16 + 16 = 288 GB -->
  <text x="478" y="144" class="sm" font-weight="700">PPO-RLHF</text>
  <rect x="562" y="130" width="110" height="22" rx="3" fill="#4f46e5"/>
  <text x="617" y="145" text-anchor="middle" class="bar-t">Actor 128G</text>
  <rect x="674" y="130" width="110" height="22" rx="3" fill="#dc2626"/>
  <text x="729" y="145" text-anchor="middle" class="bar-t">Critic 128G</text>
  <rect x="786" y="130" width="28" height="22" rx="3" fill="#64748b"/>
  <text x="820" y="145" class="sm mono" font-weight="700">~288G</text>

  <!-- GRPO (w/ ref) bar: 128 + 16 = 144 GB -->
  <text x="478" y="182" class="sm" font-weight="700">GRPO+Ref</text>
  <rect x="562" y="168" width="110" height="22" rx="3" fill="#059669"/>
  <text x="617" y="183" text-anchor="middle" class="bar-t">Actor 128G</text>
  <rect x="674" y="168" width="18" height="22" rx="3" fill="#64748b"/>
  <text x="700" y="183" class="sm mono" font-weight="700">~144G（降 50%）</text>

  <!-- DAPO (RLVR beta=0) bar: 128 GB -->
  <text x="478" y="220" class="sm" font-weight="700">DAPO (β=0)</text>
  <rect x="562" y="206" width="110" height="22" rx="3" fill="#0284c7"/>
  <text x="617" y="221" text-anchor="middle" class="bar-t">仅 Actor 128G</text>
  <text x="680" y="221" class="sm mono" font-weight="700">~128G（CPU 验证）</text>

  <text x="478" y="256" class="sm">• 经 FSDP 切分到 8×80GB GPU，单卡静态仅 ~16 GB</text>
  <text x="478" y="274" class="sm">• 剩余显存需在 Rollout KV Cache 与训练激活间精细切换</text>
</svg>
