<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-label="PPO 与 GRPO 单轮迭代数据流对比：PPO 需要策略、价值、参考、奖励四个大模型并经 GAE 估计逐 token 优势；GRPO 去掉价值模型，通过每提示采样 G 条回复的组内标准化直接估计优势，并将 KL 移入损失项">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #1e293b; }
    .bt { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .bs { font-size: 11px; text-anchor: middle; fill: #475569; }
    .lbl { font-size: 11.5px; font-weight: 600; fill: #334155; }
  </style>
  <defs>
    <marker id="ar-pg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="ar-pg2-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="860" height="470" rx="8" fill="#fbfcfe"/>

  <!-- Top: PPO -->
  <text x="30" y="32" class="title" fill="#3730a3">PPO-RLHF：四模型在场，依靠价值函数 V_ψ + GAE 估计逐 Token 优势</text>

  <rect x="30" y="66" width="156" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="108" y="90" class="bt" fill="#065f46">策略 Actor π_θ</text>
  <text x="108" y="109" class="bs" fill="#047857">需要训练（更新参数）</text>

  <line x1="186" y1="94" x2="242" y2="94" stroke="#475569" stroke-width="1.5" marker-end="url(#ar-pg2)"/>
  <text x="214" y="85" text-anchor="middle" class="bs">采样</text>

  <rect x="246" y="66" width="126" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="309" y="90" class="bt">单条回复 y</text>
  <text x="309" y="109" class="bs mono">T 个 token</text>

  <rect x="424" y="44" width="212" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="66" class="bs" font-weight="600">参考模型 π_ref（冻结）→ KL 惩罚</text>

  <rect x="424" y="86" width="212" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="108" class="bs" font-weight="600">奖励模型 r_φ（冻结）→ r(x, y)</text>

  <rect x="424" y="128" width="212" height="36" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="530" y="150" class="bs" fill="#065f46" font-weight="700">价值 Critic V_ψ（训练）→ V(s_t)</text>

  <line x1="372" y1="94" x2="420" y2="62" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <line x1="372" y1="94" x2="420" y2="104" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <line x1="372" y1="94" x2="420" y2="146" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>

  <rect x="692" y="72" width="138" height="60" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <text x="761" y="96" class="bt" fill="#3730a3">GAE(γ, λ)</text>
  <text x="761" y="116" class="bs mono" fill="#4338ca">逐 token Â_t, R̂_t</text>

  <line x1="636" y1="62" x2="688" y2="90" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <line x1="636" y1="104" x2="688" y2="102" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <line x1="636" y1="146" x2="688" y2="114" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>

  <path d="M 761 132 V 202 H 108 V 126" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-pg2-g)"/>
  <line x1="530" y1="202" x2="530" y2="168" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-pg2-g)"/>
  <text x="270" y="194" class="lbl" fill="#047857">用 L^CLIP 更新策略 π_θ</text>
  <text x="546" y="192" class="lbl" fill="#047857">用 MSE 损失 L_V 更新 V_ψ</text>

  <!-- Divider -->
  <line x1="24" y1="234" x2="836" y2="234" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Bottom: GRPO -->
  <text x="30" y="268" class="title" fill="#065f46">GRPO：彻底拿掉价值模型 Critic，用同提示 G 条回复的组内比较估计优势</text>

  <rect x="30" y="306" width="156" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="108" y="330" class="bt" fill="#065f46">策略 Actor π_θ</text>
  <text x="108" y="349" class="bs" fill="#047857">唯一需要训练的模型</text>

  <line x1="186" y1="334" x2="242" y2="334" stroke="#475569" stroke-width="1.5" marker-end="url(#ar-pg2)"/>
  <text x="214" y="325" text-anchor="middle" class="bs">采样 G 次</text>

  <!-- Stacked group cards -->
  <rect x="256" y="298" width="126" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="251" y="302" width="126" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="246" y="306" width="126" height="56" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="309" y="330" class="bt">G 条回复组</text>
  <text x="309" y="349" class="bs mono">y₁, y₂, …, y_G</text>

  <rect x="424" y="284" width="212" height="36" rx="7" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="530" y="306" class="bs" font-weight="600">参考模型 π_ref（可选）→ k₃ 损失</text>

  <rect x="424" y="326" width="212" height="36" rx="7" fill="#f0fdf4" stroke="#34d399"/>
  <text x="530" y="348" class="bs" fill="#065f46" font-weight="600">验证器 / 奖励模型 → r₁ … r_G</text>

  <rect x="424" y="368" width="212" height="36" rx="7" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="530" y="390" class="bs" fill="#94a3b8">价值 Critic V_ψ：已移除（省一半训练显存）</text>

  <line x1="382" y1="334" x2="420" y2="302" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <line x1="382" y1="334" x2="420" y2="344" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>

  <rect x="692" y="314" width="138" height="60" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <text x="761" y="338" class="bt" fill="#065f46">组内标准化</text>
  <text x="761" y="358" class="bs mono" fill="#047857">(r_i − r̄) / std</text>

  <line x1="636" y1="344" x2="688" y2="344" stroke="#475569" stroke-width="1.3" marker-end="url(#ar-pg2)"/>
  <path d="M 636 302 H 666 V 442" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="672" y="424" class="bs" text-anchor="start">−β·KL</text>

  <path d="M 761 374 V 442 H 108 V 366" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-pg2-g)"/>
  <text x="350" y="434" class="lbl" fill="#047857">广播序列级优势 Â_i，用裁剪目标 − β·k₃ 仅更新 π_θ</text>
</svg>
