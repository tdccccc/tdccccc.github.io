<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 275" role="img" aria-label="MoE 强化学习路由抖动与三类解法对比：展示微小数值差异导致 Top-K 路由选中不同专家，并对比路由回放 R3、预测式路由回放 PR2 与序列级 GSPO 三种稳定方案">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .bt { font-size: 13.5px; font-weight: 700; text-anchor: middle; }
    .bs { font-size: 11px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  </style>

  <rect width="880" height="275" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">MoE 模型 RL 专属难题：专家路由翻转与三类稳定路线</text>
  <text x="30" y="54" class="sub">BF16 下 10⁻⁴ 级的路由器 logits 扰动，就足以让 Top-K 选择从专家 E₃ 翻成 E₇，导致单 token 概率比瞬间跳变数倍。</text>

  <!-- Routing flip illustration strip -->
  <rect x="30" y="72" width="820" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="96" class="bs" font-weight="700" fill="#991b1b">问题根源（Router Flip）：</text>
  <text x="210" y="96" class="bs mono" fill="#1e293b">推理侧 logits(E₃=0.412, E₇=0.411) → 激活 E₃</text>
  <text x="530" y="96" class="bs mono" fill="#dc2626">训练侧 logits(E₃=0.411, E₇=0.412) → 激活 E₇！</text>
  <text x="50" y="117" class="bs">结果：不同专家参数完全不同，单步更新后或跨框架评估时，个别 token 的 ρ_t 剧烈震荡并迅速摧毁策略熵与梯度范数。</text>

  <!-- 3 Solutions -->
  <!-- R3 -->
  <rect x="30" y="144" width="262" height="114" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/>
  <rect x="46" y="154" width="122" height="20" rx="10" fill="#4f46e5"/>
  <text x="107" y="168" class="pill">R3 路由回放 · 2510</text>
  <text x="46" y="196" class="bs" font-weight="700" fill="#3730a3">强制训练复用推理路由</text>
  <text x="46" y="216" class="bs">• Rollout 记录每层选中专家索引</text>
  <text x="46" y="234" class="bs">• 训练前向直接回放，源头零翻转</text>
  <text x="46" y="250" class="bs" fill="#64748b">局限：强 off-policy 下忽视路由漂移</text>

  <!-- PR2 -->
  <rect x="309" y="144" width="262" height="114" rx="9" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.3"/>
  <rect x="325" y="154" width="134" height="20" rx="10" fill="#0284c7"/>
  <text x="392" y="168" class="pill">PR2 预测回放 · 2606</text>
  <text x="325" y="196" class="bs" font-weight="700" fill="#075985">预测短期路由漂移再回放</text>
  <text x="325" y="216" class="bs">• 针对异步 / 多步 off-policy 更新</text>
  <text x="325" y="234" class="bs">• 显式建模路由器参数短期演变</text>
  <text x="325" y="250" class="bs" fill="#0369a1">进一步压低异步 MoE 训练方差</text>

  <!-- GSPO -->
  <rect x="588" y="144" width="262" height="114" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <rect x="604" y="154" width="126" height="20" rx="10" fill="#059669"/>
  <text x="667" y="168" class="pill">GSPO 算法解 · 2507</text>
  <text x="604" y="196" class="bs" font-weight="700" fill="#065f46">序列级几何平均天然抗噪</text>
  <text x="604" y="216" class="bs">• 整条序列对数比率平均 g_i(θ)</text>
  <text x="604" y="234" class="bs">• 单个 token 路由尖峰被整句摊平</text>
  <text x="604" y="250" class="bs" fill="#047857">无需修改内核记录路由，极简优雅</text>
</svg>
