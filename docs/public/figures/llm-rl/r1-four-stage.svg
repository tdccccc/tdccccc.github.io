<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-label="DeepSeek-R1 四阶段训练配方与蒸馏迁移流程：冷启动 SFT、推理导向 RL、拒绝采样加全量 SFT、全场景 RL，以及向小模型蒸馏的结论">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .st { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .sm { font-size: 11.5px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ar-r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="880" height="280" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">DeepSeek-R1 四阶段后训练配方（对比纯 RL 的 R1-Zero）</text>
  <text x="30" y="54" class="sub">先用数千条可读冷启动数据稳定语言格式，再用两轮 RL 与一轮大规模拒绝采样 SFT 兼顾巅峰推理与通用对齐。</text>

  <!-- Stage 1 -->
  <rect x="28" y="76" width="186" height="132" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="44" y="86" width="84" height="20" rx="10" fill="#64748b"/>
  <text x="86" y="100" class="pill">阶段 1 · SFT</text>
  <text x="121" y="128" class="st" fill="#1e293b">冷启动微调</text>
  <text x="42" y="150" class="sm">• 数千条高质量长 CoT</text>
  <text x="42" y="169" class="sm">• 解决 R1-Zero 混语</text>
  <text x="42" y="188" class="sm">  与可读性差的问题</text>

  <line x1="214" y1="142" x2="236" y2="142" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-r1)"/>

  <!-- Stage 2 -->
  <rect x="240" y="76" width="186" height="132" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="256" y="86" width="84" height="20" rx="10" fill="#059669"/>
  <text x="298" y="100" class="pill">阶段 2 · RL</text>
  <text x="333" y="128" class="st" fill="#065f46">推理导向 GRPO</text>
  <text x="254" y="150" class="sm">• 数学/代码/科学/逻辑</text>
  <text x="254" y="169" class="sm">• 奖励 = 准确率 +</text>
  <text x="254" y="188" class="sm">  语言一致性规则</text>

  <line x1="426" y1="142" x2="448" y2="142" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-r1)"/>

  <!-- Stage 3 -->
  <rect x="452" y="76" width="186" height="132" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/>
  <rect x="468" y="86" width="102" height="20" rx="10" fill="#4f46e5"/>
  <text x="519" y="100" class="pill">阶段 3 · RS+SFT</text>
  <text x="545" y="128" class="st" fill="#3730a3">拒绝采样 + SFT</text>
  <text x="466" y="150" class="sm">• 60万条筛选推理轨迹</text>
  <text x="466" y="169" class="sm">• 20万条通用非推理</text>
  <text x="466" y="188" class="sm">• 从 V3-Base 重新微调</text>

  <line x1="638" y1="142" x2="660" y2="142" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-r1)"/>

  <!-- Stage 4 -->
  <rect x="664" y="76" width="188" height="132" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="680" y="86" width="84" height="20" rx="10" fill="#059669"/>
  <text x="722" y="100" class="pill">阶段 4 · RL</text>
  <text x="758" y="128" class="st" fill="#065f46">全场景对齐 RL</text>
  <text x="678" y="150" class="sm">• 推理题继续用规则奖</text>
  <text x="678" y="169" class="sm">• 通用题接入 RM 评估</text>
  <text x="678" y="188" class="sm">  有用性与无害性</text>

  <!-- Distillation takeaway bar -->
  <rect x="28" y="222" width="824" height="44" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="46" y="249" class="sm" fill="#92400e" font-weight="700">关键实验结论（蒸馏 &gt; 小模型纯 RL）：</text>
  <text x="278" y="249" class="sm" fill="#78350f">用阶段 3 的 80 万条轨迹直接 SFT 蒸馏 1.5B–70B 小模型，显著强于在同规模小模型上直接跑大规模 RL。</text>
</svg>
