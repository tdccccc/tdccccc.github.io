<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 285" role="img" aria-label="七大主流开源 RL 框架生态矩阵：按训练规模从单机教学到千卡异步 MoE 集群分布，展示 TRL、OpenRLHF、veRL、slime、AReaL、ROLL 与 NeMo-RL 的后端组合与核心定位">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .ct { font-size: 13.5px; font-weight: 700; }
    .cs { font-size: 11px; fill: #475569; }
    .pill { font-size: 10px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  </style>

  <rect width="880" height="285" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">主流开源 RL 框架生态格局（2025–2026）</text>
  <text x="30" y="54" class="sub">按目标规模与异步程度分层：从轻量教学验证，到 HybridFlow 工业主力，再到千卡全异步 Agent 与 MoE 专用底座。</text>

  <!-- Tier 1: Lightweight -->
  <rect x="28" y="74" width="180" height="192" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="44" y="84" width="102" height="20" rx="10" fill="#64748b"/>
  <text x="95" y="98" class="pill">单机 / 快速原型</text>
  <text x="44" y="128" class="ct" fill="#1e293b">TRL (Hugging Face)</text>
  <text x="44" y="148" class="cs">• HF Transformers 生态</text>
  <text x="44" y="166" class="cs">• SFT/DPO/PPO/GRPO</text>
  <text x="44" y="184" class="cs">• 2026 已内置 SDPO</text>
  <text x="44" y="206" class="cs" font-weight="700" fill="#334155">定位：</text>
  <text x="44" y="224" class="cs">算法验证、教学与</text>
  <text x="44" y="242" class="cs">7B 级中小规模实验</text>

  <!-- Tier 2: Mainstream Industrial -->
  <rect x="224" y="74" width="298" height="192" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.4"/>
  <rect x="240" y="84" width="136" height="20" rx="10" fill="#4f46e5"/>
  <text x="308" y="98" class="pill">工业全能主力框架</text>

  <rect x="240" y="112" width="266" height="68" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="252" y="132" class="ct" fill="#3730a3">veRL（字节 Seed · HybridFlow）</text>
  <text x="252" y="151" class="cs">FSDP / Megatron + vLLM / SGLang；单/多控制器</text>
  <text x="252" y="168" class="cs">解耦，DAPO 等前沿算法事实参考实现</text>

  <rect x="240" y="188" width="266" height="68" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="252" y="208" class="ct" fill="#3730a3">OpenRLHF / NeMo-RL</text>
  <text x="252" y="227" class="cs">OpenRLHF：Ray+vLLM+DeepSpeed，REINFORCE++</text>
  <text x="252" y="244" class="cs">NeMo-RL：NVIDIA Megatron，原生支持 R3 路由回放</text>

  <!-- Tier 3: Large-scale Async & Agentic -->
  <rect x="538" y="74" width="314" height="192" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <rect x="554" y="84" width="174" height="20" rx="10" fill="#059669"/>
  <text x="641" y="98" class="pill">大规模异步 / MoE / Agentic</text>

  <rect x="554" y="112" width="282" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="566" y="130" class="ct" fill="#065f46">slime（智谱 / 清华 THUDM）</text>
  <text x="566" y="147" class="cs">Megatron + SGLang 异步解耦，支撑 GLM-4.5 / 5</text>

  <rect x="554" y="162" width="282" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="566" y="180" class="ct" fill="#065f46">AReaL（蚂蚁 / 清华）</text>
  <text x="566" y="197" class="cs">彻底全异步架构，消除长 CoT 与 Agent 长尾气泡</text>

  <rect x="554" y="212" width="282" height="44" rx="7" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="566" y="230" class="ct" fill="#065f46">ROLL（阿里巴巴）</text>
  <text x="566" y="247" class="cs">面向大规模 RLVR、多轮工具环境与异步调度</text>
</svg>
