<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 315" role="img" aria-label="RL 训练异常监控与排障归因树：将奖励异常、策略熵坍缩或爆炸、长度失控与训练推理漂移四大核心告警症状，逐一映射到最可能根因与立即止血动作">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .st { font-size: 13px; font-weight: 700; }
    .sm { font-size: 11px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  </style>

  <rect width="880" height="315" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">后训练 RL 故障归因树：从监控面板告警到精准定位修复</text>
  <text x="30" y="54" class="sub">训练曲线一异常不要盲调学习率：先对照下面四类高频症状，把问题锁定在奖励、探索、数据还是系统数值层。</text>

  <!-- Quadrant 1 -->
  <rect x="28" y="72" width="406" height="108" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <rect x="42" y="82" width="166" height="20" rx="10" fill="#dc2626"/>
  <text x="125" y="96" class="pill">症状 1 · 奖励骤升但评测反跌</text>
  <text x="42" y="122" class="st" fill="#991b1b">首疑：奖励作弊 / 验证器漏洞 / 格式权重过大</text>
  <text x="42" y="142" class="sm">• 立刻肉眼抽读 20 条高分回复，查多候选答案或修改测试</text>
  <text x="42" y="160" class="sm">• 行动：收紧提取正则与沙箱权限、提高 β、用 GDPO 解耦格式分</text>

  <!-- Quadrant 2 -->
  <rect x="446" y="72" width="406" height="108" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <rect x="460" y="82" width="184" height="20" rx="10" fill="#d97706"/>
  <text x="552" y="96" class="pill">症状 2 · 熵骤降且 pass@k 下滑</text>
  <text x="460" y="122" class="st" fill="#92400e">首疑：熵坍缩 / 对称裁剪压死探索 / 零方差组过高</text>
  <text x="460" y="142" class="sm">• 检查 Clip Fraction 与 Zero-Variance Group 占比</text>
  <text x="460" y="160" class="sm">• 行动：启用 Clip-Higher (0.28) / CISPO / 动态采样 / 调高温度</text>

  <!-- Quadrant 3 -->
  <rect x="28" y="192" width="406" height="108" rx="9" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/>
  <rect x="42" y="202" width="176" height="20" rx="10" fill="#4f46e5"/>
  <text x="130" y="216" class="pill">症状 3 · 长度暴涨或陷入复读</text>
  <text x="42" y="242" class="st" fill="#3730a3">首疑：GRPO 1/|y| 长度偏差 / L_max 硬截断噪音</text>
  <text x="42" y="262" class="sm">• 分别统计答对组与答错组的平均长度与截断比例</text>
  <text x="42" y="280" class="sm">• 行动：换 Token 级聚合或 Dr.GRPO 常数分母 + 超长缓冲塑形</text>

  <!-- Quadrant 4 -->
  <rect x="446" y="192" width="406" height="108" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4"/>
  <rect x="460" y="202" width="218" height="20" rx="10" fill="#059669"/>
  <text x="569" y="216" class="pill">症状 4 · 梯度尖峰与熵爆炸（吐乱码）</text>
  <text x="460" y="242" class="st" fill="#065f46">首疑：log π_train − log π_infer 漂移 / 温度未对齐 / MoE 翻转</text>
  <text x="460" y="262" class="sm">• 先核对温度缩放与 Token-in-Token-out，再查 train-infer 差值曲线</text>
  <text x="460" y="280" class="sm">• 行动：启用 TIS / IcePop、降 LR 至 1e-6、MoE 切 GSPO 或 R3</text>
</svg>
