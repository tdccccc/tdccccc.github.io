<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-label="后训练奖励信号谱系：按人工成本从高到低排列为人类偏好 Bradley-Terry RM、生成式评委与 RLAIF、评分细则 Rubrics、程序可验证奖励 RLVR，对比其覆盖范围、噪声与抗作弊能力">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .ct { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .cs { font-size: 11.5px; text-anchor: middle; fill: #475569; }
    .k { font-size: 11px; font-weight: 700; fill: #334155; }
    .v { font-size: 11px; fill: #475569; }
  </style>
  <defs>
    <linearGradient id="rwSpectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="880" height="310" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">后训练四大奖励信号谱系</text>
  <text x="30" y="54" class="sub">从左到右：人工标注成本递减、抗作弊能力增强，但任务覆盖面逐渐收窄；评分细则（Rubrics）正在填补中间地带。</text>

  <!-- Spectrum bar -->
  <rect x="30" y="68" width="820" height="8" rx="4" fill="url(#rwSpectrum)"/>
  <text x="30" y="92" class="k" fill="#b45309">← 开放任务覆盖广 · 依赖学习型代理 · 易被讨好</text>
  <text x="850" y="92" text-anchor="end" class="k" fill="#065f46">确定性程序检验 · 近零噪声 · 仅限可验证任务 →</text>

  <!-- Card 1: BT Scalar RM -->
  <rect x="30" y="106" width="194" height="186" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="127" y="130" class="ct" fill="#92400e">① 人类偏好 BT RM</text>
  <text x="127" y="148" class="cs mono">r_φ(x, y) ∈ ℝ</text>
  <line x1="44" y1="160" x2="210" y2="160" stroke="#fde68a"/>
  <text x="44" y="180" class="k">来源：</text><text x="82" y="180" class="v">标注员排序 y_w ≻ y_l</text>
  <text x="44" y="202" class="k">强项：</text><text x="82" y="202" class="v">对话、风格、安全对齐</text>
  <text x="44" y="224" class="k">痛点：</text><text x="82" y="224" class="v">分布外失真、长度偏差</text>
  <text x="44" y="246" class="k">代表：</text><text x="82" y="246" class="v">InstructGPT RLHF</text>
  <text x="44" y="274" class="v" fill="#b45309">需强 KL 约束防过优化</text>

  <!-- Card 2: RLAIF & GenRM -->
  <rect x="238" y="106" width="194" height="186" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.3"/>
  <text x="335" y="130" class="ct" fill="#3730a3">② RLAIF / 生成式 RM</text>
  <text x="335" y="148" class="cs mono">CoT Critique → Score</text>
  <line x1="252" y1="160" x2="418" y2="160" stroke="#c7d2fe"/>
  <text x="252" y="180" class="k">来源：</text><text x="290" y="180" class="v">原则 + 强模型充当评委</text>
  <text x="252" y="202" class="k">强项：</text><text x="290" y="202" class="v">低成本可扩展、可解释</text>
  <text x="252" y="224" class="k">痛点：</text><text x="290" y="224" class="v">放大评委偏见与套话</text>
  <text x="252" y="246" class="k">代表：</text><text x="290" y="246" class="v">Constitutional AI</text>
  <text x="252" y="274" class="v" fill="#4338ca">可用测试时算力提准</text>

  <!-- Card 3: Rubrics -->
  <rect x="446" y="106" width="194" height="186" rx="9" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3"/>
  <text x="543" y="130" class="ct" fill="#075985">③ 评分细则 Rubrics</text>
  <text x="543" y="148" class="cs mono">∑ w_k·1[满足 c_k]/∑w_k</text>
  <line x1="460" y1="160" x2="626" y2="160" stroke="#bae6fd"/>
  <text x="460" y="180" class="k">来源：</text><text x="498" y="180" class="v">每题定制加权检查清单</text>
  <text x="460" y="202" class="k">强项：</text><text x="498" y="202" class="v">医疗/研究/写作半结构化</text>
  <text x="460" y="224" class="k">痛点：</text><text x="498" y="224" class="v">细则质量决定奖励上限</text>
  <text x="460" y="246" class="k">代表：</text><text x="498" y="246" class="v">RaR · Rubric-ARM</text>
  <text x="460" y="274" class="v" fill="#0369a1">弥合 RM 与 RLVR 鸿沟</text>

  <!-- Card 4: RLVR -->
  <rect x="654" y="106" width="196" height="186" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.6"/>
  <text x="752" y="130" class="ct" fill="#065f46">④ 可验证奖励 RLVR</text>
  <text x="752" y="148" class="cs mono">1[verify(y, y*)] ∈ {0,1}</text>
  <line x1="668" y1="160" x2="836" y2="160" stroke="#a7f3d0"/>
  <text x="668" y="180" class="k">来源：</text><text x="706" y="180" class="v">数学比对、代码单测</text>
  <text x="668" y="202" class="k">强项：</text><text x="706" y="202" class="v">可长时间优化、可去 KL</text>
  <text x="668" y="224" class="k">痛点：</text><text x="706" y="224" class="v">仅 1 bit 信息、验证漏洞</text>
  <text x="668" y="246" class="k">代表：</text><text x="706" y="246" class="v">Tülu 3 · DeepSeek-R1</text>
  <text x="668" y="274" class="v" fill="#047857">长思维链推理核心引擎</text>
</svg>
