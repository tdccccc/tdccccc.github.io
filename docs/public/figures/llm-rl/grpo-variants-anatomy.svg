<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" role="img" aria-label="2025 年 GRPO 四大修正变体拆解图：展示 Dr.GRPO、DAPO、GSPO 与 CISPO 分别修改了 GRPO 目标函数的哪一个精确部位">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .title { font-size: 18px; font-weight: 700; fill: #1e293b; }
    .sub { font-size: 12.5px; fill: #64748b; }
    .eq { font-size: 14px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .ct { font-size: 13.5px; font-weight: 700; }
    .cs { font-size: 11.5px; fill: #475569; }
    .pill { font-size: 10.5px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ar-gv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="880" height="345" rx="8" fill="#fbfcfe"/>
  <text x="30" y="34" class="title">GRPO 目标函数解剖：2025 四大修正分别动了哪把手术刀</text>
  <text x="30" y="54" class="sub">所有 2025 年的 GRPO 变体都在修改同一条骨架公式的不同部位：聚合分母、优势标准化、重要性比粒度与裁剪梯度方式。</text>

  <!-- Central formula banner with highlighted slots -->
  <rect x="30" y="72" width="820" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="86" y="108" class="eq mono">J_GRPO = E [</text>

  <!-- Slot 1: Length aggregation -->
  <rect x="148" y="84" width="132" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="214" y="108" class="eq mono" fill="#92400e">1/G ∑ 1/|y_i| ∑</text>

  <!-- Slot 2: Min / Clip -->
  <rect x="292" y="84" width="182" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="383" y="108" class="eq mono" fill="#991b1b">min( ρ_{i,t} , clip(ρ) )</text>

  <!-- Slot 3: Ratio -->
  <rect x="486" y="84" width="128" height="38" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="550" y="108" class="eq mono" fill="#3730a3">ρ_{i,t}(θ)</text>

  <!-- Slot 4: Advantage -->
  <rect x="626" y="84" width="146" height="38" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.4"/>
  <text x="699" y="108" class="eq mono" fill="#065f46">Â = (r_i−r̄)/std</text>

  <text x="810" y="108" class="eq mono">− β·k₃ ]</text>

  <!-- Connector lines -->
  <line x1="214" y1="122" x2="128" y2="164" stroke="#d97706" stroke-width="1.5" marker-end="url(#ar-gv)"/>
  <line x1="383" y1="122" x2="336" y2="164" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar-gv)"/>
  <line x1="550" y1="122" x2="544" y2="164" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#ar-gv)"/>
  <line x1="699" y1="122" x2="752" y2="164" stroke="#059669" stroke-width="1.5" marker-end="url(#ar-gv)"/>

  <!-- 4 Cards -->
  <!-- Dr.GRPO -->
  <rect x="28" y="168" width="196" height="156" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <rect x="42" y="178" width="78" height="20" rx="10" fill="#d97706"/>
  <text x="81" y="192" class="pill">Dr.GRPO</text>
  <text x="128" y="192" class="cs">2025-03</text>
  <text x="42" y="218" class="ct" fill="#92400e">消除长度与难度偏差</text>
  <text x="42" y="240" class="cs">• 1/|y_i| → 常数 1/L_max</text>
  <text x="42" y="260" class="cs">• 去掉 /std，直接用 r_i−r̄</text>
  <text x="42" y="280" class="cs">• 避免错误回复因越长</text>
  <text x="42" y="298" class="cs">  单 token 受罚越轻的假增长</text>

  <!-- DAPO -->
  <rect x="236" y="168" width="196" height="156" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <rect x="250" y="178" width="66" height="20" rx="10" fill="#dc2626"/>
  <text x="283" y="192" class="pill">DAPO</text>
  <text x="326" y="192" class="cs">2025-03</text>
  <text x="250" y="218" class="ct" fill="#991b1b">防熵坍缩与长 CoT 优化</text>
  <text x="250" y="240" class="cs">• Clip-Higher: 0.2 / 0.28</text>
  <text x="250" y="260" class="cs">• 动态采样剔除全对/全错组</text>
  <text x="250" y="280" class="cs">• Token 等权聚合 (1/∑|y_i|)</text>
  <text x="250" y="298" class="cs">• 超长软惩罚 + β = 0</text>

  <!-- GSPO -->
  <rect x="444" y="168" width="196" height="156" rx="9" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.3"/>
  <rect x="458" y="178" width="66" height="20" rx="10" fill="#4f46e5"/>
  <text x="491" y="192" class="pill">GSPO</text>
  <text x="534" y="192" class="cs">2025-07</text>
  <text x="458" y="218" class="ct" fill="#3730a3">序列级比率稳住 MoE</text>
  <text x="458" y="240" class="cs">• 比率改序列几何平均 g_i</text>
  <text x="458" y="260" class="cs">• 整条序列一起保留或裁剪</text>
  <text x="458" y="280" class="cs">• ε 取 10⁻⁴ 量级</text>
  <text x="458" y="298" class="cs">• 对 MoE 专家抖动免疫</text>

  <!-- CISPO -->
  <rect x="652" y="168" width="200" height="156" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <rect x="666" y="178" width="68" height="20" rx="10" fill="#059669"/>
  <text x="700" y="192" class="pill">CISPO</text>
  <text x="744" y="192" class="cs">2025-06</text>
  <text x="666" y="218" class="ct" fill="#065f46">裁剪权重，保留全量梯度</text>
  <text x="666" y="240" class="cs">• sg(clip(ρ)) · Â · log π_θ</text>
  <text x="666" y="260" class="cs">• 不把反思分叉 token 截零</text>
  <text x="666" y="280" class="cs">• 适合长 CoT 与高复用步数</text>
  <text x="666" y="298" class="cs">• ScaleRL 选定其为高上限损失</text>
</svg>
