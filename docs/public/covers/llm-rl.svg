<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="LLM 强化学习：原理与后训练实践 封面">
  <defs>
    <linearGradient id="rlCoverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a17"/>
      <stop offset="52%" stop-color="#0d2b2a"/>
      <stop offset="100%" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="rlAccentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rlCurveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="rlGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card base -->
  <rect width="360" height="480" rx="14" fill="url(#rlCoverBg)"/>
  <rect width="360" height="480" rx="14" fill="url(#rlGrid)"/>

  <!-- Spine accent -->
  <rect x="0" y="0" width="8" height="480" rx="2" fill="url(#rlAccentLine)"/>

  <!-- Top kicker -->
  <text x="32" y="44" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2">POST-TRAINING · VOL. 02</text>
  <rect x="256" y="29" width="74" height="22" rx="11" fill="#0f2926" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="293" y="44" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">20 章 · 26 图</text>

  <!-- Title block -->
  <text x="32" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5">LLM 强化学习</text>
  <text x="32" y="138" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">原理与后训练实践</text>
  <rect x="32" y="156" width="88" height="3" rx="1.5" fill="url(#rlAccentLine)"/>

  <!-- Policy Tilt & Clip geometric visual -->
  <g transform="translate(32, 192)">
    <rect x="0" y="0" width="296" height="168" rx="10" fill="#071315" fill-opacity="0.78" stroke="#1e3a3a" stroke-width="1"/>

    <!-- Sigmoid / Policy reward scaling curve -->
    <path d="M 24 128 C 72 126, 114 114, 152 76 C 188 40, 224 28, 274 26 L 274 128 Z" fill="url(#rlCurveFill)"/>
    <path d="M 24 128 C 72 126, 114 114, 152 76 C 188 40, 224 28, 274 26" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- PPO Clip / KL reference line -->
    <path d="M 24 114 L 194 46 L 274 46" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
    <path d="M 24 96 C 95 92, 160 80, 274 92" fill="none" stroke="#f87171" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="3 3"/>

    <!-- Axes -->
    <line x1="24" y1="128" x2="276" y2="128" stroke="#334155" stroke-width="1.2"/>
    <line x1="24" y1="18" x2="24" y2="128" stroke="#334155" stroke-width="1.2"/>

    <!-- Markers -->
    <circle cx="152" cy="76" r="4.5" fill="#34d399" stroke="#ecfdf5" stroke-width="1.5"/>
    <text x="160" y="84" fill="#6ee7b7" font-family="ui-monospace, Menlo, monospace" font-size="9.5">π* ∝ π_ref·exp(r/β)</text>

    <circle cx="194" cy="46" r="4" fill="#38bdf8"/>
    <line x1="194" y1="46" x2="194" y2="128" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="3 3"/>
    <text x="198" y="38" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace" font-size="9.5">1+ε_high</text>

    <text x="32" y="32" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="9">E[r(x,y)] − β·KL</text>
    <text x="272" y="106" text-anchor="end" fill="#fca5a5" font-family="ui-monospace, Menlo, monospace" font-size="9">KL / Entropy</text>

    <!-- Group advantage mini-bars at bottom -->
    <g transform="translate(24, 141)">
      <rect x="0" y="0" width="14" height="11" rx="2" fill="#34d399"/>
      <rect x="18" y="3" width="14" height="8" rx="2" fill="#34d399" fill-opacity="0.7"/>
      <rect x="36" y="6" width="14" height="5" rx="2" fill="#f87171" fill-opacity="0.8"/>
      <rect x="54" y="0" width="14" height="11" rx="2" fill="#2dd4bf"/>
      <rect x="72" y="5" width="14" height="6" rx="2" fill="#f87171" fill-opacity="0.65"/>
      <rect x="90" y="2" width="14" height="9" rx="2" fill="#34d399"/>
      <text x="116" y="9" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="9.2">GRPO · RLVR · Agentic · System</text>
    </g>
  </g>

  <!-- Tech pillar badges -->
  <g transform="translate(32, 384)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
    <rect x="0" y="0" width="88" height="22" rx="4" fill="#0f2926" stroke="#1e3a3a"/>
    <text x="44" y="14.5" text-anchor="middle" fill="#e2e8f0">PPO / GRPO</text>

    <rect x="96" y="0" width="96" height="22" rx="4" fill="#0f2926" stroke="#1e3a3a"/>
    <text x="144" y="14.5" text-anchor="middle" fill="#e2e8f0">RLVR / OPD</text>

    <rect x="200" y="0" width="96" height="22" rx="4" fill="#0f2926" stroke="#1e3a3a"/>
    <text x="248" y="14.5" text-anchor="middle" fill="#e2e8f0">veRL / slime</text>
  </g>

  <!-- Footer brand -->
  <line x1="32" y1="428" x2="328" y2="428" stroke="#1e3a3a" stroke-width="1"/>
  <text x="32" y="454" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.8">TDCCCCC'S ATLAS</text>
  <text x="328" y="454" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">RLHF · Reasoning · Agents</text>
</svg>
