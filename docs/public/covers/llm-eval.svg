<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="LLM 与 Agent 评测：原理、基准与工程实践 封面">
  <defs>
    <linearGradient id="evalCoverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141024"/>
      <stop offset="52%" stop-color="#1e1738"/>
      <stop offset="100%" stop-color="#271934"/>
    </linearGradient>
    <linearGradient id="evalAccentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="52%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="evalPassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="evalGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card base -->
  <rect width="360" height="480" rx="14" fill="url(#evalCoverBg)"/>
  <rect width="360" height="480" rx="14" fill="url(#evalGrid)"/>

  <!-- Spine accent -->
  <rect x="0" y="0" width="8" height="480" rx="2" fill="url(#evalAccentLine)"/>

  <!-- Top kicker -->
  <text x="32" y="44" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.0">EVALUATION · VOL. 03</text>
  <rect x="248" y="29" width="82" height="22" rx="11" fill="#23193f" stroke="#f59e0b" stroke-opacity="0.55"/>
  <text x="289" y="44" text-anchor="middle" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">20 章 · 25 图</text>

  <!-- Title block -->
  <text x="32" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29.5" font-weight="700" letter-spacing="-0.5">LLM 与 Agent 评测</text>
  <text x="32" y="138" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">原理、基准与工程实践</text>
  <rect x="32" y="156" width="88" height="3" rx="1.5" fill="url(#evalAccentLine)"/>

  <!-- pass@k vs pass^k & Confidence Interval geometric visual -->
  <g transform="translate(32, 192)">
    <rect x="0" y="0" width="296" height="168" rx="10" fill="#0f0c1d" fill-opacity="0.82" stroke="#362a57" stroke-width="1"/>

    <!-- pass@k area + rising curve -->
    <path d="M 24 72 C 74 44, 134 29, 272 24 L 272 128 L 24 128 Z" fill="url(#evalPassFill)"/>
    <path d="M 24 72 C 74 44, 134 29, 272 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- pass^k decaying reliability curve -->
    <path d="M 24 72 C 78 96, 148 116, 272 124" fill="none" stroke="#fb7185" stroke-width="2.3" stroke-linecap="round"/>

    <!-- Calibration / CI dashed band -->
    <line x1="146" y1="24" x2="146" y2="128" stroke="#a78bfa" stroke-opacity="0.45" stroke-dasharray="3 3"/>

    <!-- Axes -->
    <line x1="24" y1="128" x2="276" y2="128" stroke="#475569" stroke-width="1.2"/>
    <line x1="24" y1="18" x2="24" y2="128" stroke="#475569" stroke-width="1.2"/>

    <!-- Error-bar markers at k=5 -->
    <line x1="146" y1="24" x2="146" y2="44" stroke="#fcd34d" stroke-width="1.5"/>
    <line x1="141" y1="24" x2="151" y2="24" stroke="#fcd34d" stroke-width="1.5"/>
    <line x1="141" y1="44" x2="151" y2="44" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="146" cy="34" r="4.3" fill="#f59e0b" stroke="#fffbeb" stroke-width="1.4"/>
    <text x="155" y="42" fill="#fcd34d" font-family="ui-monospace, Menlo, monospace" font-size="9.5">pass@k (Upper)</text>

    <circle cx="146" cy="109" r="4.3" fill="#fb7185" stroke="#fff1f2" stroke-width="1.4"/>
    <text x="155" y="105" fill="#fda4af" font-family="ui-monospace, Menlo, monospace" font-size="9.5">pass^k (Prod Rel)</text>

    <!-- Single-shot origin -->
    <circle cx="24" cy="72" r="3.8" fill="#a78bfa"/>
    <text x="32" y="66" fill="#c4b5fd" font-family="ui-monospace, Menlo, monospace" font-size="9">p (k=1)</text>
    <text x="272" y="75" text-anchor="end" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="9">95% CI · RG Calib</text>

    <!-- Evaluation pipeline mini-strip at bottom -->
    <g transform="translate(24, 141)">
      <rect x="0" y="0" width="16" height="10" rx="2" fill="#f59e0b"/>
      <rect x="20" y="0" width="16" height="10" rx="2" fill="#fb7185"/>
      <rect x="40" y="0" width="16" height="10" rx="2" fill="#a78bfa"/>
      <rect x="60" y="0" width="16" height="10" rx="2" fill="#38bdf8"/>
      <rect x="80" y="0" width="16" height="10" rx="2" fill="#34d399"/>
      <text x="106" y="9" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="9.2">Stats · Judge · Agent · EDD</text>
    </g>
  </g>

  <!-- Tech pillar badges -->
  <g transform="translate(32, 384)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
    <rect x="0" y="0" width="90" height="22" rx="4" fill="#23193f" stroke="#362a57"/>
    <text x="45" y="14.5" text-anchor="middle" fill="#e2e8f0">Stats / RG</text>

    <rect x="98" y="0" width="98" height="22" rx="4" fill="#23193f" stroke="#362a57"/>
    <text x="147" y="14.5" text-anchor="middle" fill="#e2e8f0">SWE / MCP / τ²</text>

    <rect x="204" y="0" width="92" height="22" rx="4" fill="#23193f" stroke="#362a57"/>
    <text x="250" y="14.5" text-anchor="middle" fill="#e2e8f0">Harness / EDD</text>
  </g>

  <!-- Footer brand -->
  <line x1="32" y1="428" x2="328" y2="428" stroke="#362a57" stroke-width="1"/>
  <text x="32" y="454" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.8">TDCCCCC'S ATLAS</text>
  <text x="328" y="454" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">Benchmarks · Agents · Loop</text>
</svg>
