<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="LLM 推理工程：原理与方法 封面">
  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="roofFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card base -->
  <rect width="360" height="480" rx="14" fill="url(#coverBg)"/>
  <rect width="360" height="480" rx="14" fill="url(#grid)"/>

  <!-- Spine accent -->
  <rect x="0" y="0" width="8" height="480" rx="2" fill="url(#accentLine)"/>

  <!-- Top kicker -->
  <text x="32" y="44" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2">AI INFRA · VOL. 01</text>
  <rect x="258" y="29" width="72" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="294" y="44" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">23 章 · 35 图</text>

  <!-- Title block -->
  <text x="32" y="102" fill="#f8fafc" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="31" font-weight="700" letter-spacing="-0.5">LLM 推理工程</text>
  <text x="32" y="138" fill="#cbd5e1" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">原理与方法</text>
  <rect x="32" y="156" width="88" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Roofline & KV paging geometric diagram -->
  <g transform="translate(32, 192)">
    <rect x="0" y="0" width="296" height="168" rx="10" fill="#0b1120" fill-opacity="0.72" stroke="#334155" stroke-width="1"/>

    <!-- Roofline polygon + curve -->
    <path d="M 24 134 L 136 42 L 274 42 L 274 134 Z" fill="url(#roofFill)"/>
    <path d="M 24 134 L 136 42 L 274 42" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- H100 upper dashed roofline -->
    <path d="M 48 134 L 166 24 L 274 24" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>

    <!-- Axes -->
    <line x1="24" y1="134" x2="276" y2="134" stroke="#475569" stroke-width="1.2"/>
    <line x1="24" y1="18" x2="24" y2="134" stroke="#475569" stroke-width="1.2"/>

    <!-- Operating points: Decode & Prefill -->
    <circle cx="62" cy="103" r="5" fill="#f472b6" stroke="#fdf2f8" stroke-width="1.5"/>
    <text x="72" y="107" fill="#f9a8d4" font-family="ui-monospace, Menlo, monospace" font-size="10">Decode (Mem)</text>

    <circle cx="136" cy="42" r="4.5" fill="#38bdf8"/>
    <line x1="136" y1="42" x2="136" y2="134" stroke="#38bdf8" stroke-opacity="0.35" stroke-dasharray="3 3"/>
    <text x="142" y="60" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace" font-size="9.5">Ridge 156</text>

    <circle cx="218" cy="42" r="5" fill="#34d399" stroke="#ecfdf5" stroke-width="1.5"/>
    <text x="196" y="34" fill="#6ee7b7" font-family="ui-monospace, Menlo, monospace" font-size="10">Prefill (Compute)</text>

    <!-- KV blocks mini-strip at bottom -->
    <g transform="translate(24, 144)">
      <rect x="0" y="0" width="24" height="10" rx="2" fill="#38bdf8" fill-opacity="0.75"/>
      <rect x="28" y="0" width="24" height="10" rx="2" fill="#38bdf8" fill-opacity="0.75"/>
      <rect x="56" y="0" width="24" height="10" rx="2" fill="#818cf8" fill-opacity="0.75"/>
      <rect x="84" y="0" width="24" height="10" rx="2" fill="#34d399" fill-opacity="0.75"/>
      <rect x="112" y="0" width="24" height="10" rx="2" fill="#f472b6" fill-opacity="0.75"/>
      <rect x="140" y="0" width="24" height="10" rx="2" fill="#334155"/>
      <text x="176" y="9" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="9.5">KV Paging · Kernel · NPU</text>
    </g>
  </g>

  <!-- Tech pillar badges -->
  <g transform="translate(32, 384)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
    <rect x="0" y="0" width="84" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="42" y="14.5" text-anchor="middle" fill="#e2e8f0">Roofline</text>

    <rect x="92" y="0" width="104" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="144" y="14.5" text-anchor="middle" fill="#e2e8f0">vLLM / SGLang</text>

    <rect x="204" y="0" width="92" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="14.5" text-anchor="middle" fill="#e2e8f0">CUDA / Triton</text>
  </g>

  <!-- Footer brand -->
  <line x1="32" y1="428" x2="328" y2="428" stroke="#334155" stroke-width="1"/>
  <text x="32" y="454" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.8">TDCCCCC'S ATLAS</text>
  <text x="328" y="454" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">A100 · H100 · Ascend</text>
</svg>
